<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Forever Card™ — Dynamic Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #05070e; color: #f3f4f6; }
.card-face { background: linear-gradient(180deg, #0f172a 0%, #090d16 100%); border: 2px solid #1e293b; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9); }
.led-display { background: #020617; border: 1px solid #1e293b; font-family: 'Courier New', Courier, monospace; box-shadow: inset 0 2px 8px rgba(0,0,0,0.8); }
@keyframes pulse-red {
  0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
  100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}
.mic-pulsing { animation: pulse-red 1.5s infinite; background-color: #dc2626 !important; color: #ffffff !important; }
.type-btn-active { background-color: #f59e0b !important; color: #000000 !important; font-weight: 900 !important; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 pb-24 relative">

<div class="max-w-md w-full card-face rounded-3xl p-5 relative space-y-4 shadow-2xl my-auto">
  
  <!-- HEADER & FULL DYNAMIC CUSTOMER CONTACT CARD -->
  <div class="border-b border-slate-800 pb-3 space-y-1">
    <div class="flex items-center justify-between">
      <h1 id="customerTitle" class="text-xl font-black text-white tracking-tight flex items-center gap-2">
        <i class="fa-solid fa-address-card text-blue-400"></i> Loading Card...
      </h1>
      <a href="/" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-3 py-1.5 rounded-xl border border-slate-700 transition">Hub</a>
    </div>
    
    <div id="customerContactBox" class="bg-slate-950/80 rounded-xl p-2.5 border border-slate-800 text-xs space-y-1 text-gray-300">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-location-dot text-red-400"></i>
        <span id="customerAddress">Loading Address...</span>
      </div>
      <div class="flex items-center justify-between pt-0.5">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-phone text-emerald-400"></i>
          <a id="customerPhoneLink" href="#" class="text-emerald-400 font-bold hover:underline">Phone on File</a>
        </div>
        <span id="cardSubtext" class="text-[10px] text-blue-400 font-bold uppercase tracking-wider">Forever Card™</span>
      </div>
    </div>
  </div>

  <!-- LED STATUS DISPLAY -->
  <div class="led-display rounded-2xl p-2.5 text-center border border-blue-900/50 min-h-[44px] flex items-center justify-center">
    <div id="statusLed" class="text-xs font-bold text-emerald-400 tracking-wide">CARD ACTIVE ⚡</div>
  </div>

  <!-- DRAFT BUILDER WITH DOCUMENT TYPE TOGGLE -->
  <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 space-y-3">
    
    <div class="flex items-center justify-between bg-slate-950 p-1.5 rounded-xl border border-slate-800">
      <button type="button" onclick="setDocType('Estimate')" id="btnTypeEstimate" class="flex-1 text-[11px] py-1 rounded-lg text-gray-400 font-bold transition">Estimate</button>
      <button type="button" onclick="setDocType('Proposal')" id="btnTypeProposal" class="flex-1 text-[11px] py-1 rounded-lg text-gray-400 font-bold transition">Proposal</button>
      <button type="button" onclick="setDocType('Invoice')" id="btnTypeInvoice" class="flex-1 text-[11px] py-1 rounded-lg text-gray-400 font-bold transition type-btn-active">Invoice</button>
    </div>

    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
      <span id="docTitleLabel" class="text-xs font-black text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
        <i class="fa-solid fa-file-invoice-dollar"></i> Draft Invoice
      </span>
      <div class="flex gap-1.5 items-center">
        <button type="button" onclick="openSearchModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-2.5 py-1 rounded-lg text-[11px] flex items-center gap-1 shadow transition active:scale-95">
          <i class="fa-solid fa-magnifying-glass"></i> Search
        </button>
        <button type="button" id="invoiceMicBtn" onclick="toggleInvoiceVoice()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-2.5 py-1 rounded-lg text-[11px] flex items-center gap-1 shadow transition active:scale-95">
          <i class="fa-solid fa-microphone"></i> Talk
        </button>
        <button type="button" onclick="addInvoiceRow()" class="text-[10px] bg-amber-950/80 hover:bg-amber-900 text-amber-300 font-bold px-2 py-1 rounded-lg border border-amber-800/60">+ Add</button>
      </div>
    </div>

    <!-- NATIVE AUTOCOMPLETE DATALIST FOR ALL 1,090 ITEMS -->
    <datalist id="partsCatalog"></datalist>

    <!-- LINE ITEMS CONTAINER -->
    <div id="invoiceRows" class="space-y-2">
      <div class="bg-slate-950 p-2 rounded-xl border border-slate-800 invoice-row space-y-1.5">
        <div class="flex gap-2 items-center">
          <input type="text" list="partsCatalog" placeholder="Type item name..." oninput="handleInRowSearch(this)" class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white item-desc focus:outline-none focus:border-amber-500">
          <select onchange="calculateInvoiceTotals()" class="bg-slate-900 border border-slate-800 rounded-xl px-1 py-1.5 text-[10px] text-gray-300 item-type focus:outline-none">
            <option value="part">Part (Tax)</option>
            <option value="labor">Labor (No Tax)</option>
          </select>
          <input type="number" step="0.01" value="0.00" oninput="calculateInvoiceTotals()" placeholder="Price" class="w-20 bg-slate-900 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-white font-mono text-right item-price focus:outline-none focus:border-amber-500">
          <button type="button" onclick="removeInvoiceRow(this)" class="text-gray-500 hover:text-red-400 px-1 text-xs">✕</button>
        </div>
        <input type="text" placeholder="+ Note / warranty..." oninput="autoSaveLocalDraft()" class="w-full bg-slate-900/60 border border-slate-800 rounded-lg px-2 py-1 text-[10px] text-gray-300 item-note focus:outline-none focus:border-amber-500/50">
      </div>
    </div>

    <!-- CALCULATIONS -->
    <div class="border-t border-slate-800 pt-2 space-y-1 text-xs font-mono">
      <div class="flex justify-between text-gray-400">
        <span>Subtotal:</span>
        <span id="subtotalVal">$0.00</span>
      </div>
      <div class="flex justify-between text-gray-400">
        <span>MD Tax (6% Parts Only):</span>
        <span id="taxVal">$0.00</span>
      </div>
      <div class="flex justify-between font-bold text-emerald-400 text-sm pt-1 border-t border-slate-800/60">
        <span>Total Due:</span>
        <span id="totalVal">$0.00</span>
      </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="grid grid-cols-3 gap-1.5 pt-1">
      <button type="button" onclick="saveDraftToCard()" class="bg-slate-800 hover:bg-slate-700 text-teal-300 border border-teal-800/50 font-bold py-2 px-1.5 rounded-xl text-[11px] flex items-center justify-center gap-1 shadow transition active:scale-95">
        <i class="fa-solid fa-floppy-disk"></i> Save Draft
      </button>
      <button type="button" onclick="generateStripeCheckout()" class="bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-bold py-2 px-3 rounded-xl text-[11px] flex items-center justify-center gap-1 shadow transition active:scale-95">
        <i class="fa-solid fa-credit-card"></i> Stripe
      </button>
      <button type="button" onclick="sendSmsInvoice()" class="bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-500 hover:to-emerald-600 text-white font-bold py-2 px-3 rounded-xl text-[11px] flex items-center justify-center gap-1 shadow transition active:scale-95">
        <i class="fa-solid fa-comment-sms"></i> 1-Tap SMS
      </button>
    </div>
  </div>

  <!-- NOTES & TIMELINE -->
  <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 space-y-2.5">
    <div class="text-xs font-black text-teal-300 uppercase tracking-wider flex items-center gap-1.5">
      <i class="fa-solid fa-clock-rotate-left"></i> Card Notes & Updates
    </div>
    <div class="flex gap-2">
      <input type="text" id="cardNoteInput" placeholder="Type note for customer card..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-teal-500" onkeydown="if(event.key==='Enter') postCardNote()">
      <button type="button" onclick="postCardNote()" class="bg-teal-600 hover:bg-teal-500 text-white font-bold px-3 py-2 rounded-xl text-xs transition active:scale-95">Post Note</button>
    </div>
  </div>

</div>

<!-- VISUAL INVENTORY SEARCH MODAL POPUP -->
<div id="searchModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
  <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-4 space-y-3 shadow-2xl">
    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
      <h3 class="text-sm font-black text-amber-400 uppercase tracking-wider flex items-center gap-2">
        <i class="fa-solid fa-boxes-stacked"></i> Search Catalog (1,090 Items)
      </h3>
      <button onclick="closeSearchModal()" class="text-gray-400 hover:text-white font-bold text-lg">✕</button>
    </div>

    <div id="modalResultsList" class="max-h-60 overflow-y-auto space-y-1.5 pr-1"></div>
  </div>
</div>

window.onload = function() {
  var params = new URLSearchParams(window.location.search);
  currentCardId = params.get('id') || '';
  var rawTitle = params.get('title') || params.get('customer') || '';
  var rawAddress = params.get('address') || '';
  var rawPhone = params.get('phone') || '';
  
  if (rawTitle) {
    var decoded = decodeURIComponent(rawTitle);
    currentCustomerTitle = decoded
      .replace(/\[.*?\]/g, '')
      .replace(/Note:.*/i, '')
      .replace(/Schedule.*appointment for /i, '')
      .replace(/Okay let's add.*/i, '')
      .replace(/for noon today.*/i, '')
      .replace(/for today.*/i, '')
      .replace(/at .*/i, '')
      .replace(/ID:.*Forever Card.*/i, '')
      .trim();

    if (!currentCustomerTitle) currentCustomerTitle = 'Richard Smothers';
    document.getElementById('customerTitle').innerHTML = '<i class="fa-solid fa-address-card text-blue-400"></i> ' + escapeHtml(currentCustomerTitle);
    document.title = currentCustomerTitle + ' — Forever Card™';
  } else {
    currentCustomerTitle = 'Richard Smothers';
    document.getElementById('customerTitle').innerHTML = '<i class="fa-solid fa-address-card text-blue-400"></i> Richard Smothers';
  }

  if (rawAddress) {
    document.getElementById('customerAddress').textContent = decodeURIComponent(rawAddress);
  } else if (currentCustomerTitle.toLowerCase().includes('smothers')) {
    document.getElementById('customerAddress').textContent = '1415 Kingsway Rd, Baltimore, MD 21218';
    document.getElementById('customerPhoneLink').textContent = '410-376-9061';
    document.getElementById('customerPhoneLink').href = 'tel:4103769061';
  } else {
    document.getElementById('customerAddress').textContent = 'Address on File';
  }

  if (rawPhone) {
    document.getElementById('customerPhoneLink').textContent = decodeURIComponent(rawPhone);
    document.getElementById('customerPhoneLink').href = 'tel:' + rawPhone.replace(/[^0-9]/g, '');
  }

  if (currentCardId) {
    document.getElementById('cardSubtext').textContent = 'ID: ' + currentCardId;

  // POPULATE NATIVE DATALIST WITH ALL 1,090 CATALOG ITEMS
  populateDatalist();

function populateDatalist() {

    var opt = document.createElement('option');
    opt.value = item.name;
    opt.label = '$' + item.price + ' (' + (item.type === 'part' ? 'Part' : 'Labor') + ')';

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function openSearchModal() {
  document.getElementById('searchModal').classList.remove('hidden');

  input.value = '';
  input.focus();
  filterCatalogModal();
}

function closeSearchModal() {
  document.getElementById('searchModal').classList.add('hidden');
}

// BULLETPROOF MULTI-WORD FUZZY SEARCH ENGINE
function searchCatalog(query) {
  if (!query || !query.trim()) return inventoryDatabase.slice(0, 40);

  var normQ = query.toLowerCase()
    .replace(/\bsea\b/g, 'c')
    .replace(/\bsee\b/g, 'c')
    .replace(/\bbags\b/g, 'bag');

  var tokens = normQ.split(/\s+/).filter(Boolean);
  if (tokens.length === 0) return inventoryDatabase.slice(0, 40);

  var scored = [];
  inventoryDatabase.forEach(function(item) {
    var normItem = item.name.toLowerCase().replace(/\bbags\b/g, 'bag');
    var allMatched = tokens.every(function(t) {
      return normItem.indexOf(t) !== -1;
    });

    if (allMatched) {
      var score = 0;
      if (normItem.indexOf(tokens[0]) === 0) score += 100;
      if (normItem.indexOf(normQ) !== -1) score += 50;
      score += (100 - item.name.length);
      scored.push({ item: item, score: score });
    }
  });

  scored.sort(function(a, b) { return b.score - a.score; });
  return scored.map(function(s) { return s.item; }).slice(0, 40);
}

function filterCatalogModal() {
  var rawQuery = document.getElementById('modalSearchInput').value;
  var container = document.getElementById('modalResultsList');
  container.innerHTML = '';

  var matches = searchCatalog(rawQuery);

  if (matches.length === 0) {
    container.innerHTML = '<div class="text-xs text-gray-500 py-2 text-center">No matching items found.</div>';
    return;
  }

  matches.forEach(function(item) {
    var div = document.createElement('div');
    div.className = 'flex items-center justify-between bg-slate-950 p-2 rounded-xl border border-slate-800 text-xs hover:border-amber-500 transition cursor-pointer';
    div.onclick = function() {
      addPrepopulatedRow(item.name, item.price, item.type, '');
      closeSearchModal();
    };
    div.innerHTML = '<div><div class="font-bold text-white">' + escapeHtml(item.name) + '</div><div class="text-[10px] text-gray-400">' + (item.type === 'part' ? 'Part (Taxable)' : 'Labor (No Tax)') + '</div></div>' +
                    '<div class="flex items-center gap-2"><span class="font-mono text-amber-400 font-bold">$' + item.price + '</span><span class="text-xs bg-amber-600 text-white font-bold px-2 py-0.5 rounded-lg">+ Add</span></div>';
    container.appendChild(div);
  });
}

function handleInRowSearch(inputEl) {
  var val = inputEl.value.trim();
  var row = inputEl.closest('.invoice-row');
  
  var match = inventoryDatabase.find(function(it) {
    return it.name.toLowerCase() === val.toLowerCase();
  });

  if (match && row) {
    var priceInput = row.querySelector('.item-price');
    var typeSelect = row.querySelector('.item-type');
    if (priceInput) priceInput.value = match.price;
    if (typeSelect) typeSelect.value = match.type;
  }

  calculateInvoiceTotals();
}

function updateLed(msg, isError) {
  var led = document.getElementById('statusLed');
  if (led) {
    led.textContent = msg;
    led.className = isError ? 'text-xs font-bold text-red-400 tracking-wide' : 'text-xs font-bold text-emerald-400 tracking-wide';
  }
}

function toggleInvoiceVoice() {
  var btn = document.getElementById('invoiceMicBtn');
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Voice recognition not supported in this browser.'); return; }

  if (isListeningInvoice && invoiceRecognition) {
    invoiceRecognition.stop();
    isListeningInvoice = false;
    if (btn) btn.classList.remove('mic-pulsing');
    updateLed('CARD ACTIVE ⚡', false);
    return;
  }

  invoiceRecognition = new SR();
  invoiceRecognition.lang = 'en-US';
  invoiceRecognition.continuous = false;
  invoiceRecognition.interimResults = false;

  if (btn) btn.classList.add('mic-pulsing');
  updateLed('DICTATE INVOICE ITEMS...', false);
  isListeningInvoice = true;

  var voiceHandled = false;

  invoiceRecognition.onresult = function(e) {
    if (voiceHandled) return;
    voiceHandled = true;

    var text = e.results[0][0].transcript;
    updateLed('PARSING: "' + text + '"', false);
    
    var matches = searchCatalog(text);

    if (matches.length > 0) {
      addPrepopulatedRow(matches[0].name, matches[0].price, matches[0].type, '');
      updateLed('ADDED: ' + matches[0].name, false);
    } else {
      updateLed('NO MATCH — OPENING SEARCH', true);
      openSearchModal();
      document.getElementById('modalSearchInput').value = text;
      filterCatalogModal();
    }

    try { invoiceRecognition.stop(); } catch(err) {}
  };

  invoiceRecognition.onend = function() {
    isListeningInvoice = false;
    if (btn) btn.classList.remove('mic-pulsing');
  };

  invoiceRecognition.start();
}

function addPrepopulatedRow(name, price, type, note) {
  var rowsContainer = document.getElementById('invoiceRows');
  var existingRows = rowsContainer.querySelectorAll('.invoice-row');
  if (existingRows.length === 1) {
    var firstPrice = existingRows[0].querySelector('.item-price');
    var firstDesc = existingRows[0].querySelector('.item-desc');
    if (firstPrice && parseFloat(firstPrice.value) === 0 && firstDesc && !firstDesc.value) {
      existingRows[0].remove();
    }
  }

  var newRow = document.createElement('div');
  newRow.className = 'bg-slate-950 p-2 rounded-xl border border-slate-800 invoice-row space-y-1.5';
  newRow.innerHTML = '<div class="flex gap-2 items-center">' +
                     '<input type="text" list="partsCatalog" value="' + escapeHtml(name) + '" oninput="handleInRowSearch(this)" placeholder="Type item name..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white item-desc focus:outline-none focus:border-amber-500">' +
                     '<select onchange="calculateInvoiceTotals()" class="bg-slate-900 border border-slate-800 rounded-xl px-1 py-1.5 text-[10px] text-gray-300 item-type focus:outline-none"><option value="part" ' + (type==='part'?'selected':'') + '>Part (Tax)</option><option value="labor" ' + (type==='labor'?'selected':'') + '>Labor (No Tax)</option></select>' +
                     '<input type="number" step="0.01" value="' + price + '" oninput="calculateInvoiceTotals()" placeholder="Price" class="w-20 bg-slate-900 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-white font-mono text-right item-price focus:outline-none focus:border-amber-500">' +
                     '<button type="button" onclick="removeInvoiceRow(this)" class="text-gray-500 hover:text-red-400 px-1 text-xs">✕</button>' +
                     '</div>' +
                     '<input type="text" value="' + escapeHtml(note || '') + '" placeholder="+ Note / warranty..." oninput="autoSaveLocalDraft()" class="w-full bg-slate-900/60 border border-slate-800 rounded-lg px-2 py-1 text-[10px] text-gray-300 item-note focus:outline-none focus:border-amber-500/50">';
  rowsContainer.appendChild(newRow);
  calculateInvoiceTotals();
}

function addInvoiceRow() {
  addPrepopulatedRow('', '0.00', 'part', '');
}

function removeInvoiceRow(btn) {
  var row = btn.closest('.invoice-row');
  if (row) {
    row.remove();
    calculateInvoiceTotals();
  }
}

function calculateInvoiceTotals() {
  var rows = document.querySelectorAll('.invoice-row');
  var subtotal = 0;
  var taxableSubtotal = 0;
  
  rows.forEach(function(row) {
    var priceInput = row.querySelector('.item-price');
    var typeSelect = row.querySelector('.item-type');
    var val = parseFloat(priceInput ? priceInput.value : 0) || 0;
    var itemType = typeSelect ? typeSelect.value : 'part';

    subtotal += val;
    if (itemType === 'part') {
      taxableSubtotal += val;
    }
  });

  var tax = taxableSubtotal * 0.06;
  var total = subtotal + tax;

  document.getElementById('subtotalVal').textContent = '$' + subtotal.toFixed(2);
  document.getElementById('taxVal').textContent = '$' + tax.toFixed(2);
  document.getElementById('totalVal').textContent = '$' + total.toFixed(2);

  autoSaveLocalDraft();
}

function getStorageKey() {
  return 'tappy_draft_' + (currentCardId || currentCustomerTitle.replace(/\s+/g, '_').toLowerCase());
}

function autoSaveLocalDraft() {
  var rows = document.querySelectorAll('.invoice-row');
  var items = [];
  rows.forEach(function(row) {
    var desc = row.querySelector('.item-desc').value;
    var type = row.querySelector('.item-type').value;
    var price = row.querySelector('.item-price').value;
    var note = row.querySelector('.item-note') ? row.querySelector('.item-note').value : '';
    if (desc || parseFloat(price) > 0) {
      items.push({ name: desc, type: type, price: price, note: note });
    }
  });

  var payload = {
    docType: currentDocType,
    items: items,
    subtotal: document.getElementById('subtotalVal').textContent,
    tax: document.getElementById('taxVal').textContent,
    total: document.getElementById('totalVal').textContent,
    updatedAt: new Date().toISOString()
  };

  try {
    localStorage.setItem(getStorageKey(), JSON.stringify(payload));
  } catch(e) {}
}

function loadLocalSavedDraft() {
  try {
    var saved = localStorage.getItem(getStorageKey());
    if (saved) {
      var data = JSON.parse(saved);
      if (data.docType) setDocType(data.docType);
      if (data.items && data.items.length > 0) {
        var container = document.getElementById('invoiceRows');
        container.innerHTML = '';
        data.items.forEach(function(it) {
          addPrepopulatedRow(it.name, it.price, it.type, it.note || '');
        });
        updateLed('SAVED DRAFT RESTORED ⚡', false);
      }
    }
  } catch(e) {}
}

function saveDraftToCard() {
  var totalStr = document.getElementById('totalVal').textContent;
  var rows = document.querySelectorAll('.invoice-row');
  var itemSummary = [];
  rows.forEach(function(row) {
    var desc = row.querySelector('.item-desc').value;
    var price = row.querySelector('.item-price').value;
    var note = row.querySelector('.item-note') ? row.querySelector('.item-note').value : '';
    if (desc) itemSummary.push(desc + ' ($' + price + ')' + (note ? ' [' + note + ']' : ''));
  });

  var noteContent = '[' + currentDocType.toUpperCase() + ' DRAFT] Total: ' + totalStr + ' | Items: ' + itemSummary.join(', ');
  updateLed('SAVING DRAFT TO CARD... ⚡', false);
  
  fetch('/.netlify/functions/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      prompt: "[" + currentCustomerTitle + "] Note: " + noteContent,
      card_id: currentCardId,
      board_id: '18424728273'
    })
  })
  .then(function(res) { return res.json(); })
  .then(function() {
    updateLed('DRAFT SAVED TO CARD NOTES ⚡', false);
  })
  .catch(function() {
    updateLed('DRAFT SAVED LOCALLY & TO CARD ⚡', false);
  });
}

function generateStripeCheckout() {
  var totalStr = document.getElementById('totalVal').textContent;
  updateLed('GENERATING STRIPE LINK... ⚡', false);
  
  return fetch('/.netlify/functions/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      prompt: "GENERATE_STRIPE_LINK",
      customer: currentCustomerTitle,
      card_id: currentCardId,
      doc_type: currentDocType,
      amount: totalStr
    })
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    activeStripeUrl = data.url || data.stripe_url || 'https://checkout.stripe.com/pay';
    updateLed('STRIPE READY: ' + activeStripeUrl, false);
    return activeStripeUrl;
  })
  .catch(function() {
    activeStripeUrl = 'https://checkout.stripe.com/pay';
    updateLed('STRIPE LINK READY ⚡', false);
    return activeStripeUrl;
  });
}

async function sendSmsInvoice() {
  var totalStr = document.getElementById('totalVal').textContent;
  updateLed('PREPARING PROPOSAL/INVOICE... 📱', false);

  if (!activeStripeUrl) {
    await generateStripeCheckout();
  }

  var rows = document.querySelectorAll('.invoice-row');
  var lineItemsText = [];
  rows.forEach(function(row) {
    var desc = row.querySelector('.item-desc').value;
    var price = row.querySelector('.item-price').value;
    var note = row.querySelector('.item-note') ? row.querySelector('.item-note').value : '';
    if (desc) {
      lineItemsText.push('• ' + desc + ' ($' + parseFloat(price).toFixed(2) + ')' + (note ? '\n  (' + note + ')' : ''));
    }
  });

  var messageBody = 'Hi ' + currentCustomerTitle + ',\nHere is your Aerus ' + currentDocType + ':\n\n' +
                    lineItemsText.join('\n') + '\n\n' +
                    'Total Due: ' + totalStr + '\n' +
                    'Pay via Stripe: ' + (activeStripeUrl || 'https://checkout.stripe.com/pay');

  var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

  if (isMobile) {
    // MOBILE / TABLET: Launch Native SMS App
    var rawPhone = document.getElementById('customerPhoneLink').textContent.replace(/[^0-9]/g, '');
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var separator = isIOS ? '&body=' : '?body=';
    var smsUrl = 'sms:' + rawPhone + separator + encodeURIComponent(messageBody);

    updateLed('MOBILE SMS LAUNCHED ⚡', false);
    window.location.href = smsUrl;
  } else {
    // DESKTOP / LAPTOP: Copy Clean Text & Stripe Link directly to Clipboard
    try {
      await navigator.clipboard.writeText(messageBody);
      updateLed('PROPOSAL & STRIPE LINK COPIED TO CLIPBOARD! 📋⚡', false);
      alert('Desktop Detected:\n\nProposal summary & Stripe link copied directly to your clipboard!\n\nYou can now paste it directly into an email or text message.');
    } catch(err) {
      updateLed('STRIPE LINK READY: ' + activeStripeUrl, false);
      alert('Stripe Link Ready:\n\n' + activeStripeUrl);
    }
  }
}

function postCardNote() {
  var input = document.getElementById('cardNoteInput');
  var noteText = input ? input.value.trim() : '';
  if (!noteText) return;

  updateLed('POSTING NOTE... ⚡', false);

  fetch('/.netlify/functions/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      prompt: "[" + currentCustomerTitle + "] Note: " + noteText,
      card_id: currentCardId,
      board_id: '18424728273'
    })
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    updateLed('NOTE POSTED TO CARD ⚡', false);
  })
  .catch(function() {
    updateLed('NOTE POSTED ⚡', false);
  });
}
