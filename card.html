<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forever Card™ — Service Portal</title>
  <script src="config.js"></script>
  <style>
    :root { --primary: #0066cc; --bg: #f4f6f8; --card: #ffffff; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 12px; color: #333; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h2, h3 { margin-top: 0; color: var(--primary); }
    .btn { background: var(--primary); color: white; border: none; padding: 12px 16px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 8px; }
    .btn-secondary { background: #6c757d; }
    .btn-danger { background: #dc3545; }
    .btn-success { background: #28a745; }
    input, select, textarea { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .line-item { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .line-item input[type="text"] { flex: 2; }
    .line-item input[type="number"] { flex: 1; }
    .chip-container { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .chip { background: #e9ecef; padding: 6px 12px; border-radius: 16px; font-size: 12px; cursor: pointer; }
    .chip.active { background: var(--primary); color: white; }
    #photoPreview { width: 100%; border-radius: 8px; margin-top: 8px; display: none; }
  </style>
</head>
<body>

  <!-- Customer Contact Bar -->
  <div class="card">
    <h2 id="custName">Loading Customer...</h2>
    <p id="custPhone">📱 Phone: --</p>
    <p id="custAddress">📍 Address: --</p>
    
    <!-- 1-Tap Voice-to-SMS -->
    <button class="btn btn-success" onclick="startVoiceSMS()">🎙️ Hold/Tap to Dictate "On My Way" SMS</button>
  </div>

  <!-- Diagnostic Photo Snap -->
  <div class="card">
    <h3>📷 Diagnostic & Machine Photo</h3>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="previewPhoto(event)">
    <img id="photoPreview" src="" alt="Machine Snap">
  </div>

  <!-- Pipeline Stage & Chips -->
  <div class="card">
    <h3>⚙️ Pipeline Stage</h3>
    <select id="stageSelect" onchange="saveCardState()"></select>
    
    <h4>Categories</h4>
    <div class="chip-container" id="categoryChips"></div>

    <h4>Suppliers</h4>
    <div class="chip-container" id="supplierChips"></div>
  </div>

  <!-- Universal Estimate & Invoice Engine -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="docTypeHeader">Proposal / Estimate</h3>
      <button class="btn btn-secondary" style="width: auto; padding: 6px 12px;" onclick="toggleDocType()">Toggle Mode</button>
    </div>

    <div id="lineItemsContainer"></div>
    <button class="btn" style="background: #17a2b8;" onclick="addLineItem()">+ Add Line Item</button>

    <div style="margin-top: 16px; border-top: 2px solid #eee; padding-top: 10px;">
      <p>Subtotal: <span id="subtotalVal">$0.00</span></p>
      <p>Tax (<span id="taxRatePercent">6%</span>): <span id="taxVal">$0.00</span></p>
      <h3>Total: <span id="totalVal">$0.00</span></h3>
    </div>

    <button class="btn btn-success" onclick="generateStripeCheckout()">💳 1-Tap Stripe Checkout Link</button>
    <button class="btn btn-danger" onclick="clearDraft()">🗑️ Clear Draft</button>
  </div>

  <script>
    let currentDocType = "Proposal";
    const urlParams = new URLSearchParams(window.location.search);
    const customer = {
      id: urlParams.get('id') || '22086',
      name: urlParams.get('name') || 'Ruth Tucker',
      phone: urlParams.get('phone') || '4102566949',
      address: urlParams.get('address') || '6 Lagan Ct Nottingham, Maryland 21236'
    };

    window.onload = function() {
      document.getElementById('custName').innerText = customer.name;
      document.getElementById('custPhone').innerText = "📱 " + customer.phone;
      document.getElementById('custAddress').innerText = "📍 " + customer.address;
      document.getElementById('taxRatePercent').innerText = (TENANT_CONFIG.taxRate * 100) + "%";

      // Load Stages
      const stageSelect = document.getElementById('stageSelect');
      TENANT_CONFIG.stages.forEach(stage => {
        let opt = document.createElement('option');
        opt.value = stage;
        opt.innerText = stage;
        stageSelect.appendChild(opt);
      });

      // Load Chips
      renderChips('categoryChips', TENANT_CONFIG.categories);
      renderChips('supplierChips', TENANT_CONFIG.suppliers);

      loadCardState();
    };

    function renderChips(containerId, list) {
      const container = document.getElementById(containerId);
      list.forEach(item => {
        let chip = document.createElement('span');
        chip.className = 'chip';
        chip.innerText = item;
        chip.onclick = () => chip.classList.toggle('active');
        container.appendChild(chip);
      });
    }

    function previewPhoto(event) {
      const reader = new FileReader();
      reader.onload = function() {
        const output = document.getElementById('photoPreview');
        output.src = reader.result;
        output.style.display = 'block';
        saveCardState();
      }
      reader.readAsDataURL(event.target.files[0]);
    }

    function startVoiceSMS() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech recognition not supported in this browser.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        const liveCardUrl = window.location.href;
        const smsBody = encodeURIComponent(`${transcript} View live details here: ${liveCardUrl}`);
        window.location.href = `sms:${customer.phone}?body=${smsBody}`;
      };
      recognition.start();
    }

    function addLineItem(desc = '', price = 0, taxable = true) {
      const container = document.getElementById('lineItemsContainer');
      const div = document.createElement('div');
      div.className = 'line-item';
      div.innerHTML = `
        <input type="text" placeholder="Description" value="${desc}" oninput="calculateTotals()">
        <input type="number" placeholder="Price" value="${price}" oninput="calculateTotals()">
        <label><input type="checkbox" ${taxable ? 'checked' : ''} onchange="calculateTotals()"> Tax</label>
        <button onclick="this.parentElement.remove(); calculateTotals();" style="background:none;border:none;color:red;cursor:pointer;">✖</button>
      `;
      container.appendChild(div);
      calculateTotals();
    }

    function calculateTotals() {
      let subtotal = 0;
      let taxableSubtotal = 0;
      const items = document.querySelectorAll('.line-item');

      items.forEach(item => {
        const desc = item.children[0].value;
        const price = parseFloat(item.children[1].value) || 0;
        const isTaxable = item.children[2].children[0].checked;

        subtotal += price;
        if (isTaxable) taxableSubtotal += price;
      });

      const tax = taxableSubtotal * TENANT_CONFIG.taxRate;
      const total = subtotal + tax;

      document.getElementById('subtotalVal').innerText = `$${subtotal.toFixed(2)}`;
      document.getElementById('taxVal').innerText = `$${tax.toFixed(2)}`;
      document.getElementById('totalVal').innerText = `$${total.toFixed(2)}`;

      saveCardState();
    }

    function toggleDocType() {
      currentDocType = currentDocType === "Proposal" ? "Final Invoice" : "Proposal";
      document.getElementById('docTypeHeader').innerText = currentDocType;
      saveCardState();
    }

    function clearDraft() {
      document.getElementById('lineItemsContainer').innerHTML = '';
      calculateTotals();
    }

    function generateStripeCheckout() {
      const total = document.getElementById('totalVal').innerText;
      alert(`Stripe Payment Link Generated for ${total} (${customer.name})!`);
    }

    function saveCardState() {
      const cardData = {
        docType: currentDocType,
        stage: document.getElementById('stageSelect').value,
        total: document.getElementById('totalVal').innerText,
        customerName: customer.name,
        customerPhone: customer.phone,
        cardUrl: window.location.href
      };
      localStorage.setItem(`card_${customer.id}`, JSON.stringify(cardData));
    }

    function loadCardState() {
      const saved = localStorage.getItem(`card_${customer.id}`);
      if (saved) {
        const data = JSON.parse(saved);
        currentDocType = data.docType || "Proposal";
        document.getElementById('docTypeHeader').innerText = currentDocType;
        if (data.stage) document.getElementById('stageSelect').value = data.stage;
      }
    }
  </script>
</body>
</html>
