<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aerus Operations Portal | freshtappything.com</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #10b981;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .status-badge {
      background: rgba(16, 185, 129, 0.2);
      color: var(--green);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #334155;
    }
    .card h3 {
      margin-top: 0;
      color: var(--accent);
    }
    .item-card {
      background: #0f172a;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 4px solid var(--accent);
    }
    .voice-box {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 1px solid #334155;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { opacity: 0.9; }
    input[type="text"] {
      width: 70%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      margin-right: 10px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h2>Fresh — TappyThing Coordinator</h2>
      <small style="color: var(--muted)">Aerus Home Wellness | Timonium, MD</small>
    </div>
    <div class="status-badge">● Systems Live</div>
  </div>

  <div class="grid">
    <!-- DOOR 1: BUSINESS WORLD / MONDAY BOARD -->
    <div class="card">
      <h3>Door 1: Active Board Operations</h3>
      <div id="board-cards">
        <p style="color: var(--muted)">Loading live items from Monday.com...</p>
      </div>
    </div>

    <!-- DOOR 2: SYSTEM STATS -->
    <div class="card">
      <h3>Door 2: Master Vault Assets</h3>
      <div class="item-card">
        <strong>Master Customer Vault:</strong> 22,283 Records Active
      </div>
      <div class="item-card">
        <strong>Operational Assets:</strong> 1,090 Inventory Items
      </div>
    </div>
  </div>

  <!-- VOICE / TEXT COORDINATOR -->
  <div class="voice-box">
    <h3>Tap & Talk to Fresh</h3>
    <div style="margin-bottom: 15px;">
      <input type="text" id="userInput" placeholder="Ask Fresh anything or send intake note...">
      <button onclick="handleSend()">Send to Fresh 🤵</button>
    </div>
    <div id="response" style="color: var(--muted); min-height: 24px;"></div>
  </div>

  <script>
    // 1. Fetch live Monday Board Cards (Bagdons Queue & Ready Wall)
    async function loadMondayCards() {
      const container = document.getElementById('board-cards');
      try {
        const res = await fetch('/.netlify/functions/monday');
        const data = await res.json();
        
        if (!data.groups || data.groups.length === 0) {
          container.innerHTML = '<p style="color: var(--muted)">No active items found in target groups.</p>';
          return;
        }

        let html = '';
        data.groups.forEach(group => {
          html += `<h4 style="margin-bottom: 8px; color: #f8fafc;">${group.title}</h4>`;
          const items = group.items_page?.items || [];
          if (items.length === 0) {
            html += `<p style="color: var(--muted); font-size: 0.9rem;">No active cards</p>`;
          } else {
            items.forEach(item => {
              html += `<div class="item-card"><strong>${item.name}</strong></div>`;
            });
          }
        });
        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = '<p style="color: #ef4444;">Error connecting to Monday API</p>';
      }
    }

    // 2. Chat Voice Response Handler
    async function handleSend() {
      const input = document.getElementById('userInput');
      const responseDiv = document.getElementById('response');
      const text = input.value.trim();
      
      if (!text) return;

      responseDiv.innerText = "Fresh is processing...";
      
      try {
        const res = await fetch('/.netlify/functions/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        const data = await res.json();
        const replyText = data.reply || "Done, Chief!";
        
        responseDiv.innerText = replyText;

        // Speak reply out loud
        const utterance = new SpeechSynthesisUtterance(replyText);
        window.speechSynthesis.speak(utterance);
        
        input.value = '';
      } catch (err) {
        responseDiv.innerText = "Error contacting Fresh voice engine.";
      }
    }

    // Initial load
    loadMondayCards();
  </script>

</body>
</html>
