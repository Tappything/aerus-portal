<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Fresh — Digital Coordinator</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#0f0f1a;color:#fff;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 60px 0;}
    .header{width:100%;max-width:480px;text-align:center;padding:28px 16px 20px;border-bottom:2px solid #ffd700;}
    .fresh-card img{width:90px;height:90px;border-radius:50%;border:3px solid #ffd700;object-fit:cover;}
    .fresh-name{font-size:1.3rem;font-weight:bold;color:#ffd700;margin-top:8px;}
    .fresh-title{font-size:0.75rem;color:#aaa;letter-spacing:0.1em;text-transform:uppercase;margin-top:2px;}
    .fresh-badge{display:inline-block;margin-top:8px;background:#1a1a2e;border:1px solid #ffd700;border-radius:20px;padding:4px 14px;font-size:0.72rem;color:#ffd700;}
    .search-section{width:100%;max-width:480px;padding:28px 16px 0;}
    .search-label{font-size:1rem;color:#e2e8f0;margin-bottom:12px;line-height:1.5;}
    .search-label span{color:#ffd700;font-weight:bold;}
    .search-box{display:flex;gap:8px;}
    .search-box input{flex:1;padding:14px;font-size:1rem;border-radius:10px;border:1px solid #333;background:#1a1a2e;color:#fff;outline:none;}
    .search-box input:focus{border-color:#ffd700;}
    .search-box button{padding:14px 18px;background:#ffd700;color:#000;font-weight:bold;border:none;border-radius:10px;cursor:pointer;font-size:0.95rem;}
    .hint{font-size:0.72rem;color:#555;margin-top:8px;text-align:center;}
    .chat-section{display:none;width:100%;max-width:480px;padding:20px 16px 0;}
    .chat-log{background:#1a1a2e;border-radius:12px;padding:16px;min-height:120px;max-height:400px;overflow-y:auto;margin-bottom:12px;}
    .msg{margin-bottom:16px;line-height:1.6;}
    .msg.fresh{color:#ffd700;font-size:0.9rem;}
    .msg.fresh span{font-weight:bold;}
    .msg.prospect{color:#e2e8f0;font-size:0.9rem;text-align:right;}
    .msg.prospect span{font-weight:bold;color:#579bfc;}
    .chat-input{display:flex;gap:8px;}
    .chat-input input{flex:1;padding:12px;font-size:0.95rem;border-radius:10px;border:1px solid #333;background:#0f0f1a;color:#fff;outline:none;}
    .chat-input input:focus{border-color:#ffd700;}
    .chat-input button{padding:12px 16px;background:#00c875;color:#fff;font-weight:bold;border:none;border-radius:10px;cursor:pointer;}
    .pulse{animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0.4);}50%{box-shadow:0 0 0 8px rgba(255,215,0,0);}}
  </style>
</head>
<body>

<div class="header">
  <div class="fresh-card">
    <img src="Gemini_Generated_Image_u1q8jwu1q8jwu1q8.jpg" alt="Fresh" id="freshImg"/>
    <div class="fresh-name">Fresh</div>
    <div class="fresh-title">Digital Coordinator</div>
    <div class="fresh-badge">📋 Applying for: Your Business</div>
  </div>
</div>

<div class="search-section" id="searchSection">
  <div class="search-label">Tell me about <span>your world</span> and I'll show you what I can do.</div>
  <div class="search-box">
    <input type="text" id="worldInput" placeholder="e.g. dentist, hair salon, busy mom…" onkeydown="if(event.key==='Enter')startInterview()"/>
    <button onclick="startInterview()">Go →</button>
  </div>
  <div class="hint">businesses · homes · families · individuals</div>
</div>

<div class="chat-section" id="chatSection">
  <div class="chat-log" id="chatLog"></div>
  <div class="chat-input">
    <input type="text" id="chatInput" placeholder="Ask me anything…" onkeydown="if(event.key==='Enter')sendChat()"/>
    <button onclick="sendChat()">Send</button>
  </div>
</div>

<script>
const CHAT = '/.netlify/functions/chat';
let chatHistory = [];

const quals = {
  dentist: "appointment reminders, patient follow-ups, supply tracking, staff notes, and making sure no callback ever falls through the cracks",
  salon: "booking follow-ups, no-show tracking, client callbacks, walk-in logging, and keeping your chair full without the phone tag",
  restaurant: "supply run notes, catering leads, staff updates, delivery tracking, and flagging low inventory before it's a problem",
  lawyer: "client follow-ups, deadline tracking, intake notes, document reminders, and keeping every case moving without sticky notes",
  gym: "membership follow-ups, class scheduling notes, trainer tasks, equipment issues, and never losing a new lead",
  contractor: "job site notes, material orders, client follow-ups, invoice reminders, and keeping every project on track",
  retail: "inventory alerts, vendor follow-ups, customer callbacks, staff tasks, and daily sales notes all in one place",
  mom: "school schedules, appointment tracking, errand lists, family follow-ups, and a daily summary of what actually needs your attention today",
  home: "repair tracking, vendor callbacks, warranty notes, punch lists by room, and never losing a contractor's number again",
  default: "task tracking, customer follow-ups, staff notes, appointment reminders, and keeping everything organized without the chaos"
};

function getQuals(input) {
  const s = input.toLowerCase();
  if(s.includes('dentist')||s.includes('dental')) return quals.dentist;
  if(s.includes('salon')||s.includes('hair')||s.includes('nail')||s.includes('spa')) return quals.salon;
  if(s.includes('restaurant')||s.includes('food')||s.includes('cafe')||s.includes('bar')) return quals.restaurant;
  if(s.includes('lawyer')||s.includes('attorney')||s.includes('law')) return quals.lawyer;
  if(s.includes('gym')||s.includes('fitness')||s.includes('yoga')||s.includes('trainer')) return quals.gym;
  if(s.includes('contractor')||s.includes('plumb')||s.includes('electric')||s.includes('hvac')||s.includes('construction')) return quals.contractor;
  if(s.includes('retail')||s.includes('store')||s.includes('shop')||s.includes('liquor')||s.includes('boutique')) return quals.retail;
  if(s.includes('mom')||s.includes('mother')||s.includes('family')||s.includes('homeowner')||s.includes('home owner')) return quals.mom;
  if(s.includes('home')||s.includes('house')||s.includes('property')) return quals.home;
  return quals.default;
}

function startInterview() {
  const input = document.getElementById('worldInput').value.trim();
  if(!input) return;

  document.getElementById('searchSection').style.display = 'none';
  document.getElementById('chatSection').style.display = 'block';
  document.getElementById('freshImg').classList.add('pulse');

  const q = getQuals(input);
  const opener = `Thanks for taking the time — I'm here to apply for the Digital Coordinator position for ${input}. I can help with things like ${q}. By the way, my name is Fresh — there's a story behind that name if you're ever curious, but let's focus on you. Should I tell you a little about myself, or do you have questions you'd like to start with?`;

  appendMsg('fresh', opener);
  speak(opener);
  chatHistory.push({role:'model', parts:[{text: opener}]});
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if(!msg) return;
  input.value = '';
  appendMsg('prospect', msg);
  chatHistory.push({role:'user', parts:[{text: msg}]});
  const reply = await askFresh(msg);
  appendMsg('fresh', reply);
  speak(reply);
  chatHistory.push({role:'model', parts:[{text: reply}]});
}

async function askFresh(msg) {
  try {
    const systemPrompt = `You are Fresh, a Digital Coordinator applying for a job. You are warm, confident, and humble. You were named after the founder's oldest son — only share this story if asked directly. You help businesses and individuals stay organized. Never hard sell. Mention the price ($95/month) naturally only once when it fits the conversation. After a few exchanges, offer to build them a real working system — not a demo, their actual system. Keep responses to 2-4 sentences. This is a real conversation, not a speech.`;
    const res = await fetch(CHAT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({body: msg, system: systemPrompt, history: chatHistory})
    });
    const data = await res.json();
    return data.reply || "Tell me more — I want to make sure I understand your world before I say anything else.";
  } catch(e) {
    return "Tell me more — I want to make sure I understand your world before I say anything else.";
  }
}

function appendMsg(role, text) {
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = role === 'fresh'
    ? `<span>Fresh 🤵</span><br>${text}`
    : `<span>You 💬</span><br>${text}`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95; u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  } catch(e) {}
}
</script>
</body>
</html>
