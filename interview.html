<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Fresh — Digital Coordinator</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#0f0f1a;color:#fff;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 60px 0;}
    .header{width:100%;max-width:480px;text-align:center;padding:28px 16px 20px;border-bottom:2px solid #ffd700;}
    .fresh-card img{width:90px;height:90px;border-radius:50%;border:3px solid #ffd700;object-fit:cover;}
    .fresh-name{font-size:1.3rem;font-weight:bold;color:#ffd700;margin-top:8px;}
    .fresh-title{font-size:0.75rem;color:#aaa;letter-spacing:0.1em;text-transform:uppercase;margin-top:2px;}
    .fresh-badge{display:inline-block;margin-top:8px;background:#1a1a2e;border:1px solid #ffd700;border-radius:20px;padding:4px 14px;font-size:0.72rem;color:#ffd700;}
    .search-section{width:100%;max-width:480px;padding:28px 16px 0;}
    .search-label{font-size:1rem;color:#e2e8f0;margin-bottom:12px;line-height:1.5;}
    .search-label span{color:#ffd700;font-weight:bold;}
    .search-box{display:flex;gap:8px;}
    .search-box input{flex:1;padding:14px;font-size:1rem;border-radius:10px;border:1px solid #333;background:#1a1a2e;color:#fff;outline:none;}
    .search-box input:focus{border-color:#ffd700;}
    .search-box button{padding:14px 18px;background:#ffd700;color:#000;font-weight:bold;border:none;border-radius:10px;cursor:pointer;font-size:0.95rem;}
    .hint{font-size:0.72rem;color:#555;margin-top:8px;text-align:center;}
    .chat-section{display:none;width:100%;max-width:480px;padding:20px 16px 0;}
    .chat-log{background:#1a1a2e;border-radius:12px;padding:16px;min-height:120px;max-height:400px;overflow-y:auto;margin-bottom:12px;}
    .msg{margin-bottom:16px;line-height:1.6;}
    .msg.fresh{color:#ffd700;font-size:0.9rem;}
    .msg.fresh span{font-weight:bold;}
    .msg.prospect{color:#e2e8f0;font-size:0.9rem;text-align:right;}
    .msg.prospect span{font-weight:bold;color:#579bfc;}
    .chat-input{display:flex;gap:8px;}
    .chat-input input{flex:1;padding:12px;font-size:0.95rem;border-radius:10px;border:1px solid #333;background:#0f0f1a;color:#fff;outline:none;}
    .chat-input input:focus{border-color:#ffd700;}
    .chat-input button{padding:12px 16px;background:#00c875;color:#fff;font-weight:bold;border:none;border-radius:10px;cursor:pointer;}
    .thinking{color:#aaa;font-style:italic;font-size:0.85rem;padding:8px 0;}
    .pulse{animation:pulse 2s infinite;}

    /* WOW MOMENT */
    .wow-wrap{margin-top:14px;display:none;flex-direction:column;gap:12px;}
    .build-btn{
      width:100%;
      padding:14px 16px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-weight:800;
      font-size:0.95rem;
      letter-spacing:0.02em;
      color:#0f0f1a;
      background:linear-gradient(180deg,#ffe680 0%,#ffd700 100%);
      box-shadow:0 0 0 1px #ffd700 inset, 0 0 18px rgba(255,215,0,.45), 0 8px 18px rgba(0,0,0,.35);
      transition:transform .18s ease, box-shadow .18s ease;
      animation:goldGlow 1.8s ease-in-out infinite;
    }
    .build-btn:hover{transform:translateY(-1px);box-shadow:0 0 0 1px #ffd700 inset, 0 0 24px rgba(255,215,0,.6), 0 10px 20px rgba(0,0,0,.4);}
    .build-btn:active{transform:translateY(0);}
    .system-cards{display:grid;gap:10px;}
    .sys-card{
      opacity:0;
      transform:translateY(18px);
      background:#111827;
      border:1px solid rgba(255,215,0,.38);
      border-radius:12px;
      padding:12px;
      display:flex;
      gap:10px;
      align-items:flex-start;
      box-shadow:0 6px 18px rgba(0,0,0,.35);
    }
    .sys-card.show{animation:cardIn .5s ease forwards;}
    .sys-icon{
      width:34px;height:34px;border-radius:10px;
      border:1px solid #ffd700;
      background:#1a1a2e;
      display:flex;align-items:center;justify-content:center;
      font-size:16px;flex:0 0 34px;
    }
    .sys-title{color:#ffd700;font-weight:700;font-size:.9rem;margin-bottom:3px;}
    .sys-desc{color:#cbd5e1;font-size:.82rem;line-height:1.4;}
    .live-msg{
      display:none;
      margin-top:8px;
      color:#00c875;
      font-weight:700;
      font-size:.92rem;
      background:rgba(0,200,117,.08);
      border:1px solid rgba(0,200,117,.4);
      border-radius:10px;
      padding:10px 12px;
    }

    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,0.4);}50%{box-shadow:0 0 0 8px rgba(255,215,0,0);}}
    @keyframes goldGlow{
      0%,100%{box-shadow:0 0 0 1px #ffd700 inset,0 0 14px rgba(255,215,0,.35),0 8px 18px rgba(0,0,0,.35);}
      50%{box-shadow:0 0 0 1px #ffd700 inset,0 0 24px rgba(255,215,0,.6),0 10px 22px rgba(0,0,0,.4);}
    }
    @keyframes cardIn{
      from{opacity:0;transform:translateY(18px);}
      to{opacity:1;transform:translateY(0);}
    }
  </style>
</head>
<body>

<div class="header">
  <div class="fresh-card">
    <img src="Gemini_Generated_Image_u1q8jwu1q8jwu1q8.jpg" alt="Fresh" id="freshImg"/>
    <div class="fresh-name">Fresh</div>
    <div class="fresh-title">Digital Coordinator</div>
    <div class="fresh-badge">📋 Applying for: Your Business</div>
  </div>
</div>

<div class="search-section" id="searchSection">
  <div class="search-label">Tell me about <span>your world</span> and Fresh will show you what he can do.</div>
  <div class="search-box">
    <input type="text" id="worldInput" placeholder="e.g. barber shop, dentist, busy mom…" onkeydown="if(event.key==='Enter')startInterview()"/>
    <button onclick="startInterview()">Go →</button>
  </div>
  <div class="hint">businesses · homes · families · individuals</div>
</div>

<div class="chat-section" id="chatSection">
  <div class="chat-log" id="chatLog"></div>
  <div class="chat-input">
    <input type="text" id="chatInput" placeholder="Ask me anything…" onkeydown="if(event.key==='Enter')sendChat()"/>
    <button onclick="sendChat()">Send</button>
  </div>

  <div class="wow-wrap" id="wowWrap">
    <button class="build-btn" id="buildBtn" onclick="buildMySystem()">✨ Build My System</button>
    <div class="system-cards" id="systemCards"></div>
    <div class="live-msg" id="liveMsg">Your system is live. Fresh is ready to go to work.</div>
  </div>
</div>

<script>
const CHAT = '/.netlify/functions/chat';
let chatHistory = [];
let businessType = '';
let freshReplyCount = 0;
let wowShown = false;

const SYSTEM = `You are Fresh, a Digital Coordinator applying for a job. You are warm, confident, and humble. You were named after the founder's oldest son — only share this story if the prospect asks directly.`;

const TOOLS = [
  { icon:'📝', title:'Intake', desc:'Capture new requests instantly with structured forms and smart triage.' },
  { icon:'🔁', title:'Follow-Up Tracker', desc:'Never miss a touchpoint with reminders and status-based follow-up flows.' },
  { icon:'✅', title:'Task Queue', desc:'Turn requests into prioritized actions your team can execute fast.' },
  { icon:'📊', title:'Dashboard', desc:'See workload, response times, and outcomes in one clear command center.' }
];

async function startInterview() {
  businessType = document.getElementById('worldInput').value.trim();
  if(!businessType) return;

  document.getElementById('searchSection').style.display = 'none';
  document.getElementById('chatSection').style.display = 'block';
  document.getElementById('freshImg').classList.add('pulse');

  const log = document.getElementById('chatLog');
  const thinking = document.createElement('div');
  thinking.className = 'thinking';
  thinking.textContent = 'Fresh is preparing…';
  log.appendChild(thinking);

  const opener = await askFresh(`I run a ${businessType}. Tell me how you can help me.`);
  log.removeChild(thinking);
  appendMsg('fresh', opener);
  speak(opener);
  chatHistory.push({role:'model', parts:[{text: opener}]});

  freshReplyCount++;
  maybeShowWow();
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if(!msg) return;
  input.value = '';
  appendMsg('prospect', msg);
  chatHistory.push({role:'user', parts:[{text: msg}]});

  const log = document.getElementById('chatLog');
  const thinking = document.createElement('div');
  thinking.className = 'thinking';
  thinking.textContent = 'Fresh is thinking…';
  log.appendChild(thinking);
  log.scrollTop = log.scrollHeight;

  const reply = await askFresh(msg);
  log.removeChild(thinking);
  appendMsg('fresh', reply);
  speak(reply);
  chatHistory.push({role:'model', parts:[{text: reply}]});

  freshReplyCount++;
  maybeShowWow();
}

function maybeShowWow() {
  if (wowShown || freshReplyCount < 2) return;
  wowShown = true;
  const wow = document.getElementById('wowWrap');
  wow.style.display = 'flex';
}

function buildMySystem() {
  const btn = document.getElementById('buildBtn');
  const cardsWrap = document.getElementById('systemCards');
  const liveMsg = document.getElementById('liveMsg');
  btn.style.display = 'none';
  cardsWrap.innerHTML = '';
  liveMsg.style.display = 'none';

  TOOLS.forEach((tool, i) => {
    setTimeout(() => {
      const card = document.createElement('div');
      card.className = 'sys-card';
      card.innerHTML = `
        <div class="sys-icon">${tool.icon}</div>
        <div>
          <div class="sys-title">${tool.title}</div>
          <div class="sys-desc">${tool.desc}</div>
        </div>
      `;
      cardsWrap.appendChild(card);
      requestAnimationFrame(() => card.classList.add('show'));

      if (i === TOOLS.length - 1) {
        setTimeout(() => {
          liveMsg.style.display = 'block';
        }, 450);
      }
    }, i * 800);
  });
}

async function askFresh(msg) {
  try {
    const res = await fetch(CHAT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({body: msg, system: SYSTEM, history: chatHistory})
    });
    const data = await res.json();
    return data.reply || "Tell me more — I want to make sure I understand your world before I say anything else.";
  } catch(e) {
    return "Tell me more — I want to make sure I understand your world.";
  }
}

function appendMsg(role, text) {
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = role === 'fresh'
    ? `<span>Fresh 🤵</span><br>${text}`
    : `<span>You 💬</span><br>${text}`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95; u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  } catch(e) {}
}
</script>
</body>
</html>
