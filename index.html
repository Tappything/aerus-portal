<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TappyThing — Aerus Home Wellness</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #121212; color: #E0E0E0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    header { text-align: center; margin-bottom: 24px; }
    .gold-badge { font-size: 48px; margin-bottom: 8px; }
    h1 { font-size: 24px; color: #FFFFFF; margin-bottom: 4px; }
    p.subtitle { font-size: 14px; color: #A0A0A0; }
    .main-card { background-color: #1E1E1E; border: 1px solid #333333; border-radius: 16px; width: 100%; max-width: 480px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); margin-bottom: 20px; }
    textarea { width: 100%; height: 100px; background-color: #2A2A2A; border: 1px solid #444444; border-radius: 12px; color: #FFFFFF; padding: 12px; font-size: 16px; resize: none; margin-bottom: 16px; outline: none; }
    textarea:focus { border-color: #FFD700; }
    .btn-action { width: 100%; background-color: #FFD700; color: #121212; border: none; border-radius: 12px; padding: 16px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background-color 0.2s ease; }
    .btn-action:hover { background-color: #E6C200; }
    .response-area { margin-top: 16px; background-color: #2A2A2A; border-radius: 12px; padding: 12px; font-size: 14px; color: #D4D4D4; min-height: 48px; }
    .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 480px; }
    .info-card { background-color: #1E1E1E; border: 1px solid #333333; border-radius: 12px; padding: 16px; text-align: center; }
    .info-card h3 { font-size: 14px; color: #FFD700; margin-bottom: 4px; }
    .info-card p { font-size: 12px; color: #A0A0A0; }
  </style>
</head>
<body>

  <header>
    <div class="gold-badge">🏆</div>
    <h1>TappyThing</h1>
    <p class="subtitle">Digital Coordinator — Aerus Home Wellness</p>
  </header>

  <div class="main-card">
    <textarea id="promptInput" placeholder="Tap and speak or type your intake here..."></textarea>
    <button class="btn-action" onclick="sendToFresh()">Send to Coordinator</button>
    <div class="response-area" id="freshReply">Fresh is ready for intake...</div>
  </div>

  <div class="card-grid">
    <div class="info-card"><h3>Intakes</h3><p>Voice / Text Queue</p></div>
    <div class="info-card"><h3>Bench Repairs</h3><p>Workiz Sync</p></div>
    <div class="info-card"><h3>Field Tasks</h3><p>Diagnostics & Deliveries</p></div>
    <div class="info-card"><h3>Command Hub</h3><p>Monday Board Live</p></div>
  </div>

  <script>
    var lastReply = '';

    function sendToFresh() {
      var prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) return;

      var replyEl = document.getElementById('freshReply');
      replyEl.textContent = 'Fresh is thinking...';

      // 1. Gemini Chat AI Engine
      fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: prompt })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        lastReply = data.reply || 'Fresh had nothing to say!';
        replyEl.textContent = lastReply;
      })
      .catch(function(err) {
        replyEl.textContent = 'Error communicating with Fresh.';
      });

      // 2. Make.com Webhook Pipeline Trigger
      fetch('https://hook.us2.make.com/nubq7q917ondi9xh88wggb250jwk7af1', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ body: prompt })
      }).catch(function(e) { console.log('Webhook error:', e); });

      document.getElementById('promptInput').value = '';
    }
  </script>

</body>
</html>
