<!DOCTYPE html>
<html>
<body>
  <h3>Staff Intake Form</h3>
  <form id="f" onsubmit="event.preventDefault(); fetch('https://hook.us2.make.com/q6s4cfv1g27xnxx8mn9m1dn889w23vt7', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name.value,phone:f.phone.value,machine:f.machine.value,desc:f.desc.value})}).then(()=>{msg.innerText='✅ Submitted!'; f.reset();});">
    <input name="name" placeholder="Name" required><br><br>
    <input name="phone" placeholder="Phone" required><br><br>
    <input name="machine" placeholder="Machine" required><br><br>
    <textarea name="desc" placeholder="Issue Description" required></textarea><br><br>
    <button type="submit">Submit Intake</button>
  </form>
  <p id="msg" style="color:green; font-weight:bold;"></p>
</body>
</html>
