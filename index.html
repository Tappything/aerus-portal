<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TappyThing Portal</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
    input, textarea, button { width: 100%; margin-bottom: 15px; padding: 12px; box-sizing: border-box; font-size: 16px; }
    button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <h2>TappyThing Intake</h2>

  <form id="intakeForm" onsubmit="handleFormSubmit(event)">
    <input type="text" id="customerName" name="customerName" placeholder="Customer Name" required>
    <input type="text" id="machineType" name="machineType" placeholder="Machine / Model">
    <textarea id="transcript" name="transcript" placeholder="Voice transcript or intake notes" rows="5"></textarea>
    <button type="submit">Submit Intake</button>
  </form>

  <script>
    async function handleFormSubmit(event) {
      event.preventDefault();

      const payload = {
        customerName: document.getElementById('customerName')?.value || "Unknown Name",
        machineType: document.getElementById('machineType')?.value || "Unknown Machine",
        transcript: document.getElementById('transcript')?.value || "",
        targetGroup: "Staff Intake — Pending Review"
      };

      try {
        const response = await fetch('https://hook.us2.make.com/q6s4cfv1g27xnxx8mn9m1dn889w23vt7', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          alert('Intake submitted successfully!');
          document.getElementById('intakeForm').reset();
        } else {
          alert('Submission error. Please try again.');
        }
      } catch (err) {
        console.error('Submission error:', err);
        alert('Failed to connect to intake server.');
      }
    }
  </script>

</body>
</html>
