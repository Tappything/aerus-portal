<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TappyThing Portal</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-soft: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
    }
    body { margin: 0; font-family: system-ui, sans-serif; background: linear-gradient(180deg, #0f172a, #111827); color: var(--text); }
    .container { max-width: 720px; margin: 0 auto; padding: 24px; }
    .card { background: rgba(17,24,39,.9); border: 1px solid rgba(255,255,255,.08); border-radius: 20px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
    h1 { margin-top: 0; font-size: 2rem; }
    p { color: var(--muted); }
    textarea { width: 100%; min-height: 120px; resize: vertical; border-radius: 14px; border: 1px solid rgba(255,255,255,.12); background: #0b1220; color: var(--text); padding: 16px; box-sizing: border-box; }
    button { margin-top: 16px; border: 0; border-radius: 999px; padding: 12px 20px; background: var(--accent); color: #00111a; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #assistantResponse { margin-top: 20px; padding: 16px; background: rgba(255,255,255,.04); border-radius: 14px; min-height: 48px; }
    #micStatus { margin-top: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>TappyThing Portal</h1>
      <p>Type a note or task and Fresh will respond.</p>
      <form id="intakeForm">
        <textarea id="userInput" placeholder="Type your note here..."></textarea>
        <button id="submitBtn" type="submit">Send</button>
      </form>
      <div id="micStatus"></div>
      <div id="assistantResponse"></div>
    </div>
  </div>

  <script>
    const intakeForm = document.getElementById('intakeForm');
    const userInput = document.getElementById('userInput');
    const assistantResponse = document.getElementById('assistantResponse');
    const micStatus = document.getElementById('micStatus');
    const submitBtn = document.getElementById('submitBtn');

    function setMicStatus(message) {
      micStatus.textContent = message;
    }

    function speakResponse(text) {
      if (!window.speechSynthesis || !text) return;
      const utterance = new SpeechSynthesisUtterance(text);
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    intakeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      submitBtn.disabled = true;
      setMicStatus('Sending...');
      assistantResponse.textContent = '';

      try {
        const response = await fetch('/.netlify/functions/intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body: message })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          console.error('Fetch failed:', response.status, response.statusText, data);
          alert(data?.error || `Request failed with status ${response.status}`);
          return;
        }

        console.log('Fetch response data:', data);

        const reply = data?.reply || '';
        if (!reply) {
          console.error('No reply returned from server:', data);
          alert('No reply was returned from the server. Check the console for details.');
          return;
        }

        setMicStatus('');
        assistantResponse.textContent = reply;
        speakResponse(reply);
        intakeForm.classList.remove('active');
      } catch (error) {
        console.error('Fetch threw an error:', error);
        alert(`Network or fetch error: ${error.message}`);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
