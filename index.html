<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forever Card™ — Powered by TappyThing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body { background-color: #ECE8DF; color: #1E293B; font-family: 'Inter', sans-serif; }
    .physical-card {
      background: #FAF9F5;
      border: 2px solid #D6CEC0;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.12), 0 0 15px rgba(16, 185, 129, 0.08);
    }
    .pulse-record { animation: pulse-mic 1.2s infinite; background-color: #DC2626 !important; }
    @keyframes pulse-mic {
      0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.8); }
      70% { box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6 antialiased">

  <div class="physical-card max-w-4xl w-full rounded-3xl p-5 sm:p-8 space-y-6 relative overflow-hidden">

    <!-- 1. MASTER HEADER WITH VECTOR SVG FRESH MASCOT CENTERPIECE -->
    <header class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center border-b border-[#E2DACC] pb-5">
      
      <!-- LEFT: CURSIVE 'F' BRANDING -->
      <div class="flex items-center space-x-3 justify-center md:justify-start">
        <div class="text-5xl font-['Great_Vibes'] text-emerald-700 font-bold select-none drop-shadow-sm pr-1">F</div>
        <div>
          <h1 class="text-base font-black tracking-wider text-slate-900 uppercase font-mono">FOREVER CARD<span class="text-emerald-700">™</span></h1>
          <p class="text-[11px] text-slate-500 font-medium">Powered by TappyThing</p>
        </div>
      </div>

      <!-- CENTER: VECTOR SVG MASCOT & TOP INTAKE CONTROLS -->
      <div class="flex flex-col items-center justify-center space-y-2">
        <div class="w-20 h-20 rounded-full border-2 border-emerald-600 bg-white p-0.5 shadow-md flex items-center justify-center overflow-hidden">
          <svg viewBox="0 0 200 200" class="w-full h-full">
            <circle cx="100" cy="100" r="95" fill="white" stroke="#059669" stroke-width="4"/>
            <path d="M 75 52 Q 88 38 100 42 Q 112 38 125 52 Q 112 46 100 48 Q 88 46 75 52 Z" fill="#1E293B"/>
            <circle cx="100" cy="72" r="28" fill="#1E293B"/>
            <rect x="78" y="66" width="44" height="13" rx="4" fill="#000"/>
            <ellipse cx="88" cy="72" rx="8" ry="4" fill="#38BDF8"/>
            <ellipse cx="112" cy="72" rx="8" ry="4" fill="#38BDF8"/>
            <path d="M 88 88 Q 100 98 112 88" stroke="#1E293B" stroke-width="3" fill="none"/>
            <path d="M 68 110 Q 100 100 132 110 L 132 135 L 68 135 Z" fill="#1E293B"/>
            <text x="100" y="158" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="20" text-anchor="middle" fill="#059669">FRESH</text>
            <text x="100" y="174" font-family="'Inter', sans-serif" font-weight="700" font-size="8" text-anchor="middle" fill="#64748B">DIGITAL COORDINATOR</text>
          </svg>
        </div>

        <div class="flex items-center space-x-2">
          <button id="masterMicBtn" onclick="toggleVoiceDictation()" class="bg-emerald-700 hover:bg-emerald-600 text-white px-4 py-2 rounded-full font-bold text-xs flex items-center space-x-1.5 shadow-md transition transform active:scale-95">
            <i class="fa-solid fa-microphone text-xs"></i>
            <span>🎙️ TALK TO FRESH</span>
          </button>
          <button onclick="alert('📷 Camera Active: Snap photo of equipment serial tag!')" class="bg-slate-900 hover:bg-slate-800 text-white px-3 py-2 rounded-full font-bold text-xs flex items-center space-x-1.5 shadow-md transition transform active:scale-95">
            <i class="fa-solid fa-camera text-xs"></i>
            <span>📷 CAM</span>
          </button>
        </div>
      </div>

      <!-- RIGHT: SUBSCRIBER IDENTITY -->
      <div class="flex items-center space-x-3 justify-center md:justify-end">
        <div class="text-center md:text-right">
          <div id="displayOrgName" class="text-sm font-black text-slate-900 tracking-wide">Aerus Timonium</div>
          <div class="text-[11px] text-emerald-700 flex items-center justify-center md:justify-end space-x-1 font-mono font-bold">
            <span class="w-2 h-2 rounded-full bg-emerald-600 inline-block animate-ping"></span>
            <span>Subscriber Hub Active</span>
          </div>
        </div>
      </div>

    </header>

    <!-- 2. MAIN HUB FLOOR: SCHEDULE GRID & CLEAN PINBALL QUEUE -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      
      <!-- SCHEDULE GRID -->
      <div class="bg-[#F3EFE6] border border-[#E2DACC] rounded-2xl p-4 space-y-3 min-h-[180px]">
        <div class="flex items-center justify-between border-b border-[#E2DACC] pb-2">
          <div class="flex items-center space-x-2">
            <i class="fa-solid fa-calendar-days text-blue-700 text-sm"></i>
            <h2 class="text-xs font-bold text-blue-950 uppercase font-mono tracking-wider">Schedule Grid</h2>
          </div>
          <span class="text-[10px] text-slate-500 font-mono font-bold">Synced Cal</span>
        </div>
        
        <div id="scheduledItemsSlot" class="space-y-2 text-xs font-mono max-h-40 overflow-y-auto">
          <!-- Unique scheduled items populate here -->
        </div>
      </div>

      <!-- PINBALL QUEUE -->
      <div class="bg-[#F3EFE6] border border-[#E2DACC] rounded-2xl p-4 space-y-3 min-h-[180px]">
        <div class="flex items-center justify-between border-b border-[#E2DACC] pb-2">
          <div class="flex items-center space-x-2">
            <span class="text-sm">🎯</span>
            <h2 class="text-xs font-bold text-amber-950 uppercase font-mono tracking-wider">Pinball Queue</h2>
          </div>
          <button onclick="clearQueue()" class="text-[10px] text-red-600 font-mono font-bold underline">Clear Queue</button>
        </div>

        <div id="pinballActionsList" class="space-y-2 text-xs font-mono max-h-40 overflow-y-auto">
          <div id="pinEmptyState" class="text-slate-400 text-center py-6 italic text-[11px]">Tap TALK TO FRESH above to intake jobs!</div>
        </div>
      </div>

    </div>

    <!-- 3. LIVE VOICE STREAM -->
    <div class="bg-slate-900 text-white rounded-2xl p-3.5 space-y-1 shadow-inner">
      <div class="flex justify-between items-center text-xs">
        <span class="font-bold text-slate-200 font-mono flex items-center space-x-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span>
          <span>Fresh Voice Stream:</span>
        </span>
        <span id="listeningBadge" class="hidden text-[10px] text-red-400 font-bold animate-pulse font-mono">● LISTENING</span>
      </div>
      <p id="liveTranscriptText" class="text-xs text-slate-300 italic font-mono">"Tap TALK TO FRESH above to speak..."</p>
    </div>

    <!-- 4. SUBSCRIBER HUB DOORS -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <button onclick="openSubscriberDoor(1)" class="bg-white hover:bg-slate-50 border-2 border-blue-200 p-3 rounded-2xl text-center transition shadow-sm space-y-1">
        <div class="text-xl">📦</div>
        <div class="text-xs font-black text-blue-800">1. Inventory & Parts</div>
        <div class="text-[10px] text-slate-500 font-medium">1,090 Catalog</div>
      </button>

      <button onclick="openSubscriberDoor(2)" class="bg-white hover:bg-slate-50 border-2 border-amber-200 p-3 rounded-2xl text-center transition shadow-sm space-y-1">
        <div class="text-xl">👥</div>
        <div class="text-xs font-black text-amber-800">2. Staff Roles</div>
        <div class="text-[10px] text-slate-500 font-medium">Dynamic Dispatch</div>
      </button>

      <button onclick="openSubscriberDoor(3)" class="bg-white hover:bg-slate-50 border-2 border-emerald-200 p-3 rounded-2xl text-center transition shadow-sm space-y-1">
        <div class="text-xl">💵</div>
        <div class="text-xs font-black text-emerald-800">3. Cash Register</div>
        <div class="text-[10px] text-slate-500 font-medium">Stripe Balance</div>
      </button>

      <button onclick="openSubscriberDoor(4)" class="bg-white hover:bg-slate-50 border-2 border-purple-200 p-3 rounded-2xl text-center transition shadow-sm space-y-1">
        <div class="text-xl">🌐</div>
        <div class="text-xs font-black text-purple-800">4. Growth Hub</div>
        <div class="text-[10px] text-slate-500 font-medium">Forever Network</div>
      </button>
    </div>

    <!-- EXPANDABLE FOREVER WORKSPACE DRAWER -->
    <div id="forever-work-drawer" class="hidden bg-slate-900 text-white rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 id="drawerTitle" class="text-sm font-bold text-white">Forever Card Workspace</h3>
        <button onclick="closeWorkCard()" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="drawerBody" class="text-xs text-slate-300"></div>
    </div>

  </div>

  <script>
    let isRecording = false;
    let recognition = null;
    let activeCustomer = null;
    let lastProcessedText = "";
    const WEBHOOK_URL = "https://hook.us2.make.com/g6aw7r8759ar5jr5c7ln";

    // 22,283 Customer Vault Match Array
    const vault = [
      { name: "William Sullivan", id: "1004", phone: "4104991313", phoneDisp: "(410) 499-1313", address: "6110 Glenoak Ave, Baltimore, MD 21214", email: "Williamanyvac@gmail.com" },
      { name: "Catherine Wagner", id: "21982", phone: "4435206265", phoneDisp: "(443) 520-6265", address: "1010 Maplehurst Ln, Monkton, MD 21111", email: "cwagner@monkton.org" },
      { name: "Suzie Gray", id: "21948", phone: "3019741448", phoneDisp: "(301) 974-1448", address: "Silver Spring, MD", email: "suzie@example.com" }
    ];

    window.onload = function() {
      setupSpeech();
      localStorage.removeItem('active_card_id');
    };

    function setupSpeech() {
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRec();
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onresult = function(event) {
          const text = event.results[0][0].transcript.trim();
          if (text && text !== lastProcessedText) {
            lastProcessedText = text;
            document.getElementById('liveTranscriptText').innerText = `"${text}"`;
            handleVoiceInput(text);
          }
        };

        recognition.onend = function() { stopDictation(); };
      }
    }

    function toggleVoiceDictation() {
      if (!recognition) return alert('Speech recognition supported in Chrome/Edge.');
      if (!isRecording) startDictation();
      else stopDictation();
    }

    function startDictation() {
      isRecording = true;
      try {
        recognition.start();
        document.getElementById('masterMicBtn').classList.add('pulse-record');
        document.getElementById('listeningBadge').classList.remove('hidden');
        document.getElementById('liveTranscriptText').innerText = "Listening...";
      } catch(e) { console.log(e); }
    }

    function stopDictation() {
      isRecording = false;
      document.getElementById('masterMicBtn').classList.remove('pulse-record');
      document.getElementById('listeningBadge').classList.add('hidden');
    }

    function clearQueue() {
      document.getElementById('pinballActionsList').innerHTML = `<div id="pinEmptyState" class="text-slate-400 text-center py-6 italic text-[11px]">Tap TALK TO FRESH above to intake jobs!</div>`;
      document.getElementById('scheduledItemsSlot').innerHTML = '';
      lastProcessedText = "";
    }

    function handleVoiceInput(text) {
      const lower = text.toLowerCase();
      let match = vault.find(c => lower.includes(c.name.toLowerCase().split(' ')[0]));
      
      if (!match) {
        match = { name: text.split(' ')[0] || "Guest Client", id: "NEW", phoneDisp: "(410) 555-0100", address: "Local Intake", email: "" };
      }
      
      activeCustomer = match;

      const emptyPin = document.getElementById('pinEmptyState');
      if (emptyPin) emptyPin.remove();

      const container = document.getElementById('pinballActionsList');
      container.insertAdjacentHTML('afterbegin', `
        <div class="p-2.5 rounded-xl bg-white border border-emerald-300 flex justify-between items-center shadow-sm text-xs">
          <div>
            <div class="font-bold text-emerald-950">${match.name} (Client #${match.id})</div>
            <div class="text-[10px] text-slate-600 mt-0.5">${text}</div>
          </div>
          <button onclick="openWorkCard('${match.id}')" class="text-[10px] bg-emerald-700 text-white font-bold px-2 py-1 rounded-md hover:bg-emerald-800">Open Traveler</button>
        </div>
      `);

      let timeMatch = text.match(/(\d{1,2}:\d{2}\s*(?:AM|PM|am|pm)?|\d{1,2}\s*(?:AM|PM|am|pm))/i);
      let timeLabel = timeMatch ? timeMatch[0].toUpperCase() : "09:30 AM";

      const calSlot = document.getElementById('scheduledItemsSlot');
      calSlot.insertAdjacentHTML('afterbegin', `
        <div class="p-2.5 rounded-xl bg-white border border-blue-300 shadow-sm flex items-center justify-between text-slate-800 text-xs">
          <div>
            <div class="flex items-center space-x-2">
              <span class="text-[10px] bg-blue-700 text-white px-2 py-0.5 rounded font-mono font-bold">${timeLabel}</span>
              <span class="font-bold text-blue-950">${match.name}</span>
            </div>
            <p class="text-[10px] text-slate-600 mt-0.5">${match.address} • ${match.phoneDisp}</p>
          </div>
          <button onclick="openWorkCard('${match.id}')" class="text-[10px] text-emerald-700 font-mono font-bold bg-emerald-50 px-2 py-1 rounded border border-emerald-200">Synced Cal</button>
        </div>
      `);

      if (WEBHOOK_URL) {
        fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ transcript: text, customer: match, time: timeLabel })
        }).catch(e => console.error("Webhook error:", e));
      }
    }

    function openWorkCard(clientId) {
      const match = vault.find(c => c.id === clientId) || activeCustomer;
      if (!match) return;

      activeCustomer = match;
      const drawer = document.getElementById('forever-work-drawer');
      const title = document.getElementById('drawerTitle');
      const body = document.getElementById('drawerBody');
      drawer.classList.remove('hidden');

      title.innerText = `📇 Forever Card Workspace — ${match.name}`;
      body.innerHTML = `
        <div class="space-y-4">
          <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 space-y-1">
            <div class="font-bold text-blue-400 text-sm">${match.name} (Client #${match.id})</div>
            <div class="text-slate-300">${match.address}</div>
            <div class="text-emerald-400 font-mono">${match.phoneDisp}</div>
            <div class="text-slate-400 text-[10px]">${match.email}</div>
          </div>

          <div class="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 space-y-3">
            <div class="text-xs font-bold text-white flex justify-between items-center">
              <span>Dynamic Stripe Invoice Builder</span>
              <span class="text-[10px] text-emerald-400 font-mono">Workiz Terminal</span>
            </div>
            
            <div class="flex gap-2">
              <input id="serviceMemoInput" type="text" placeholder="Service memo (e.g. Water Test & Filter Check)" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
              <input id="invoiceAmountInput" type="number" placeholder="$0.00" class="w-24 bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-emerald-400 font-mono font-bold">
            </div>

            <button onclick="dispatchCustomPayLink('${match.phoneDisp}')" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-black py-2.5 rounded-xl text-xs uppercase tracking-wider transition">
              🚀 Dispatch Custom Stripe Pay Link
            </button>
          </div>

          <div class="border-t border-slate-800 pt-4 space-y-3">
            <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider text-center">👇 Customer's View of Forever Card</div>
            
            <div class="bg-white text-slate-900 p-4 rounded-2xl border-2 border-emerald-600 shadow-lg space-y-3">
              <div class="flex justify-between items-center border-b pb-2">
                <div class="font-['Great_Vibes'] text-3xl text-emerald-700 font-bold">F</div>
                <div class="text-right">
                  <div class="font-bold text-xs">${match.name}'s Forever Card</div>
                  <div class="text-[9px] text-slate-500">${match.phoneDisp}</div>
                </div>
              </div>

              <div class="bg-slate-50 p-3 rounded-xl border text-xs space-y-1 text-slate-700">
                <div class="font-bold text-emerald-800">Aerus Home System Profile</div>
                <div>Status: <span class="text-emerald-600 font-bold">● Active</span> | Equipment Tag: Aerus Beyond Core</div>
                <div>Address: ${match.address}</div>
              </div>

              <div class="flex justify-between items-center pt-1">
                <button onclick="alert('Customer view link copied!')" class="text-[10px] bg-slate-900 text-white font-mono px-3 py-1.5 rounded-lg font-bold">
                  🔗 Share Customer View
                </button>
                <div class="text-[10px] text-emerald-700 font-bold">Fresh Concierge Active 🤵</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function dispatchCustomPayLink(phone) {
      const memo = document.getElementById('serviceMemoInput').value || "Aerus Service";
      const amt = document.getElementById('invoiceAmountInput').value || "0.00";
      alert(`🚀 Stripe Pay Link for $${amt} (${memo}) dispatched directly to ${phone}!`);
    }

    function closeWorkCard() {
      const drawer = document.getElementById('forever-work-drawer');
      if (drawer) drawer.classList.add('hidden');
    }

    function openSubscriberDoor(doorNum) {
      const drawer = document.getElementById('forever-work-drawer');
      const title = document.getElementById('drawerTitle');
      const body = document.getElementById('drawerBody');
      drawer.classList.remove('hidden');

      if (doorNum === 1) {
        title.innerText = "Door 1: Inventory & Parts Catalog";
        body.innerHTML = `<p class="text-slate-300">Accessing 1,090 Aerus verified inventory items...</p>`;
      } else if (doorNum === 2) {
        title.innerText = "Door 2: Staff Roles & Dynamic Dispatch";
        body.innerHTML = `
          <div class="space-y-2 font-mono text-xs">
            <div class="p-2 bg-slate-800 rounded border border-slate-700 text-blue-300">[Counter Intake] — Mona / Front Desk</div>
            <div class="p-2 bg-slate-800 rounded border border-slate-700 text-amber-300">[Master Bench Tech] — Chris / Parts Lead</div>
            <div class="p-2 bg-slate-800 rounded border border-slate-700 text-emerald-300">[Field Installations] — Mike / Tech</div>
            <div class="p-2 bg-slate-800 rounded border border-slate-700 text-purple-300">[Digital VA] — Norby / FOAS Lead</div>
          </div>
        `;
      } else if (doorNum === 3) {
        title.innerText = "Door 3: Cash Register & Stripe Terminal";
        body.innerHTML = `<p class="text-slate-300">Workiz Terminal • Available Payout Balance: $1,485.20</p>`;
      } else if (doorNum === 4) {
        title.innerText = "Door 4: Growth Hub & Forever Network";
        body.innerHTML = `<p class="text-slate-300">Forever Network • Automated SMS Recall Engine Active</p>`;
      }
    }
  </script>
</body>
</html>
