<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TappyThing — Digital Coordinator</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 8px;
        }
        .tagline {
            color: #aaa;
            margin-bottom: 40px;
            font-size: 14px;
        }
        .tap-button {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            border: 3px solid #ffd700;
            border-radius: 50%;
            width: 180px;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px auto;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.2);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .tap-button:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }
        .mic-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .tap-label {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ffd700;
        }
        .status {
            font-size: 14px;
            color: #00ff88;
            min-height: 24px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">TappyThing</div>
        <div class="tagline">Calm the chaos.</div>

        <div class="tap-button" id="mainButton" onclick="handleTap()">
            <div class="mic-icon">🎙️</div>
            <div class="tap-label">TAP TO SPEAK</div>
        </div>

        <div class="status" id="statusText">Your TAP is my command</div>
    </div>

    <script>
        async function handleTap() {
            const statusEl = document.getElementById('statusText');
            
            // Check speech recognition support or use text prompt
            const userInput = prompt("Speak or type your request for the Digital Coordinator:");
            
            if (!userInput || userInput.trim() === "") {
                statusEl.innerText = "Operation canceled.";
                return;
            }

            statusEl.innerText = "Sending to AERUS OPS BOARD...";

            try {
                const response = await fetch('https://hook.us2.make.com/q6s4cfv1g27xnxx8mn9m1dn889w23vt7', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        transcript: userInput
                    })
                });

                if (response.ok) {
                    statusEl.innerText = "✅ Sent directly to Monday.com!";
                } else {
                    statusEl.innerText = "⚠️ Delivery failed. Retrying...";
                }
            } catch (error) {
                statusEl.innerText = "❌ Network error. Check connection.";
                console.error("Error sending transcript:", error);
            }
        }
    </script>
</body>
</html>
