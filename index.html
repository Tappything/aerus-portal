<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TappyThing | Aerus Home Wellness</title>
  <style>
    /* Global Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a1a; /* Dark Charcoal */
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* Header Bar */
    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      margin-bottom: 30px;
    }
    .brand-left, .brand-right {
      color: #d4af37; /* Metallic Gold */
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 1px;
    }

    /* Digital Coordinator SVG Intake Trigger */
    .intake-container {
      text-align: center;
      margin-bottom: 40px;
      cursor: pointer;
    }
    .coordinator-svg {
      width: 90px;
      height: 90px;
      fill: #d4af37;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .intake-container:hover .coordinator-svg {
      transform: scale(1.05);
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.6));
    }
    .intake-label {
      margin-top: 10px;
      color: #d4af37;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
    }

    /* 4 Cards Grid Layout */
    .card-grid {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    /* Rounded Card Styling */
    .card {
      background-color: #242424;
      border: 1px solid #d4af37;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
    }
    .card-title {
      color: #d4af37;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding-bottom: 8px;
    }
    .card-content {
      color: #e0e0e0;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    /* Responsive Mobile Stacking */
    @media (max-width: 768px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
      header {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand-left">Aerus Home Wellness</div>
    <div class="brand-right">TappyThing</div>
  </header>

  <!-- Digital Coordinator SVG Intake Trigger -->
  <div class="intake-container" id="intakeTrigger">
    <svg class="coordinator-svg" viewBox="0 0 24 24">
      <path d="M12 1a9 9 0 0 0-9 9v7a3 3 0 0 0 3 3h3v-8H5v-2a7 7 0 0 1 14 0v2h-4v8h3a3 3 0 0 0 3-3v-7a9 9 0 0 0-9-9zm-4 18H6a1 1 0 0 1-1-1v-3h3v4zm11-1a1 1 0 0 1-1 1h-2v-4h3v3zM12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
    </svg>
    <div class="intake-label">TAP TO SPEAK</div>
  </div>

  <!-- 4 Cards Side-by-Side Grid -->
  <div class="card-grid">
    
    <div class="card" onclick="fetchCardData('operations')">
      <div class="card-title">Operations</div>
      <div class="card-content" id="content-operations">Active tasks & dispatch queue</div>
    </div>

    <div class="card" onclick="fetchCardData('myworld')">
      <div class="card-title">My World</div>
      <div class="card-content" id="content-myworld">Dashboard & quick notes</div>
    </div>

    <div class="card" onclick="fetchCardData('personal')">
      <div class="card-title">Personal</div>
      <div class="card-content" id="content-personal">Private tracking & schedule</div>
    </div>

    <div class="card" onclick="fetchCardData('referral')">
      <div class="card-title">Referral Engine</div>
      <div class="card-content" id="content-referral">Leads, tracking & rewards</div>
    </div>

  </div>

  <!-- JavaScript Operations -->
  <script>
    // 1. Intake Form Submission (Transcript Mapped to Make.com Webhook)
    document.getElementById('intakeTrigger').addEventListener('click', function() {
      const userInput = prompt("Speak or type your request for the Digital Coordinator:");
      if (userInput) {
        fetch('https://hook.us2.make.com/q6s4cfv1g27xnxx8mn9m1dn889w23vt7', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            transcript: userInput,
            timestamp: new Date().toISOString(),
            source: 'TappyThing Web Intake'
          })
        })
        .then(response => {
          alert('On it! Your tap is my command!.');
        })
        .catch(error => {
          console.error('Error submitting intake:', error);
          alert('Submission error. Please try again.');
        });
      }
    });

    // 2. fetchCardData Function (POST Request with Board Payload)
    function fetchCardData(cardType) {
      const contentElement = document.getElementById(`content-${cardType}`);
      contentElement.innerText = "Loading latest updates...";

      fetch('/.netlify/functions/monday', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ boardId: '18424728273' })
      })
        .then(response => response.json())
        .then(data => {
          if (data && data.message) {
            contentElement.innerText = data.message;
          } else {
            contentElement.innerText = "No active items in queue.";
          }
        })
        .catch(error => {
          console.error(`Error fetching ${cardType} data:`, error);
          contentElement.innerText = "Unable to load data at this time.";
        });
    }
  </script>

</body>
</html>
