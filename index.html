<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TappyThing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2d0057;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:white;}
h1{font-size:2rem;font-weight:900;letter-spacing:0.1em;margin-bottom:40px;}
.mic{width:160px;height:160px;border-radius:50%;background:#8b00ff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px #8b00ff88;}
.mic svg{width:60px;height:60px;fill:white;}
.label{margin-top:16px;font-size:1rem;letter-spacing:0.3em;font-weight:700;}
.bubble{margin-top:24px;background:#5a0099;padding:16px 24px;border-radius:20px;max-width:320px;text-align:center;display:none;}
.world{margin-top:32px;background:transparent;border:1px solid rgba(255,255,255,0.3);color:white;padding:10px 24px;border-radius:999px;cursor:pointer;font-size:0.9rem;}
</style>
</head>
<body>
<h1>TappyThing</h1>
<button class="mic" id="micButton" aria-label="Tap to speak">
<svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 0 0 3.5-3.5V7a3.5 3.5 0 1 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V21H8.5a1 1 0 1 0 0 2h7a1 1 0 1 0 0-2H13v-3.09A6 6 0 0 0 18 12Z"/></svg>
</button>
<div class="label">TAP TO SPEAK</div>
<div class="bubble" id="freshBubble"></div>
<button class="world">🌎 My World</button>
<script>
const micButton=document.getElementById('micButton');
const freshBubble=document.getElementById('freshBubble');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null;
if(SR){recognition=new SR();recognition.lang='en-US';recognition.continuous=false;recognition.interimResults=false;}
micButton.addEventListener('click',()=>{if(recognition)recognition.start();});
if(recognition){recognition.addEventListener('result',async(e)=>{const msg=e.results[0][0].transcript;const r=await fetch('/.netlify/functions/intake',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:msg})});const d=await r.json();const reply=d.reply||'';freshBubble.textContent=reply;freshBubble.style.display='block';if(reply&&window.speechSynthesis){const u=new SpeechSynthesisUtterance(reply);window.speechSynthesis.speak(u);}});}
</script>
</body>
</html>
