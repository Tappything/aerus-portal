<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TappyThing — Digital Coordinator</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --text-light: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Initial 1-Tap Screen */
        .hero-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hero-container.active {
            height: auto;
            padding-top: 30px;
        }

        .main-logo-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: 4px solid #fef3c7;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 75px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
        }

        .main-logo-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.8);
        }

        .tap-label {
            margin-top: 20px;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Hidden Content Until Tapped */
        .dashboard-content {
            display: none;
            width: 90%;
            max-width: 1000px;
            opacity: 0;
            transition: opacity 0.5s ease;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 50px;
        }

        .dashboard-content.show {
            display: flex;
            opacity: 1;
        }

        /* Secondary Industry Selector */
        .industry-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        .industry-bar input {
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #334155;
            background: var(--card-bg);
            color: white;
            font-size: 1rem;
            width: 60%;
        }

        /* 3-Tool Buttons */
        .tool-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .tool-btn {
            background: var(--card-bg);
            border: 1px solid #334155;
            color: white;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Cascading Cards Container */
        .board-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .column {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
        }

        .card {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 4px solid var(--accent-gold);
        }
    </style>
</head>
<body>

    <!-- 1-TAP CENTER HERO BUTTON -->
    <div class="hero-container" id="heroContainer">
        <div class="main-logo-btn" onclick="openSystem()">🎩</div>
        <div class="tap-label" id="tapText">Tap to Start</div>
    </div>

    <!-- REVEALED DASHBOARD -->
    <div class="dashboard-content" id="dashboardContent">
        
        <!-- Quick Industry Bar -->
        <div class="industry-bar">
            <input type="text" placeholder="Tell Fresh your industry (e.g. Plumbing, Cleaning)...">
        </div>

        <!-- 3-Tool Bar -->
        <div class="tool-bar">
            <button class="tool-btn">🎙️ Voice</button>
            <button class="tool-btn">⌨️ Type</button>
            <button class="tool-btn">📷 Camera</button>
        </div>

        <!-- Cascading Cards Deck -->
        <div class="board-grid">
            <div class="column">
                <h3>📥 Intake / Waiting</h3>
                <div class="card"><strong>Fresh Tour</strong><br>Tap logo to begin reverse-interview.</div>
            </div>
            <div class="column">
                <h3>⚡ In-Progress</h3>
                <div class="card"><strong>Live System Build</strong><br>Cascading boards generated live.</div>
            </div>
            <div class="column">
                <h3>💰 Invoicing / Ready</h3>
                <div class="card"><strong>$95/mo Subscription</strong><br>Full system automation.</div>
            </div>
        </div>
    </div>

    <script>
        function openSystem() {
            document.getElementById('heroContainer').classList.add('active');
            document.getElementById('tapText').style.display = 'none';
            document.getElementById('dashboardContent').classList.add('show');
            
            // Native voice welcome trigger
            if ('speechSynthesis' in window) {
                const msg = new SpeechSynthesisUtterance("Hey there! I'm Fresh. We're setting up your system for both your business and your home. What business are we taking over today?");
                window.speechSynthesis.speak(msg);
            }
        }
    </script>
</body>
</html>
