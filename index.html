<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TappyThing — Invoice & Ticket Engine</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #131c2e;
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-green: #10b981;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --border-color: #23324d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 12px; }

    .brick-container { width: 100%; max-width: 460px; background: #0f172a; border-radius: 28px; border: 2px solid var(--border-color); padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }

    /* Top Brand Header */
    .header { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 10px 14px; border-radius: 20px; border: 1px solid var(--border-color); }
    .brand-info { display: flex; align-items: center; gap: 10px; }
    
    .logo-badge { width: 42px; height: 42px; border-radius: 50%; background: #020617; border: 2px solid var(--accent-green); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(16,185,129,0.3); }
    .brand-title { font-size: 1.05rem; font-weight: 900; letter-spacing: 0.5px; color: #fff; }
    .brand-sub { font-size: 0.65rem; color: var(--accent-green); font-weight: 800; letter-spacing: 1px; }
    .brick-badge { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); font-size: 0.65rem; font-weight: 800; padding: 4px 8px; border-radius: 12px; border: 1px solid var(--accent-green); }

    /* Search & Customer Card */
    .customer-card { background: var(--card-bg); border-radius: 18px; padding: 14px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; position: relative; }
    .cust-search-input { width: 100%; background: #090d16; border: 1px solid var(--border-color); color: #fff; padding: 10px 12px; border-radius: 12px; font-weight: 600; font-size: 0.85rem; outline: none; }
    .cust-search-input:focus { border-color: var(--accent-cyan); }
    
    .search-results-dropdown { position: absolute; top: 100%; left: 14px; right: 14px; background: #0b1324; border: 1px solid var(--accent-cyan); border-radius: 12px; max-height: 180px; overflow-y: auto; z-index: 50; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
    .search-item { padding: 10px 12px; border-bottom: 1px solid #1e293b; cursor: pointer; font-size: 0.8rem; }
    .search-item:hover { background: #1a263e; }
    .search-item:last-child { border-bottom: none; }

    .cust-details { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 0.78rem; padding-top: 6px; border-top: 1px solid #1e293b; }
    .cust-meta { color: var(--text-sub); }
    .cust-meta-right { text-align: right; color: var(--accent-cyan); font-weight: 700; }

    /* Quick 1-Tap Selectors */
    .section-label { font-size: 0.7rem; font-weight: 800; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 1px; }
    .select-dropdown { width: 100%; background: #090d16; border: 1px solid var(--border-color); color: #fff; padding: 9px 12px; border-radius: 12px; font-weight: 600; font-size: 0.82rem; outline: none; cursor: pointer; }

    /* Itemized Lines List */
    .items-list { background: #080d1a; border-radius: 14px; padding: 10px; border: 1px solid var(--border-color); min-height: 60px; display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; }
    .item-row { display: flex; justify-content: space-between; align-items: center; color: #cbd5e1; padding: 4px 0; border-bottom: 1px solid #141f33; }
    .item-row:last-child { border-bottom: none; }
    .empty-notice { color: var(--text-sub); text-align: center; margin: auto; font-style: italic; }

    /* Math Totals Box */
    .math-box { background: var(--card-bg); border-radius: 16px; padding: 14px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; }
    .math-row { display: flex; justify-content: space-between; color: var(--text-sub); }
    .math-row.total { border-top: 1px solid var(--border-color); padding-top: 8px; margin-top: 2px; font-weight: 900; font-size: 1.05rem; color: #fff; }
    .total-val { color: var(--accent-green); }

    /* Action Buttons */
    .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .action-btn { padding: 12px; border-radius: 14px; border: none; font-weight: 800; font-size: 0.8rem; cursor: pointer; text-align: center; }
    .btn-sec { background: #23324d; color: #fff; }
    .btn-pri { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); color: #0a0f1d; font-weight: 900; }

    @media print {
      body { background: #fff !important; color: #000 !important; padding: 0 !important; }
      .brick-container { max-width: 100% !important; border: none !important; box-shadow: none !important; padding: 20px !important; }
      .header, .actions-grid, .select-dropdown, .cust-search-input, .section-label, .search-results-dropdown { display: none !important; }
      .customer-card, .items-list, .math-box { background: #fff !important; color: #000 !important; border: 1px solid #000 !important; }
      .total-val, .btn-price, .cust-meta-right { color: #000 !important; font-weight: bold !important; }
      .item-row { color: #000 !important; border-bottom: 1px solid #ccc !important; }
    }
  </style>
</head>
<body>

<div class="brick-container">
  <!-- Brand Header -->
  <div class="header">
    <div class="brand-info">
      <div class="logo-badge">
        <svg viewBox="0 0 100 100" style="width: 26px; height: 26px;">
          <rect width="100" height="100" rx="20" fill="#020617"/>
          <path d="M15 32 C35 18, 65 18, 85 32 L88 42 C68 28, 32 28, 12 42 Z" fill="#10b981"/>
          <path d="M18 36 C35 28, 65 28, 82 36 L85 46 C68 38, 32 38, 15 46 Z" fill="#047857"/>
          <path d="M22 50 Q38 48 48 53 L48 64 Q32 66 22 58 Z" fill="#020617" stroke="#34d399" stroke-width="2"/>
          <path d="M52 53 Q62 48 78 50 L78 58 Q68 66 52 64 Z" fill="#020617" stroke="#34d399" stroke-width="2"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">TAPPYTHING</div>
        <div class="brand-sub">POWERED BY FRESH 🤵</div>
      </div>
    </div>
    <div class="brick-badge">BRICK 1: INVOICE</div>
  </div>

  <!-- Live Customer Vault Lookup -->
  <div class="customer-card">
    <label class="section-label">Customer Search (Type Name / Phone)</label>
    <input type="text" id="custSearchInput" class="cust-search-input" onkeyup="handleCustomerSearch()" placeholder="Type customer name (e.g. Ruth, Sue, Paul, or New)...">
    <div id="custSearchResults" class="search-results-dropdown" style="display: none;"></div>

    <div class="cust-details">
      <div>
        <div id="dispCustName" style="font-weight: 800; color: #fff;">No Customer Selected</div>
        <div id="dispCustAddress" class="cust-meta">Search vault above</div>
      </div>
      <div style="text-align: right;">
        <div id="dispCustPhone" class="cust-meta-right">---</div>
        <div id="dispCustId" class="cust-meta">Ticket #---</div>
      </div>
    </div>
  </div>

  <!-- 1-Tap Labor Selector -->
  <div>
    <label class="section-label">⚡ 1-Tap Labor & Services (0% Tax)</label>
    <select id="quickLaborSelect" onchange="addQuickLabor()" class="select-dropdown" style="margin-top: 4px;">
      <option value="">-- Select Labor / Service --</option>
      <option value="60.00|Bench Repair Labor & Tune-Up">Bench Repair Labor & Tune-Up — $60.00</option>
      <option value="50.00|Bench Diagnostic & Labor">Bench Diagnostic & Labor — $50.00</option>
      <option value="40.00|Standard Labor Charge">Standard Labor Charge — $40.00</option>
      <option value="450.00|Professional RO Installation">Professional RO Installation — $450.00</option>
      <option value="300.00|Standard RO Installation">Standard RO Installation — $300.00</option>
      <option value="0.00|Free Equipment Inspection">Free Equipment Inspection — $0.00</option>
    </select>
  </div>

  <!-- 1-Tap Consumables Selector (Featuring C-Bags 24-Pack) -->
  <div>
    <label class="section-label">📦 1-Tap Top Consumables & Parts (6% Tax)</label>
    <select id="quickConsumableSelect" onchange="addQuickConsumable()" class="select-dropdown" style="margin-top: 4px;">
      <option value="">-- Select Consumable / Fast-Mover --</option>
      <option value="48.00|C-Bags 24-Pack">C-Bags 24-Pack — $48.00 (Top Seller)</option>
      <option value="24.00|C-Bags 12-Pack">C-Bags 12-Pack — $24.00</option>
      <option value="24.95|Standard Vacuum Bags (4-Pack)">Standard Vacuum Bags (4-Pack) — $24.95</option>
      <option value="15.00|Replacement Fan Assembly">Replacement Fan Assembly — $15.00</option>
      <option value="49.95|HEPA Filter Replacement">HEPA Filter Replacement — $49.95</option>
      <option value="325.00|Pure & Gentle Soap Program">Pure & Gentle Soap Program — $325.00</option>
      <option value="18.00|Water Softening Salt Pellets">Water Softening Salt Pellets — $18.00</option>
      <option value="15.00|Drive Belt (2-Pack)">Drive Belt (2-Pack) — $15.00</option>
    </select>
  </div>

  <!-- Itemized Ticket Lines -->
  <div>
    <div class="section-label" style="margin-bottom: 4px;">Itemized Ticket Lines</div>
    <div class="items-list" id="itemsContainer">
      <div class="empty-notice">No items on ticket yet. Select from dropdowns above.</div>
    </div>
  </div>

  <!-- Live Maryland Tax Math Box -->
  <div class="math-box">
    <div class="math-row"><span>Labor Subtotal (Tax Exempt):</span><span id="lblLabor">$0.00</span></div>
    <div class="math-row"><span>Parts Subtotal:</span><span id="lblParts">$0.00</span></div>
    <div class="math-row"><span>MD Tax (6% Parts Only):</span><span id="lblTax">$0.00</span></div>
    <div class="math-row total"><span>Total Due:</span><span class="total-val" id="lblTotal">$0.00</span></div>
  </div>

  <!-- Action Controls -->
  <div class="actions-grid">
    <button class="action-btn btn-sec" onclick="clearTicket()">🗑️ Clear Ticket</button>
    <button class="action-btn btn-pri" onclick="printInvoice()">🖨️ Print / Save PDF</button>
  </div>
</div>

<script>
  // Searchable Customer Vault Database
  const CUSTOMER_VAULT = [
    { id: "22086", name: "Ruth Tucker", address: "6 Lagan Ct, Nottingham, MD", phone: "(410) 256-6949" },
    { id: "8448", name: "Sue Freeland", address: "8095 Sandpiper Circle, Nottingham, MD", phone: "(443) 629-4180" },
    { id: "22085", name: "Paul Schwab", address: "8515 Huntspring Dr, Lutherville, MD", phone: "(410) 294-6383" },
    { id: "22084", name: "Claire Hartman", address: "1902 Corbridge Ln, Monkton, MD", phone: "(443) 336-6380" },
    { id: "22083", name: "Richard Smothers", address: "1204 Dulaney Valley Rd, Towson, MD", phone: "(410) 825-1100" }
  ];

  let activeCustomer = null;
  let lines = [];

  function handleCustomerSearch() {
    const input = document.getElementById('custSearchInput');
    const resultsDiv = document.getElementById('custSearchResults');
    const query = input.value.trim().toLowerCase();

    if (query.length < 2) {
      resultsDiv.style.display = 'none';
      return;
    }

    const matches = CUSTOMER_VAULT.filter(c => 
      c.name.toLowerCase().includes(query) || c.phone.includes(query) || c.id.includes(query)
    );

    if (matches.length === 0) {
      resultsDiv.innerHTML = `
        <div class="search-item" onclick="createOnTheFlyCustomer('${input.value.trim()}')">
          <span style="color: #10b981; font-weight: bold;">+ Add New Customer:</span> "${input.value.trim()}"
        </div>
      `;
    } else {
      resultsDiv.innerHTML = matches.map(c => `
        <div class="search-item" onclick="selectCustomer('${c.id}')">
          <div style="font-weight: bold; color: #fff;">${c.name} <span style="color: #00f2fe;">#${c.id}</span></div>
          <div style="color: #94a3b8; font-size: 0.75rem;">${c.address} • ${c.phone}</div>
        </div>
      `).join('');
    }

    resultsDiv.style.display = 'block';
  }

  function selectCustomer(id) {
    activeCustomer = CUSTOMER_VAULT.find(c => c.id === id);
    if (!activeCustomer) return;

    document.getElementById('dispCustName').innerText = activeCustomer.name;
    document.getElementById('dispCustAddress').innerText = activeCustomer.address;
    document.getElementById('dispCustPhone').innerText = activeCustomer.phone;
    document.getElementById('dispCustId').innerText = 'Ticket #' + activeCustomer.id;

    document.getElementById('custSearchInput').value = '';
    document.getElementById('custSearchResults').style.display = 'none';
  }

  function createOnTheFlyCustomer(name) {
    const newId = Math.floor(10000 + Math.random() * 90000).toString();
    activeCustomer = {
      id: newId,
      name: name || "New Customer",
      address: "Local Service Territory",
      phone: "N/A"
    };

    document.getElementById('dispCustName').innerText = activeCustomer.name;
    document.getElementById('dispCustAddress').innerText = activeCustomer.address;
    document.getElementById('dispCustPhone').innerText = activeCustomer.phone;
    document.getElementById('dispCustId').innerText = 'Ticket #' + activeCustomer.id;

    document.getElementById('custSearchInput').value = '';
    document.getElementById('custSearchResults').style.display = 'none';
  }

  function addQuickLabor() {
    const sel = document.getElementById('quickLaborSelect');
    if (!sel || !sel.value) return;
    const [price, desc] = sel.value.split('|');
    lines.push({ desc, price: parseFloat(price), isTaxable: false });
    sel.selectedIndex = 0;
    render();
  }

  function addQuickConsumable() {
    const sel = document.getElementById('quickConsumableSelect');
    if (!sel || !sel.value) return;
    const [price, desc] = sel.value.split('|');
    lines.push({ desc, price: parseFloat(price), isTaxable: true });
    sel.selectedIndex = 0;
    render();
  }

  function removeLine(idx) {
    lines.splice(idx, 1);
    render();
  }

  function clearTicket() {
    lines = [];
    render();
  }

  function render() {
    const container = document.getElementById('itemsContainer');
    if (lines.length === 0) {
      container.innerHTML = '<div class="empty-notice">No items on ticket yet. Select from dropdowns above.</div>';
    } else {
      container.innerHTML = lines.map((item, idx) => `
        <div class="item-row">
          <div>
            <span style="font-weight: 700; color: #fff;">${item.desc}</span>
            <span style="font-size: 0.65rem; color: #94a3b8; display: block;">${item.isTaxable ? 'Part (6% Tax)' : 'Labor (0% Tax Exempt)'}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-weight: 800; color: #00f2fe;">${item.price.toFixed(2)}</span>
            <button onclick="removeLine(${idx})" style="background: none; border: none; color: #ef4444; font-weight: bold; cursor: pointer;">✕</button>
          </div>
        </div>
      `).join('');
    }

    let partsSub = 0;
    let laborSub = 0;

    lines.forEach(l => {
      if (l.isTaxable) partsSub += l.price;
      else laborSub += l.price;
    });

    const tax = partsSub * 0.06;
    const total = partsSub + laborSub + tax;

  function printInvoice() {
    if (!activeCustomer) {
      alert("Please search and select a customer first.");
      return;
    }
    if (lines.length === 0) {
      alert("Please add at least one line item before printing.");
      return;
    }
    window.print();

</script>
