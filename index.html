<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOREVER CARD™ — Powered by TappyThing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            parchment: '#f4efe6',
            cardbg: '#fcf9f2',
            gold: '#c5a059',
            forest: '#2e5a44',
            ink: '#1f1e1d',
            muted: '#6b6560',
            bordercolor: '#e2d9cc'
          },
          fontFamily: {
            cursive: ['"Great Vibes"', 'cursive'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #f4efe6; color: #1f1e1d; }
    .drawer-slide { transition: transform 0.3s ease-in-out; }
    .hidden-right-drawer { transform: translateX(100%); }
    .open-right-drawer { transform: translateX(0); }
  </style>
</head>
<body class="font-sans min-h-screen p-4 md:p-6 flex justify-center">

<input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleCameraSnap(event)">

<div class="w-full max-w-5xl flex flex-col gap-5 relative">

  <!-- MASTER HEADER -->
  <header class="bg-cardbg border border-bordercolor rounded-2xl p-5 shadow-sm flex flex-col md:flex-row items-center justify-between gap-5 text-center md:text-left">
    <div class="flex items-center gap-3 justify-center md:justify-start">
      <span class="font-cursive text-7xl text-gold font-bold select-none leading-none">F</span>
      <div class="flex flex-col">
        <span class="font-extrabold text-base tracking-wide text-ink leading-tight">FOREVER CARD™</span>
        <span class="text-xs font-bold text-forest tracking-normal">Powered by TappyThing</span>
      </div>
    </div>

    <!-- CENTER: FRESH MASCOT EMBLEM + CONTROLS -->
    <div class="flex flex-col items-center gap-3 w-full max-w-md mx-auto">
      <div class="w-28 h-28 rounded-full border-4 border-gold bg-white shadow-lg overflow-hidden flex items-center justify-center relative flex-shrink-0">
        <img src="fresh_logo.png" alt="Fresh" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/freshtappything/chassis/main/fresh_logo.png';">
      </div>
      <div class="flex gap-2 justify-center w-full">
        <button id="voice-btn" onclick="toggleVoiceIntake()" class="flex-1 max-w-[180px] py-2.5 bg-forest hover:bg-opacity-90 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-2">
          <span>🎙️</span> <span id="voice-label">TALK TO FRESH</span>
        </button>
        <button onclick="triggerCamera()" class="flex-1 max-w-[180px] py-2.5 bg-ink hover:bg-black text-white font-bold text-xs rounded-xl transition flex items-center justify-center gap-1.5">
          <span>📷</span> <span>CAM</span>
        </button>
      </div>
      <input type="text" id="text-intake" placeholder="💬 Type or speak a note..." 
        onkeydown="checkSubmit(event)"
        class="w-full px-3.5 py-2 border border-bordercolor rounded-xl bg-white text-ink focus:outline-none focus:border-gold text-xs shadow-inner text-center md:text-left">
    </div>

    <!-- RIGHT: LIVE SYSTEM STATUS BADGE -->
    <div class="flex flex-col items-center md:items-end justify-center min-w-[140px]">
      <span id="system-status" class="text-[10px] text-emerald-800 font-extrabold bg-emerald-100 border border-emerald-300 px-2.5 py-1 rounded-full shadow-sm">⚡ Sissy Cloud Active</span>
    </div>
  </header>

  <!-- LIVE STATUS BANNER -->
  <div id="status-banner" class="hidden bg-emerald-100 border border-emerald-300 text-emerald-800 text-xs px-4 py-2 rounded-xl font-bold transition text-center"></div>

  <!-- TWO-COLUMN OPERATIONAL FLOOR -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    <!-- TODAY'S SCHEDULE -->
    <div class="flex flex-col gap-2">
      <div class="text-xs font-extrabold uppercase tracking-widest text-muted flex items-center gap-2">
        <span>📅</span> Today's Schedule
      </div>
      <div class="bg-cardbg border border-bordercolor rounded-2xl p-4 min-h-[160px]">
        <div id="schedule-list" class="flex flex-col gap-2.5"></div>
      </div>
    </div>

    <!-- PINBALL ACTION ZONE -->
    <div class="flex flex-col gap-2">
      <div class="text-xs font-extrabold uppercase tracking-widest text-muted flex items-center gap-2">
        <span>📍</span> Pinball Action Zone
      </div>
      <div class="bg-cardbg border border-bordercolor rounded-2xl p-4 min-h-[160px]">
        <div id="pinball-list" class="flex flex-col gap-2.5"></div>
      </div>
    </div>
  </div>

  <!-- COLLAPSIBLE ARCHIVE HISTORY -->
  <div class="flex flex-col gap-2">
    <button onclick="toggleArchiveView()" class="w-full py-2.5 px-4 bg-cardbg border border-bordercolor rounded-xl text-xs font-bold text-muted hover:text-ink transition flex items-center justify-between">
      <span class="flex items-center gap-2"><span>📦</span> <span id="archive-count-label">View Archive (0)</span></span>
      <span id="archive-chevron">▼</span>
    </button>
    <div id="archive-container" class="hidden bg-cardbg border border-bordercolor rounded-2xl p-4">
      <div id="archive-list" class="flex flex-col gap-1.5 text-xs text-muted"></div>
    </div>
  </div>
</div>

<!-- DYNAMIC WORKSTATION CANVAS DRAWER -->
<div id="workstation-drawer" class="fixed inset-y-0 right-0 w-full max-w-lg bg-cardbg border-l-2 border-gold shadow-2xl p-6 drawer-slide hidden-right-drawer z-50 flex flex-col justify-between overflow-y-auto">
  <div class="flex flex-col gap-4">
    <!-- DRAWER HEADER -->
    <div class="flex justify-between items-center border-b border-bordercolor pb-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full border border-gold bg-white overflow-hidden flex items-center justify-center">
          <img src="fresh_logo.png" alt="Fresh" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/freshtappything/chassis/main/fresh_logo.png';">
        </div>
        <div>
          <h3 id="drawer-title" class="font-bold text-sm text-ink">Client Workstation</h3>
          <div id="drawer-subtitle" class="text-[11px] text-muted">Forever Card™ Record</div>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="toggleNetworking()" id="net-toggle-btn" class="px-2.5 py-0.5 bg-parchment border border-bordercolor rounded-full text-[10px] font-bold text-forest hover:bg-bordercolor transition flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
          <span>Networking: ON</span>
        </button>
        <button onclick="closeWorkstation()" class="text-muted font-bold text-xl hover:text-ink">✕</button>
      </div>
    </div>

    <!-- DYNAMIC CLIENT CARD SUMMARY -->
    <div class="bg-white p-4 rounded-xl border border-bordercolor shadow-sm flex flex-col gap-2">
      <div class="text-xs font-bold text-forest uppercase tracking-wider flex items-center justify-between">
        <span class="flex items-center gap-2">
          <div class="w-5 h-5 rounded-full border border-gold overflow-hidden">
            <img src="fresh_logo.png" alt="Fresh" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/freshtappything/chassis/main/fresh_logo.png';">
          </div>
          <span>Verified Customer Record</span>
        </span>
        <span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full">● Active Record</span>
      </div>
      <div class="flex justify-between items-baseline">
        <div id="vault-client-name" class="font-bold text-base text-ink">--</div>
        <div id="vault-client-id" class="text-[10px] text-muted font-bold">ID: #VAULT</div>
      </div>
      <div class="text-xs text-muted flex flex-col gap-1 mt-1">
        <div>📍 <span id="vault-client-address" class="text-ink font-medium">--</span></div>
        <div>📞 <span id="vault-client-phone" class="text-ink font-medium">--</span></div>
      </div>
    </div>

    <!-- IN-DRAWER QUICK CONTROLS -->
    <div class="flex gap-2">
      <button onclick="toggleVoiceIntake()" class="flex-1 py-2 bg-forest hover:bg-opacity-90 text-white font-bold text-xs rounded-xl shadow transition flex items-center justify-center gap-2">
        <span>🎙️</span> <span>Add Voice Note</span>
      </button>
      <button onclick="triggerCamera()" class="flex-1 py-2 bg-ink hover:bg-black text-white font-bold text-xs rounded-xl transition flex items-center justify-center gap-1.5">
        <span>📷</span> <span>Attach Photo</span>
      </button>
    </div>

    <!-- ACTIVE SERVICE NOTE -->
    <div class="bg-white p-3.5 rounded-xl border border-bordercolor">
      <div class="text-xs font-bold text-ink mb-1 uppercase">Active Service / Brain Dump Note</div>
      <div id="active-card-note" class="text-xs text-muted leading-relaxed">--</div>
    </div>
  </div>

  <div class="border-t border-bordercolor pt-3 text-[10px] text-muted text-center">TappyThing Digital Coordinator • Cloud Backend</div>
</div>

<script>
  let vaultData = [];
  let isListening = false, recognition = null, archiveOpen = false;

  // 1. LOAD VAULT CSV ON STARTUP
  Papa.parse(encodeURI('export_export (34).csv'), {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      if (results && results.data && results.data.length > 0) {
        vaultData = results.data;
        console.log(`Vault loaded: ${vaultData.length} records ready!`);
        const status = document.getElementById('system-status');
        if (status) {
          status.innerText = `⚡ ${vaultData.length.toLocaleString()} Vault Records Ready`;
        }
      }
    },
    error: function(err) {
      console.log('CSV load note:', err);
    }
  });

  // 2. ENHANCED MULTI-COLUMN VAULT MATCHING
  function searchVault(clientName) {
    if (!vaultData || vaultData.length === 0 || !clientName || clientName === "Direct Intake" || clientName === "Subscriber Note") return null;
    const target = clientName.trim().toLowerCase();
    const targetParts = target.split(' ').filter(p => p.length > 2);

    return vaultData.find(row => {
      const fullName = (
        row['Name'] || row['Customer Name'] || row['Client Name'] || row['Full Name'] ||
        `${row['First Name'] || row['First name'] || ''} ${row['Last Name'] || row['Last name'] || ''}`
      ).trim().toLowerCase();

      if (!fullName || fullName.length < 3) return false;
      return fullName === target || target.includes(fullName) || fullName.includes(target) ||
        (targetParts.length >= 2 && targetParts.every(part => fullName.includes(part)));
    });
  }

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRec();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onstart = () => {
      isListening = true;
      document.getElementById('voice-label').innerText = "LISTENING...";
      document.getElementById('voice-btn').classList.add('bg-red-600');
    };
    recognition.onresult = (e) => {
      const text = e.results[0][0].transcript;
      document.getElementById('text-intake').value = text;
      handleVoiceIntake(text);
    };
    recognition.onerror = recognition.onend = () => {
      isListening = false;
      document.getElementById('voice-label').innerText = "TALK TO FRESH";
      document.getElementById('voice-btn').classList.remove('bg-red-600');
    };
  }

  function toggleVoiceIntake() {
    if (!recognition) return alert("Speech recognition not supported on this browser.");
    if (isListening) recognition.stop(); else recognition.start();
  }

  function triggerCamera() {
    document.getElementById('cameraInput').click();
  }

  function handleCameraSnap(event) {
    if (event.target.files && event.target.files[0]) {
      showStatus("📷 Photo captured! Tap microphone to describe note.");
      setTimeout(() => { toggleVoiceIntake(); }, 800);
    }
  }

  function checkSubmit(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const val = e.target.value.trim();
      if (val) { handleVoiceIntake(val); e.target.value = ''; }
    }
  }

  function toggleNetworking() {
    const btn = document.getElementById('net-toggle-btn');
    if (btn.innerText.includes('ON')) {
      btn.innerHTML = '<span class="w-2 h-2 rounded-full bg-gray-400 inline-block"></span><span>Networking: OFF</span>';
    } else {
      btn.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span><span>Networking: ON</span>';
    }
  }

  function showStatus(msg) {
    const b = document.getElementById('status-banner');
    b.innerText = msg;
    b.classList.remove('hidden');
    setTimeout(() => b.classList.add('hidden'), 4000);
  }

  function openWorkstation() {
    const d = document.getElementById('workstation-drawer');
    d.classList.remove('hidden-right-drawer');
    d.classList.add('open-right-drawer');
  }

  function closeWorkstation() {
    const d = document.getElementById('workstation-drawer');
    d.classList.remove('open-right-drawer');
    d.classList.add('hidden-right-drawer');
  }

  // 3. VOICE INTAKE + ROBUST CRM DATA EXTRACTION
  function handleVoiceIntake(text) {
    showStatus("⚡ FRESH: Sissy is organizing your note...");

    fetch('https://hook.us2.make.com/35w5mrnq8w30j1fda55rousdeya5o18f', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript: text, timestamp: new Date().toISOString() })
    })
    .then(res => res.json())
    .then(data => {
      if (!data) throw new Error("Empty response");

      const clientName = data.clientName || "Direct Intake";
      const match = searchVault(clientName);

      // MULTI-COLUMN ADDRESS EXTRACTION
      let finalAddress = "On File / In Vault";
      if (match) {
        const street = match['Address'] || match['Street'] || match['Street Address'] || match['Address 1'] || match['Billing Address'] || match['Service Address'] || match['Location'] || '';
        const city = match['City'] || '';
        const state = match['State'] || '';
        const zip = match['Zip'] || match['Postal Code'] || '';
        const combined = [street, city, state, zip].filter(Boolean).join(', ');
        finalAddress = combined || street || match['Full Address'] || "On File / In Vault";
      } else if (data.address && data.address !== "On File / In Vault") {
        finalAddress = data.address;
      }

      // MULTI-COLUMN PHONE EXTRACTION
      let finalPhone = "On File";
      if (match) {
        finalPhone = match['Phone'] || match['Phone Number'] || match['Mobile'] || match['Mobile Phone'] || match['Cell'] || match['Primary Phone'] || match['Phone 1'] || "On File";
      } else if (data.phone && data.phone !== "On File") {
        finalPhone = data.phone;
      }

      const store = getStorage();
      const card = {
        id: Date.now(),
        text: data.notes || text,
        clientName: clientName,
        address: finalAddress,
        phone: finalPhone,
        time: data.time || "Time Pending",
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      if (data.destination === 'calendar' || data.isScheduled) {
        store.scheduledCards.unshift(card);
        showStatus("⚡ Sissy scheduled appointment!");
      } else {
        store.pinballQueue.unshift(card);
        showStatus("⚡ Sissy queued note in Pinball!");
      }

      saveStorage(store);
      render();
    })
    .catch(err => {
      console.log("Sissy cloud offline:", err);
      const store = getStorage();
      store.pinballQueue.unshift({
        id: Date.now(),
        text: text,
        clientName: "Note Pending Sync",
        address: "Awaiting Sissy",
        phone: "Awaiting Sissy",
        time: "Pending",
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      saveStorage(store);
      render();
      showStatus("⚡ Note saved to Pinball (awaiting Sissy)");
    });
  }

  function openCustomerCard(text, clientName, address, phone) {
    document.getElementById('drawer-title').innerText = clientName + ' — Workstation';
    document.getElementById('vault-client-name').innerText = clientName;
    document.getElementById('vault-client-address').innerText = address && address !== 'undefined' ? address : "On File / In Vault";
    document.getElementById('vault-client-phone').innerText = phone && phone !== 'undefined' ? phone : "On File";
    document.getElementById('active-card-note').innerText = `"${text}"`;
    openWorkstation();
  }

  function completeItem(type, id) {
    const store = getStorage();
    let item = null;
    if (type === 'calendar') {
      item = store.scheduledCards.find(i => i.id === id);
      store.scheduledCards = store.scheduledCards.filter(i => i.id !== id);
    } else {
      item = store.pinballQueue.find(i => i.id === id);
      store.pinballQueue = store.pinballQueue.filter(i => i.id !== id);
    }
    if (item) {
      store.archive.unshift(item);
      saveStorage(store);
      render();
    }
  }

  function toggleArchiveView() {
    archiveOpen = !archiveOpen;
    document.getElementById('archive-container').classList.toggle('hidden', !archiveOpen);
    document.getElementById('archive-chevron').innerText = archiveOpen ? '▲' : '▼';
  }

  function getStorage() {
    const d = localStorage.getItem('tappything_lexus_v3');
    return d ? JSON.parse(d) : { scheduledCards: [], pinballQueue: [], archive: [] };
  }

  function saveStorage(d) { localStorage.setItem('tappything_lexus_v3', JSON.stringify(d)); }

  function render() {
    const store = getStorage();
    const cal = document.getElementById('schedule-list');
    cal.innerHTML = store.scheduledCards.length === 0 ? '<div class="text-muted text-xs italic">No scheduled appointments.</div>' :
      store.scheduledCards.map(item => `
        <div class="bg-white border-l-4 border-blue-600 border border-bordercolor rounded-xl p-3 flex flex-col justify-between shadow-sm">
          <div class="flex justify-between items-start">
            <div>
              <div class="font-bold text-ink text-xs">${item.clientName}</div>
              <p class="text-[11px] text-muted italic">"${item.text}"</p>
              <div class="text-[10px] text-muted mt-0.5">Scheduled • ${item.time || item.timestamp}</div>
            </div>
            <div class="flex gap-1.5">
              <button onclick="openCustomerCard('${item.text.replace(/'/g, "\\'")}', '${item.clientName}', '${item.address}', '${item.phone}')" class="px-2.5 py-1 bg-parchment border border-bordercolor rounded-lg text-xs font-bold hover:bg-bordercolor transition">Open Card ➔</button>
              <button onclick="completeItem('calendar', ${item.id})" class="px-2.5 py-1 bg-forest text-white rounded-lg text-xs font-bold transition">Done ✓</button>
            </div>
          </div>
        </div>
      `).join('');

    const pin = document.getElementById('pinball-list');
    pin.innerHTML = store.pinballQueue.length === 0 ? '<div class="text-muted text-xs italic">Queue clean.</div>' :
      store.pinballQueue.map(item => `
        <div class="bg-white border-l-4 border-gold border border-bordercolor rounded-xl p-3 flex flex-col justify-between shadow-sm">
          <div class="flex justify-between items-start">
            <div>
              <div class="font-bold text-ink text-xs">${item.clientName}</div>
              <p class="text-[11px] text-muted italic">"${item.text}"</p>
              <div class="text-[10px] text-muted mt-0.5">Queued • ${item.timestamp}</div>
            </div>
            <div class="flex gap-1.5">
              <button onclick="openCustomerCard('${item.text.replace(/'/g, "\\'")}', '${item.clientName}', '${item.address}', '${item.phone}')" class="px-2.5 py-1 bg-parchment border border-bordercolor rounded-lg text-xs font-bold hover:bg-bordercolor transition">Open Card ➔</button>
              <button onclick="completeItem('pinball', ${item.id})" class="px-2.5 py-1 bg-forest text-white rounded-lg text-xs font-bold transition">Done ✓</button>
            </div>
          </div>
        </div>
      `).join('');

    const arch = document.getElementById('archive-list');
    document.getElementById('archive-count-label').innerText = `View Archive (${store.archive.length})`;
    arch.innerHTML = store.archive.length === 0 ? '<div class="text-muted text-xs italic">Archive empty.</div>' :
      store.archive.slice(0, 10).map(i => `<div class="line-through text-xs text-muted">✓ ${i.clientName} — "${i.text}"</div>`).join('');
  }

  render();
</script>
</body>
</html>
