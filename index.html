<script>
  let vaultData = [];
  let catalogData = [];
  let scheduledCards = JSON.parse(localStorage.getItem('tappy_scheduled_cards') || '[]'); 
  let activeTasks = JSON.parse(localStorage.getItem('tappy_active_tasks') || '[]');
  let isListening = false, recognition = null, lastPhrase = '';
  let currentInvoiceItems = [];
  let currentActivePhone = '';
  let isGlobalNetworkingOn = true;

  window.onload = function() {
    setupSpeech();
    renderScheduledCards();

    // Auto-load background CSVs if present in root
    fetch('export_export (34).csv').then(r => r.text()).then(t => parseVaultCSVText(t)).catch(e => console.log('Vault auto-load ready'));
    fetch('export_export (35).csv').then(r => r.text()).then(t => parseCatalogCSVText(t)).catch(e => console.log('Catalog auto-load ready'));
  };

  function showConfirmation(msg) {
    const bar = document.getElementById('freshConfirmationBar');
    bar.innerText = `⚡ FRESH: ${msg}`;
    bar.classList.remove('hidden');
    setTimeout(() => bar.classList.add('hidden'), 4000);
  }

  // --- MANUAL CSV UPLOAD HANDLERS ---
  function loadVaultCSV(input) {
    if (!input.files || !input.files[0]) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      parseVaultCSVText(e.target.result);
      showConfirmation(`Loaded ${vaultData.length} records into Vault`);
    };
    reader.readAsText(input.files[0]);
  }

  function loadCatalogCSV(input) {
    if (!input.files || !input.files[0]) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      parseCatalogCSVText(e.target.result);
      showConfirmation(`Loaded ${catalogData.length} catalog items`);
    };
    reader.readAsText(input.files[0]);
  }

  function setupSpeech() {
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRec();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const phrase = event.results[0][0].transcript.trim();
        if (phrase && phrase !== lastPhrase) {
          lastPhrase = phrase;
          handleVoiceIntake(phrase);
        }
      };

      recognition.onerror = () => {
        isListening = false;
        document.getElementById('micText').innerText = 'TALK TO FRESH';
        document.getElementById('micIcon').innerText = '🎙️';
        document.getElementById('masterMicBtn').classList.remove('pulse-record');
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('micText').innerText = 'TALK TO FRESH';
        document.getElementById('micIcon').innerText = '🎙️';
        document.getElementById('masterMicBtn').classList.remove('pulse-record');
      };
    }
  }

  function toggleVoiceIntake() {
    if (!recognition) return alert('Speech recognition supported in Chrome/Edge.');
    if (isListening) {
      recognition.stop();
    } else {
      recognition.start();
      isListening = true;
      document.getElementById('micText').innerText = 'LISTENING...';
      document.getElementById('micIcon').innerText = '⚡';
      document.getElementById('masterMicBtn').classList.add('pulse-record');
    }
  }

  function handleSearchSubmit() {
    const input = document.getElementById('textSearchInput');
    const val = input.value.trim();
    if (!val) return;
    handleVoiceIntake(val);
    input.value = '';
  }

  function toggleGlobalNetworking() {
    isGlobalNetworkingOn = !isGlobalNetworkingOn;
    const label = document.getElementById('networkingStatusLabel');
    const dot = document.getElementById('networkingStatusDot');
    label.innerText = isGlobalNetworkingOn ? "🌐 Forever Networking: ON" : "🌐 Forever Networking: OFF";
    dot.className = isGlobalNetworkingOn ? "w-2 h-2 rounded-full bg-emerald-600 inline-block animate-ping" : "w-2 h-2 rounded-full bg-stone-400 inline-block";
  }

  function switchRoom(roomNum) {
    for (let i = 1; i <= 3; i++) {
      const content = document.getElementById('room' + i + 'Content');
      const tab = document.getElementById('tabRoom' + i);
      if (i === roomNum) {
        content.classList.remove('hidden');
        tab.className = "p-2.5 rounded-xl font-bold text-xs shadow transition room-tab-active";
      } else {
        content.classList.add('hidden');
        tab.className = "p-2.5 rounded-xl font-bold text-xs shadow transition room-tab-inactive";
      }
    }
  }

  function renderScheduledCards() {
    const slot = document.getElementById('scheduledItemsSlot');
    if (!scheduledCards || scheduledCards.length === 0) {
      slot.innerHTML = '<p class="text-xs text-stone-400 italic p-4 text-center">Schedule Hopper Ready • Intake jobs by voice or type to schedule</p>';
      return;
    }

    slot.innerHTML = '';
    scheduledCards.forEach((card, idx) => {
      const safeName = (card.name || 'Task').replace(/'/g, "\\'");
      const safeAddress = (card.address || '').replace(/'/g, "\\'");
      const safePhone = (card.phone || '').replace(/'/g, "\\'");
      const safeAmount = card.ticketAmount || 0;

      slot.innerHTML += `
        <div onclick="openWorkstation('${safeName}', '${safeAddress}', '${safePhone}', ${safeAmount})" 
             class="cursor-pointer p-3 bg-white rounded-xl border border-stone-200 shadow-sm hover:border-emerald-700 hover:shadow-md transition flex items-center justify-between">
          <div class="space-y-0.5">
            <div class="flex items-center gap-2">
              <span class="font-bold text-emerald-800 text-xs font-mono">${card.time}</span>
              <span class="text-[10px] font-extrabold text-stone-400 font-mono">#${card.id}</span>
            </div>
            <h3 class="font-bold text-stone-900 text-xs">${card.name}</h3>
            <p class="text-[11px] text-stone-500">${card.address}</p>
          </div>
          <div class="flex items-center gap-1.5" onclick="event.stopPropagation()">
            <button onclick="removeScheduledCard(${idx})" class="text-stone-300 hover:text-red-500 text-xs p-1" title="Clear Card">✕</button>
            <button onclick="openWorkstation('${safeName}', '${safeAddress}', '${safePhone}', ${safeAmount})" class="text-[10px] bg-emerald-50 text-emerald-800 font-bold px-2 py-0.5 rounded border border-emerald-200 hover:bg-emerald-100">Open ➔</button>
          </div>
        </div>
      `;
    });
  }

  function removeScheduledCard(idx) {
    scheduledCards.splice(idx, 1);
    localStorage.setItem('tappy_scheduled_cards', JSON.stringify(scheduledCards));
    renderScheduledCards();
    showConfirmation("Card cleared from schedule");
  }

  function pushToScheduleDirect(id, name, address, phone, timeStr) {
    scheduledCards.unshift({
      id: id || "VAULT",
      name: name,
      time: timeStr,
      address: address || "1965 Greenspring Dr, Timonium",
      phone: phone || "(410) 499-1313",
      ticketAmount: 0,
      networkingStatus: true
    });
    localStorage.setItem('tappy_scheduled_cards', JSON.stringify(scheduledCards));
    renderScheduledCards();
    showConfirmation(`Scheduled for ${timeStr}`);
  }

  function parseVaultCSVText(text) {
    Papa.parse(text, { header: true, skipEmptyLines: true, complete: r => { vaultData = r.data; } });
  }

  function parseCatalogCSVText(text) {
    Papa.parse(text, {
      header: true,
      skipEmptyLines: true,
      complete: function(r) {
        catalogData = r.data;
        const select = document.getElementById('partSelect');
        select.innerHTML = '<option value="">Select catalog part or service...</option>';
        catalogData.forEach(item => {
          const name = item['Name'] || item['Item / Service'] || '';
          const price = parseFloat(item['Price'] || 0).toFixed(2);
          const cost = parseFloat(item['Cost'] || 0).toFixed(2);
          if (name) select.innerHTML += `<option value="${price}|${cost}|${name}">${name} — ${price}</option>`;
        });
      }
    });
  }

  function handleVoiceIntake(text) {
    const emptyState = document.getElementById('pinballEmptyState');
    if (emptyState) emptyState.remove();

    const query = text.toLowerCase().trim();
    
    // Accurate time regex (requires am/pm, colon, or explicit 'at X')
    const timeMatch = text.match(/(?:at\s+)?(\d{1,2}(?::\d{2})?\s*(?:am|pm)|\d{1,2}:\d{2})/i);
    const extractedTime = timeMatch ? `Today — ${timeMatch[0].replace(/^at\s+/i, '').toUpperCase()}` : null;

    const errandKeywords = ['milk', 'gas', 'grocery', 'pick up', 'errand', 'buy', "bj's", 'bjs', 'store', 'hardware', 'supplies'];
    const isErrand = errandKeywords.some(kw => query.includes(kw));

    const matches = vaultData.filter(client => {
      const name = (client['Name'] || '').toLowerCase();
      return name && (name.includes(query) || query.includes(name) || (query.includes('william') && name.includes('william sullivan')));
    });

    if (extractedTime) {
      if (matches.length > 0) {
        const client = matches[0];
        pushToScheduleDirect(client['Client #'], client['Name'], client['Address'], client['Phone'], extractedTime);
      } else {
        pushToScheduleDirect("TASK", text, "1965 Greenspring Dr, Timonium", "(410) 499-1313", extractedTime);
      }
    } else if (isErrand) {
      const taskId = 'TASK-' + Math.floor(1000 + Math.random() * 9000);
      activeTasks.push({ id: taskId, text: text, done: false });
      localStorage.setItem('tappy_active_tasks', JSON.stringify(activeTasks));
      renderErrandPinballCard(taskId, text);
      showConfirmation("🛒 Errand logged to Pinball");
    } else {
      if (matches.length > 0) {
        matches.slice(0, 3).forEach(client => renderMatchedCard(client, text));
      } else {
        renderRawIntakeCard(text);
      }
      showConfirmation("Intake queued to Pinball");
    }

    // Background relay to Make.com / Sissy webhook
    fetch('https://hook.us2.make.com/g6aw7r8759ar5jr5c7ln', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript: text, assignedTo: "Sissy (Norby)", timestamp: new Date().toISOString() })
    }).catch(err => console.log('Pipe fired'));
  }

  function renderErrandPinballCard(taskId, text) {
    const queue = document.getElementById('pinballQueue');
    const cardHTML = `
      <div onclick="openWorkstation('William Sullivan', '1965 Greenspring Dr, Timonium', '4104991313', 0)" class="cursor-pointer p-3.5 bg-white rounded-xl border-l-4 border-amber-500 shadow-sm hover:shadow-md transition flex items-center justify-between">
        <div class="space-y-0.5">
          <span class="text-[10px] font-extrabold text-amber-700 uppercase tracking-wide">🛒 Shared Errand / Task (#${taskId})</span>
          <h3 class="font-bold text-stone-900 text-xs">"${text}"</h3>
          <p class="text-[11px] text-stone-500">Assigned: William Sullivan (Shop/Home)</p>
        </div>
        <span class="text-xs font-bold text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200">Open Card ➔</span>
      </div>
    `;
    queue.insertAdjacentHTML('afterbegin', cardHTML);
  }

  function renderMatchedCard(client, originalSpeech) {
    const queue = document.getElementById('pinballQueue');
    const cleanPhone = (client['Phone'] || '').replace(/\D/g, '');
    const name = client['Name'] || 'Client';
    const address = client['Address'] || 'Address Not Listed';
    const clientId = client['Client #'] || 'VAULT';

    const cardHTML = `
      <div onclick="openWorkstation('${name}', '${address}', '${cleanPhone}', 0)" class="cursor-pointer p-3.5 bg-white rounded-xl border-l-4 border-emerald-600 shadow-sm hover:shadow-md transition flex items-center justify-between">
        <div class="space-y-0.5">
          <span class="text-[10px] font-extrabold text-emerald-700 uppercase tracking-wide">Vault Match (#${clientId})</span>
          <h3 class="font-bold text-stone-900 text-xs">${name}</h3>
          <p class="text-[11px] text-stone-600">${address} • ${client['Phone'] || ''}</p>
          <p class="text-[10px] text-amber-700 font-medium">💬 "${originalSpeech}"</p>
        </div>
        <button onclick="event.stopPropagation(); pushToScheduleDirect('${clientId}', '${name}', '${address}', '${cleanPhone}', 'Today — Scheduled')" class="text-xs font-bold text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200 hover:bg-emerald-100">📅 Schedule ➔</button>
      </div>
    `;
    queue.insertAdjacentHTML('afterbegin', cardHTML);
  }

  function renderRawIntakeCard(text) {
    const queue = document.getElementById('pinballQueue');
    const cardHTML = `
      <div onclick="openWorkstation('${text}', 'Live Intake Record', '(410) 499-1313', 0)" class="cursor-pointer p-3.5 bg-white rounded-xl border-l-4 border-blue-600 shadow-sm hover:shadow-md transition flex items-center justify-between">
        <div>
          <span class="text-[10px] font-extrabold text-blue-700 uppercase tracking-wide">Live Intake Card</span>
          <h3 class="font-bold text-stone-900 text-xs">"${text}"</h3>
          <p class="text-[11px] text-stone-500">Queued for Triage</p>
        </div>
        <span class="text-xs font-bold text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200">Open Card ➔</span>
      </div>
    `;
    queue.insertAdjacentHTML('afterbegin', cardHTML);
  }

  function openWorkstation(name, details, phone, amount) {
    currentActivePhone = phone;
    document.getElementById('drawerCallBtn').href = 'tel:' + phone.replace(/\D/g, '');
    document.getElementById('drawerTextBtn').href = 'sms:' + phone.replace(/\D/g, '');
    document.getElementById('cardClientName').innerText = name + ' — Forever Card';
    document.getElementById('cardClientDetails').innerText = details + ' • ' + phone;
    document.getElementById('mirrorClient').innerText = name + ' Mobile Card';

    const isPersonalOrErrand = name.toLowerCase().includes('william') || name.toLowerCase().includes('pickleball') || details.toLowerCase().includes('intake');

    if (isPersonalOrErrand) {
      document.getElementById('roomTabsBar').classList.add('hidden');
      document.getElementById('customerProgressionBox').classList.add('hidden');
      document.getElementById('equipmentDiagBox').classList.add('hidden');
    } else {
      document.getElementById('roomTabsBar').classList.remove('hidden');
      document.getElementById('customerProgressionBox').classList.remove('hidden');
      document.getElementById('equipmentDiagBox').classList.remove('hidden');
    }
    
    currentInvoiceItems = amount > 0 ? [{ name: "Approved Initial Service", cost: amount * 0.2, retail: amount }] : [];
    renderInvoice();
    renderDrawerTasks();

    switchRoom(1);
    document.getElementById('drawerOverlay').classList.remove('hidden');
    document.getElementById('workstationDrawer').classList.remove('translate-x-full');
  }

  function closeWorkstation() {
    document.getElementById('drawerOverlay').classList.add('hidden');
    document.getElementById('workstationDrawer').classList.add('translate-x-full');
  }

  function renderDrawerTasks() {
    const container = document.getElementById('drawerTasksContainer');
    const badge = document.getElementById('taskCountBadge');
    if (activeTasks.length === 0) {
      container.innerHTML = '<p class="text-stone-400 italic">No open errands for this card.</p>';
      badge.innerText = '0 Pending';
      return;
    }

    const pending = activeTasks.filter(t => !t.done).length;
    badge.innerText = `${pending} Pending`;
    container.innerHTML = '';
    activeTasks.forEach((t, idx) => {
      container.innerHTML += `
        <div class="flex items-center justify-between p-2 rounded-lg bg-stone-50 border border-stone-200">
          <label class="flex items-center gap-2 cursor-pointer ${t.done ? 'line-through text-stone-400' : 'text-stone-900 font-medium'}">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTaskDone(${idx})" class="rounded text-emerald-700">
            <span>${t.text}</span>
          </label>
          <span class="text-[10px] font-mono text-stone-400">#${t.id}</span>
        </div>
      `;
    });
  }

  function toggleTaskDone(idx) {
    activeTasks[idx].done = !activeTasks[idx].done;
    localStorage.setItem('tappy_active_tasks', JSON.stringify(activeTasks));
    renderDrawerTasks();
  }

  function setStage(stageNum) {
    for (let i = 1; i <= 4; i++) {
      document.getElementById('stage' + i).className = (i === stageNum) ? 
        'p-2 rounded-lg text-xs font-bold bg-emerald-800 text-white' : 
        'p-2 rounded-lg text-xs font-bold bg-stone-100 text-stone-600';
    }
    if (stageNum === 4) confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });
  }

  function addInvoiceItem() {
    const select = document.getElementById('partSelect');
    if (!select.value) return showConfirmation('Select a catalog item first!');
    const [retail, cost, name] = select.value.split('|');
    currentInvoiceItems.push({ name, cost: parseFloat(cost), retail: parseFloat(retail) });
    renderInvoice();
  }

  function renderInvoice() {
    const tbody = document.getElementById('invoiceTableBody');
    tbody.innerHTML = '';
    let totalRetail = 0, totalCost = 0;

    currentInvoiceItems.forEach((item) => {
      totalRetail += item.retail;
      totalCost += item.cost;
      const margin = item.retail > 0 ? (((item.retail - item.cost) / item.retail) * 100).toFixed(1) : '0.0';
      tbody.innerHTML += `
        <tr>
          <td class="p-2 text-stone-900">${item.name}</td>
          <td class="p-2 text-stone-500 font-mono">${item.cost.toFixed(2)}</td>
          <td class="p-2 text-stone-900 font-bold font-mono">${item.retail.toFixed(2)}</td>
          <td class="p-2 text-right text-emerald-700 font-bold font-mono">${margin}%</td>
        </tr>
      `;
    });

    const profit = totalRetail - totalCost;
    document.getElementById('profitSummary').innerText = `${totalRetail.toFixed(2)} (${profit.toFixed(2)} Net Profit)`;
    document.getElementById('mirrorTotal').innerText = `${totalRetail.toFixed(2)}`;
  }

  function dispatchStripePay() {
    const total = document.getElementById('mirrorTotal').innerText;
    showConfirmation(`Stripe Pay Link for ${total} dispatched to ${currentActivePhone}`);
  }
</script>
