<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tappything - Aerus Portal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1A1A1A;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-left { font-weight: bold; font-size: 1.2rem; color: #4CAF50; }
        .logo-right { font-weight: bold; font-size: 1rem; opacity: 0.8; }
        .container {
            background: #2A2A2A;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
            box-sizing: border-box;
        }
        h2 { margin-top: 0; color: #4CAF50; text-align: center; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #333;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 20px;
        }
        textarea:focus { outline: none; border-color: #4CAF50; }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: #45a049; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-left">Tappything</div>
        <div class="logo-right">Aerus Portal</div>
    </div>
    <div class="container">
        <h2>Digital Butler Intake</h2>
        <form action="https://hook.us2.make.com/YOUR_WEBHOOK_URL_HERE" method="POST">
            <label for="transcript">Intake Details / Voice Note</label>
            <textarea 
                id="transcript" 
                name="transcript" 
                rows="4" 
                placeholder="e.g. Jack Smith - Beyond Air - Needs filter, bulb, cell repair..."
                required></textarea>

            <button type="submit" class="btn-submit">
                Send to Digital Butler 🚀
            </button>
        </form>
    </div>
</body>
</html>
