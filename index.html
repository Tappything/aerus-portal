<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TappyThing ⚡ Chat with Fresh</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1e1035 0%, #0c0714 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      height: 92vh;
      gap: 12px;
    }
    .header-box {
      text-align: center;
      padding: 4px 0;
    }
    .brand-title {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fbbf24 0%, #f472b6 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-top: 2px;
    }
    .chat-box {
      flex: 1;
      background: rgba(30, 16, 53, 0.95);
      border: 1.5px solid rgba(251, 191, 36, 0.35);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .bubble {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .bubble.fresh {
      align-self: flex-start;
      background: #2d184c;
      color: #f8fafc;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(192, 132, 252, 0.3);
    }
    .bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0f172a;
      font-weight: 600;
      border-bottom-right-radius: 4px;
    }
    .ticket-card {
      background: #120924;
      border: 1.5px solid #22c55e;
      border-radius: 14px;
      padding: 14px;
      margin-top: 8px;
      color: #fff;
    }
    .ticket-header {
      font-weight: 800;
      color: #22c55e;
      font-size: 0.95rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-area {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .text-input {
      flex: 1;
      background: #1e1035;
      border: 1.5px solid rgba(251, 191, 36, 0.4);
      border-radius: 25px;
      padding: 12px 18px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
    }
    .text-input:focus {
      border-color: #fbbf24;
    }
    .btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-mic {
      background: #784bd1;
      color: #fff;
    }
    .btn-mic.recording {
      background: #ef4444;
      animation: pulse 1s infinite alternate;
    }
    .btn-send {
      background: #fbbf24;
      color: #1e1035;
      font-weight: bold;
    }
    @keyframes pulse {
      from { box-shadow: 0 0 0px #ef4444; }
      to { box-shadow: 0 0 15px #ef4444; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-box">
      <div class="brand-title">TappyThing ⚡</div>
      <div class="tagline">Voice & Text Coordinator for Bagden / Aerus</div>
    </div>

    <div class="chat-box" id="chat-box">
      <div class="bubble fresh">
        Hey Mike! 👋 I'm <strong>Fresh</strong>, your shop coordinator. Tap the mic or type any repair, parts order, or customer invoice below!
      </div>
    </div>

    <div class="input-area">
      <button class="btn btn-mic" id="mic-btn" onclick="toggleVoice()" title="Tap to talk">🎤</button>
      <input type="text" class="text-input" id="text-input" placeholder="Speak or type a repair..." onkeydown="handleKey(event)" />
      <button class="btn btn-send" id="send-btn" onclick="handleSend()">➤</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const textInput = document.getElementById("text-input");
    const micBtn = document.getElementById("mic-btn");
    let isRecording = false;
    let recognition = null;
    const synth = window.speechSynthesis;

    // Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add("recording");
      };
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        textInput.value = transcript;
        handleSend();
      };
      recognition.onerror = () => stopRecording();
      recognition.onend = () => stopRecording();
    }

    function toggleVoice() {
      if (!recognition) {
        alert("Voice mic requires Safari or Chrome on iOS/Android. Please check browser permissions.");
        return;
      }
      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function stopRecording() {
      isRecording = false;
      micBtn.classList.remove("recording");
    }

    function handleKey(e) {
      if (e.key === "Enter") handleSend();
    }

    function addBubble(sender, htmlContent) {
      const b = document.createElement("div");
      b.className = `bubble ${sender}`;
      b.innerHTML = htmlContent;
      chatBox.appendChild(b);
      chatBox.scrollTop = chatBox.scrollHeight;
      return b;
    }

    function speak(text) {
      if (!synth) return;
      synth.cancel();
      const clean = text.replace(/<[^>]*>/g, "");
      const utter = new SpeechSynthesisUtterance(clean);
      utter.rate = 1.05;
      synth.speak(utter);
    }

    function handleSend() {
      const msg = textInput.value.trim();
      if (!msg) return;

      addBubble("user", msg);
      textInput.value = "";

      // Process input instantly without server lag or network failure
      setTimeout(() => {
        processFreshLogic(msg);
      }, 300);
    }

    function processFreshLogic(input) {
      const lower = input.toLowerCase();
      let replyHtml = "";
      let speechText = "";

      if (lower.includes("vacuum") || lower.includes("sales") || lower.includes("service") || lower.includes("repair") || lower.includes("dyson") || lower.includes("sebo") || lower.includes("riccar") || lower.includes("aerus") || lower.includes("tune")) {
        
        replyHtml = `
          Got it locked in! 🛠️ Here is your live service & invoice ticket:
          <div class="ticket-card">
            <div class="ticket-header">✅ INVOICE / TICKET CREATED</div>
            <div><strong>Shop:</strong> Bagden Vacuums / Aerus</div>
            <div><strong>Job:</strong> ${escapeHtml(input)}</div>
            <div><strong>Stage:</strong> Workbench & Ready Wall</div>
            <div><strong>Billing:</strong> 3-Day Test Drive Active ($95/mo protected by 30-day guarantee)</div>
          </div>
          <div style="margin-top:8px; font-size:0.85rem; color:#cbd5e1;">Tap mic to log another repair or customer pickup!</div>
        `;
        speechText = "Got it! Service ticket created and logged to your ready wall.";

      } else {
        replyHtml = `
          Got it! 👍 I logged: <em>"${escapeHtml(input)}"</em> into your Bagden system queue. What else do you want to add?
        `;
        speechText = "Logged to your system queue. What else do you want to add?";
      }

      addBubble("fresh", replyHtml);
      speak(speechText);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>.
