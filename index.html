<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TappyThing — Master Operations Hub</title>
  <script src="config.js"></script>
  <style>
    :root { --primary: #0066cc; --bg: #f4f6f8; --card: #ffffff; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 16px; color: #333; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .btn { background: var(--primary); color: white; border: none; padding: 12px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    .ticket-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
  </style>
</head>
<body>

  <div class="header">
    <h1 id="shopTitle">Master Hub</h1>
    <a href="card.html?id=new" class="btn">+ New Intake / Walk-In</a>
  </div>

  <!-- Voice Coordinator & Search -->
  <div class="card">
    <h3>🔍 Voice Coordinator & Vault Search</h3>
    <input type="text" id="searchInput" placeholder="Search by name or phone (e.g. Ruth Tucker or 4102566949)..." oninput="searchVault()">
    <div id="searchResults"></div>
  </div>

  <!-- Active Pipeline & Proposals Hub -->
  <div class="card">
    <h3>📊 Active Pipeline & Proposals</h3>
    <div id="pipelineContainer">
      <p style="color: #888;">Scanning active cards...</p>
    </div>
  </div>

  <script>
    window.onload = function() {
      document.getElementById('shopTitle').innerText = `${TENANT_CONFIG.shopName} Hub`;
      loadPipeline();
    };

    function searchVault() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const resultsDiv = document.getElementById('searchResults');
      resultsDiv.innerHTML = '';

      if (query.length < 3) return;

      // Simulated lookup against customer database (e.g. Ruth Tucker)
      if ("ruth tucker".includes(query) || "4102566949".includes(query)) {
        resultsDiv.innerHTML = `
          <div class="ticket-row">
            <div>
              <strong>Ruth Tucker</strong><br>
              <small>6 Lagan Ct Nottingham, MD | 410-256-6949</small>
            </div>
            <a href="card.html?id=22086&name=Ruth%20Tucker&phone=4102566949&address=6%20Lagan%20Ct%20Nottingham,%20Maryland%2021236" class="btn" style="padding:6px 12px;">Open Card ➔</a>
          </div>
        `;
      }
    }

    function loadPipeline() {
      const container = document.getElementById('pipelineContainer');
      container.innerHTML = '';
      let count = 0;

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('card_')) {
          count++;
          const data = JSON.parse(localStorage.getItem(key));
          const row = document.createElement('div');
          row.className = 'ticket-row';
          row.innerHTML = `
            <div>
              <strong>${data.customerName || 'Customer'}</strong> (${data.docType})<br>
              <small>Stage: ${data.stage} | Total: ${data.total}</small>
            </div>
            <a href="${data.cardUrl}" class="btn" style="padding:6px 12px; background:#28a745;">Open Card ➔</a>
          `;
          container.appendChild(row);
        }
      }

      if (count === 0) {
        container.innerHTML = '<p style="color: #888;">No active pipeline tickets found in localStorage.</p>';
      }
    }
  </script>
</body>
</html>
