<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TappyThing — Master Command Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #05070e; color: #f3f4f6; }
    .card-face { background: linear-gradient(180deg, #0f172a 0%, #090d16 100%); border: 2px solid #1e293b; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 pb-20">

  <div class="max-w-md w-full card-face rounded-3xl p-6 relative space-y-6 shadow-2xl my-auto text-center">
    
    <!-- HEADER -->
    <div class="space-y-1">
      <h1 class="text-2xl font-black text-blue-400 tracking-tight flex items-center justify-center gap-2">
        <i class="fa-solid fa-bolt"></i> TappyThing Hub
      </h1>
      <p class="text-xs text-gray-400">Search 23,000+ Vault Records or Open Working Cards</p>
    </div>

    <!-- HERO SEARCH BOX -->
    <div class="space-y-2 text-left">
      <label class="text-xs font-bold text-gray-300 uppercase tracking-wider block">Customer Vault Search</label>
      <div class="relative">
        <input 
          type="text" 
          id="vaultSearch" 
          oninput="handleVaultSearch(this.value)" 
          placeholder="Type or speak customer name or phone..." 
          class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 shadow-inner"
        />
        <i class="fa-solid fa-magnifying-glass absolute right-4 top-3.5 text-gray-500"></i>
      </div>
      <ul id="searchResults" class="space-y-1.5 max-h-48 overflow-y-auto pt-1"></ul>
    </div>

    <!-- ACTIVE CARDS & WORKING PROPOSALS SECTION -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 text-left space-y-3">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h3 class="text-xs font-black text-amber-400 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-folder-open"></i> Active Cards & Proposals
        </h3>
        <span id="activeCountBadge" class="text-[10px] bg-amber-950/80 text-amber-300 border border-amber-800/60 px-2 py-0.5 rounded-full font-bold">0 Open</span>
      </div>
      
      <div id="activeCardsList" class="space-y-2 text-xs">
        <!-- Auto-populated from local saved drafts -->
      </div>
    </div>

    <!-- FOOTER STATUS -->
    <div class="text-[11px] text-gray-500 flex items-center justify-center gap-2">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span>0ms Vault Engine Active — TappyThing 2026</span>
    </div>

  </div>

<script>
  let searchDebounce;

  function handleVaultSearch(query) {
    clearTimeout(searchDebounce);
    const resultsContainer = document.getElementById('searchResults');
    
    if (!query || query.trim().length < 2) {
      resultsContainer.innerHTML = '';
      return;
    }

    searchDebounce = setTimeout(async () => {
      try {
        const res = await fetch(`/.netlify/functions/lookup?type=customer&q=${encodeURIComponent(query)}`);
        const data = await res.json();
        renderSearchResults(data.customers || data.results || []);
      } catch (err) {
        // Direct local fallback testing
        renderSearchResults([
          { id: "13238553775", name: "Richard Smothers", phone: "410-376-9061", address: "1415 Kingsway Rd, Baltimore, MD" },
          { id: "20525", name: "Aranza Rodriguez", phone: "410-960-9980", address: "1408 Charmuth Rd, Timonium, MD" },
          { id: "1276", name: "Paul Schwab", phone: "410-555-0188", address: "Address on File" }
        ].filter(c => c.name.toLowerCase().includes(query.toLowerCase()) || c.phone.includes(query)));
      }
    }, 150);
  }

  function renderSearchResults(customers) {
    const resultsContainer = document.getElementById('searchResults');
    resultsContainer.innerHTML = '';

    if (customers.length === 0) {
      resultsContainer.innerHTML = '<li class="text-xs text-gray-500 italic py-1">No customer records found</li>';
      return;
    }

    customers.forEach(cust => {
      const li = document.createElement('li');
      li.className = 'flex items-center justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800 hover:border-blue-500 transition cursor-pointer';
      li.onclick = () => openCard(cust.id, cust.name, cust.phone, cust.address);
      li.innerHTML = `
        <div>
          <div class="font-bold text-white text-xs">${cust.name}</div>
          <div class="text-[10px] text-gray-400">${cust.phone || 'No phone'}</div>
        </div>
        <span class="text-xs text-blue-400 font-bold">Open Card ➔</span>
      `;
      resultsContainer.appendChild(li);
    });
  }

  function openCard(id, customer, phone, address) {
    window.location.href = `card.html?id=${encodeURIComponent(id || '')}&customer=${encodeURIComponent(customer || '')}&phone=${encodeURIComponent(phone || '')}&address=${encodeURIComponent(address || '')}`;
  }

  function renderActiveWorkingHub() {
    const container = document.getElementById('activeCardsList');
    const badge = document.getElementById('activeCountBadge');
    
    let keys = Object.keys(localStorage).filter(k => k.startsWith('tappy_draft_'));
    
    if (keys.length === 0) {
      container.innerHTML = '<div class="text-gray-500 italic text-[11px] py-2 text-center">No open working proposals. Search a customer above to start one!</div>';
      badge.textContent = '0 Open';
      return;
    }

    badge.textContent = `${keys.length} Open`;
    container.innerHTML = '';

    keys.forEach(k => {
      try {
        let data = JSON.parse(localStorage.getItem(k));
        let rawName = k.replace('tappy_draft_', '').replace(/_/g, ' ');
        container.innerHTML += `
          <div class="flex items-center justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800 hover:border-amber-500/50 transition">
            <div>
              <div class="font-bold text-white capitalize text-xs">${rawName}</div>
              <div class="text-[10px] text-gray-400 flex gap-2 mt-0.5">
                <span class="text-amber-400 font-bold">${data.docType || 'Draft'}</span>
                <span>•</span>
                <span class="text-emerald-400 font-mono font-bold">${data.total || '$0.00'}</span>
              </div>
            </div>
            <a href="card.html?customer=${encodeURIComponent(rawName)}" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1 rounded-lg transition">Open Card ➔</a>
          </div>
        `;
      } catch(e) {}
    });
  }

  window.addEventListener('DOMContentLoaded', renderActiveWorkingHub);
</script>
</body>
</html>
