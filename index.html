<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TappyThing — Brick 1: Invoice & Ticket Builder</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #131c2e;
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-green: #10b981;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --border-color: #23324d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 14px; }

    .brick-container { width: 100%; max-width: 440px; background: #0f172a; border-radius: 28px; border: 2px solid var(--border-color); padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }

    /* Top Brand Header */
    .header { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 10px 14px; border-radius: 20px; border: 1px solid var(--border-color); }
    .brand-info { display: flex; align-items: center; gap: 10px; }
    
    /* Green Bandana Logo Medallion */
    .logo-badge { width: 42px; height: 42px; border-radius: 50%; background: #020617; border: 2px solid var(--accent-green); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(16,185,129,0.3); }
    .brand-title { font-size: 1.05rem; font-weight: 900; letter-spacing: 0.5px; color: #fff; }
    .brand-sub { font-size: 0.65rem; color: var(--accent-green); font-weight: 800; letter-spacing: 1px; }
    .brick-badge { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); font-size: 0.65rem; font-weight: 800; padding: 4px 8px; border-radius: 12px; border: 1px solid var(--accent-green); }

    /* Customer Selector Card (100% Dynamic) */
    .customer-card { background: var(--card-bg); border-radius: 18px; padding: 14px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
    .cust-select { width: 100%; background: #090d16; border: 1px solid var(--border-color); color: #fff; padding: 8px 10px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; outline: none; }
    .cust-details { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 0.78rem; padding-top: 4px; border-top: 1px solid #1e293b; }
    .cust-meta { color: var(--text-sub); }
    .cust-meta-right { text-align: right; color: var(--accent-cyan); font-weight: 700; }

    /* 1-Tap Quick Buttons */
    .section-label { font-size: 0.7rem; font-weight: 800; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 1px; }
    .quick-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
    .quick-btn { background: #162238; border: 1px solid var(--border-color); color: #fff; padding: 10px 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.15s; }
    .quick-btn:active { background: #223455; transform: scale(0.98); }
    .btn-name { font-weight: 700; font-size: 0.85rem; }
    .btn-tax-tag { font-size: 0.65rem; color: var(--text-sub); display: block; }
    .btn-price { font-weight: 900; font-size: 0.9rem; color: var(--accent-cyan); }

    /* Itemized Lines List */
    .items-list { background: #080d1a; border-radius: 14px; padding: 10px; border: 1px solid var(--border-color); min-height: 60px; display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; }
    .item-row { display: flex; justify-content: space-between; align-items: center; color: #cbd5e1; padding: 2px 0; border-bottom: 1px solid #141f33; }
    .item-row:last-child { border-bottom: none; }
    .empty-notice { color: var(--text-sub); text-align: center; margin: auto; font-style: italic; }

    /* Math Totals Box */
    .math-box { background: var(--card-bg); border-radius: 16px; padding: 14px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; }
    .math-row { display: flex; justify-content: space-between; color: var(--text-sub); }
    .math-row.total { border-top: 1px solid var(--border-color); padding-top: 8px; margin-top: 2px; font-weight: 900; font-size: 1.05rem; color: #fff; }
    .total-val { color: var(--accent-green); }

    /* Action Buttons */
    .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .action-btn { padding: 12px; border-radius: 14px; border: none; font-weight: 800; font-size: 0.8rem; cursor: pointer; text-align: center; }
    .btn-sec { background: #23324d; color: #fff; }
    .btn-pri { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); color: #0a0f1d; font-weight: 900; }
  </style>
</head>
<body>

<div class="brick-container">
  <!-- Brand Header -->
  <div class="header">
    <div class="brand-info">
      <div class="logo-badge">
        <svg viewBox="0 0 100 100" style="width: 26px; height: 26px;">

  <div class="customer-card">

    </select>
    <div class="cust-details">
      <div>
        <div id="dispCustName" style="font-weight: 800; color: #fff;">Ruth Tucker</div>
        <div id="dispCustAddress" class="cust-meta">6 Lagan Ct, Nottingham, MD</div>
      </div>
      <div style="text-align: right;">
        <div id="dispCustPhone" class="cust-meta-right">(410) 256-6949</div>
        <div id="dispCustId" class="cust-meta">Ticket #22086</div>

    </div>
  </div>

  <!-- 1-Tap Option B Quick Catalog -->
  <div class="section-label">1-Tap Fast-Movers</div>
  <div class="quick-grid">
    <button class="quick-btn" onclick="addItem('Bench Labor & Tune-Up', 60.00, false)">
      <div>
        <span class="btn-name">+ Bench Labor & Tune-Up</span>
        <span class="btn-tax-tag">0% MD Tax (Tax Exempt)</span>
      </div>
      <span class="btn-price">$60.00</span>
    </button>
    <button class="quick-btn" onclick="addItem('C-Bags 24-Pack', 48.00, true)">
      <div>
        <span class="btn-name">+ C-Bags 24-Pack</span>
        <span class="btn-tax-tag">6% MD Sales Tax</span>
      </div>
      <span class="btn-price">$48.00</span>
    </button>
    <button class="quick-btn" onclick="addItem('Replacement Fan Assembly', 15.00, true)">
      <div>
        <span class="btn-name">+ Fan Assembly</span>
        <span class="btn-tax-tag">6% MD Sales Tax</span>
      </div>
      <span class="btn-price">$15.00</span>
    </button>
  </div>

  <!-- Itemized Ticket Lines -->
  <div class="section-label">Ticket Line Items</div>
  <div class="items-list" id="itemsContainer">
    <div class="empty-notice" id="emptyNotice">No items added yet. Tap buttons above.</div>
  </div>

  <!-- Live Maryland Tax Math Box -->
  <div class="math-box">
    <div class="math-row"><span>Labor Subtotal (Tax Exempt):</span><span id="lblLabor">$0.00</span></div>
    <div class="math-row"><span>Parts Subtotal:</span><span id="lblParts">$0.00</span></div>
    <div class="math-row"><span>MD Tax (6% Parts Only):</span><span id="lblTax">$0.00</span></div>
    <div class="math-row total"><span>Total Due:</span><span class="total-val" id="lblTotal">$0.00</span></div>
  </div>

  <!-- Action Controls -->
  <div class="actions-grid">
    <button class="action-btn btn-sec" onclick="clearTicket()">🗑️ Clear Lines</button>
    <button class="action-btn btn-pri" onclick="printInvoice()">🖨️ Print / Save PDF</button>
  </div>
</div>

<script>
  const VAULT = [
    { id: "22086", name: "Ruth Tucker", address: "6 Lagan Ct, Nottingham, MD", phone: "(410) 256-6949" },
    { id: "8448", name: "Sue Freeland", address: "8095 Sandpiper Circle, Nottingham, MD", phone: "(443) 629-4180" },
    { id: "22085", name: "Paul Schwab", address: "8515 Huntspring Dr, Lutherville, MD", phone: "(410) 294-6383" }
  ];

  let currentCustIndex = 0;
  let lines = [];

  function changeCustomer() {
    const sel = document.getElementById('custSelect');
    currentCustIndex = parseInt(sel.value) || 0;
    const cust = VAULT[currentCustIndex];

    document.getElementById('dispCustName').innerText = cust.name;
    document.getElementById('dispCustAddress').innerText = cust.address;
    document.getElementById('dispCustPhone').innerText = cust.phone;
    document.getElementById('dispCustId').innerText = 'Ticket #' + cust.id;
  }

  function addItem(desc, price, isTaxable) {
    lines.push({ desc, price, isTaxable });
    render();
  }

  function removeLine(idx) {
    lines.splice(idx, 1);
    render();
  }

  function clearTicket() {
    lines = [];
    render();
  }

  function render() {
    const container = document.getElementById('itemsContainer');
    if (lines.length === 0) {
      container.innerHTML = '<div class="empty-notice">No items added yet. Tap buttons above.</div>';
    } else {

        <div class="item-row">

          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-weight: 800; color: #00f2fe;">${item.price.toFixed(2)}</span>
            <button onclick="removeLine(${idx})" style="background: none; border: none; color: #ef4444; font-weight: bold; cursor: pointer;">✕</button>
          </div>
        </div>
      `).join('');
    }

    let partsSub = 0;
    let laborSub = 0;

    lines.forEach(l => {
      if (l.isTaxable) partsSub += l.price;
      else laborSub += l.price;
    });

    const tax = partsSub * 0.06;
    const total = partsSub + laborSub + tax;
