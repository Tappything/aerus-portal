<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TappyThing | Aerus Home Wellness</title>
  <style>
    /* Global Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a1a; /* Dark Charcoal */
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* Header Bar */
    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 0;
      margin-bottom: 30px;
    }
    .brand {
      color: #d4af37; /* Metallic Gold */
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 1px;
    }

    /* Digital Coordinator Icon Intake Trigger */
    .intake-container {
      text-align: center;
      margin-bottom: 40px;
    }
    .coordinator-icon {
      font-size: 4rem;
      margin-bottom: 10px;
      transition: transform 0.2s ease;
      cursor: pointer;
      background: none;
      border: none;
      color: inherit;
      line-height: 1;
      padding: 0;
    }
    .coordinator-icon:hover {
      transform: scale(1.05);
    }
    .intake-label {
      color: #d4af37;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      margin-bottom: 20px;
      display: block;
    }
    
    /* Intake Form Styling */
    .intake-form {
      display: none;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      flex-direction: column;
      gap: 12px;
    }
    .intake-form.active {
      display: flex;
    }
    .intake-input {
      background-color: #242424;
      border: 1px solid #d4af37;
      border-radius: 8px;
      padding: 12px 16px;
      color: #ffffff;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .intake-input:focus {
      outline: none;
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }
    .intake-input::placeholder {
      color: #888;
    }
    .intake-button-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .intake-button {
      padding: 10px 20px;
      border: 1px solid #d4af37;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      letter-spacing: 1px;
    }
    .intake-button.submit {
      background-color: #d4af37;
      color: #1a1a1a;
    }
    .intake-button.submit:hover {
      background-color: #e8c547;
    }
    .intake-button.cancel {
      background-color: transparent;
      color: #d4af37;
    }
    .intake-button.cancel:hover {
      background-color: rgba(212, 175, 55, 0.1);
      border-color: #ffffff;
    }
    .intake-status {
      color: #d4af37;
      font-size: 0.85rem;
      min-height: 1.2em;
      margin-top: 8px;
    }

    /* 4 Cards Grid Layout */
    .card-grid {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    /* Rounded Card Styling */
    .card {
      background-color: #242424;
      border: 1px solid #d4af37;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      max-height: 400px;
      overflow-y: auto;
    }
    .card:hover {
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
      border-color: #ffffff;
    }
    .card-title {
      color: #d4af37;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding-bottom: 8px;
    }
    .card-content {
      color: #e0e0e0;
      font-size: 0.95rem;
      line-height: 1.4;
      flex-grow: 1;
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* Status Sections Styling */
    .status-section {
      margin-bottom: 15px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }
    .status-section:last-child {
      border-bottom: none;
    }
    .status-label {
      color: #d4af37;
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .status-items {
      color: #e0e0e0;
      font-size: 0.85rem;
      line-height: 1.5;
      margin-left: 10px;
    }
    .status-item {
      padding: 4px 0;
    }
    .status-empty {
      color: #888;
      font-style: italic;
      font-size: 0.85rem;
      margin-left: 10px;
    }

    /* Responsive Mobile Stacking */
    @media (max-width: 768px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
      header {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
      .intake-form {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <img src='./Gemini_Generated_Image_u1q8jwu1q8jwu1q8.jpg' style='width: 150px; display: block; margin: 20px auto;'>

  <!-- Header -->
  <header>
    <div class="brand">TappyThing</div>
  </header>

  <!-- Digital Coordinator Icon Intake Trigger -->
  <div class="intake-container">
    <button type="button" class="coordinator-icon" id="coordinatorIcon" aria-label="Tap to speak">🎙️</button>
    <div class="intake-label">TAP TO SPEAK</div>
    
    <form class="intake-form" id="intakeForm">
      <input 
        type="text" 
        class="intake-input" 
        id="intakeInput" 
        placeholder="Speak or type your request for the Digital Coordinator..."
        autocomplete="off"
      />
      <div class="intake-button-group">
        <button type="submit" class="intake-button submit">Submit</button>
        <button type="button" class="intake-button cancel" id="cancelButton">Cancel</button>
      </div>
    </form>
    <div class="intake-status" id="intakeStatus" role="status" aria-live="polite"></div>
  </div>

  <!-- 4 Cards Side-by-Side Grid -->
  <div class="card-grid">
    
    <div class="card" onclick="fetchCardData('operations')">
      <div class="card-title">Operations</div>
      <div class="card-content" id="content-operations">Click to load active tasks & dispatch queue</div>
    </div>

    <div class="card" onclick="fetchCardData('myworld')">
      <div class="card-title">My World</div>
      <div class="card-content" id="content-myworld">Click to load dashboard & quick notes</div>
    </div>

    <div class="card" onclick="fetchCardData('personal')">
      <div class="card-title">Personal</div>
      <div class="card-content" id="content-personal">Click to load private tracking & schedule</div>
    </div>

    <div class="card" onclick="fetchCardData('referral')">
      <div class="card-title">Referral Engine</div>
      <div class="card-content" id="content-referral">Click to load leads, tracking & rewards</div>
    </div>

  </div>

  <!-- JavaScript Operations -->
  <script>
    // 0. Monday.com API token (do NOT commit real tokens publicly). Replace the placeholder in deployment or set window.MONDAY_API_TOKEN in the browser console.
    const MONDAY_API_TOKEN = (window.MONDAY_API_TOKEN || '<REDACTED - set your Monday.com API token here>');

    // 1. Intake Form Elements
    const coordinatorIcon = document.getElementById('coordinatorIcon');
    const intakeForm = document.getElementById('intakeForm');
    const intakeInput = document.getElementById('intakeInput');
    const cancelButton = document.getElementById('cancelButton');
    const intakeStatus = document.getElementById('intakeStatus');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;
    let receivedTranscript = false;
    let recognitionStopReason = 'idle';
    let speechSessionActive = false;

    function setIntakeStatus(message) {
      intakeStatus.textContent = message || '';
    }

    function setListeningState(listening) {
      isListening = listening;
      coordinatorIcon.setAttribute('title', listening ? 'Listening...' : 'Tap to speak');
      coordinatorIcon.setAttribute('aria-label', listening ? 'Listening for your request' : 'Tap to speak');
    }

    setListeningState(false);
    if (!SpeechRecognition) {
      coordinatorIcon.setAttribute('title', 'Voice input unavailable. Tap to type your request.');
      coordinatorIcon.setAttribute('aria-label', 'Voice input unavailable. Tap to type your request.');
    }

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.addEventListener('result', function(event) {
        if (!speechSessionActive || !intakeForm.classList.contains('active')) {
          return;
        }
        const transcript = event.results?.[0]?.[0]?.transcript?.trim();
        if (!transcript) return;
        receivedTranscript = true;
        recognitionStopReason = 'result';
        speechSessionActive = false;
        setIntakeStatus('');
        const existingText = intakeInput.value.trim();
        intakeInput.value = existingText ? `${existingText} ${transcript}` : transcript;
        if (typeof intakeForm.requestSubmit === 'function') {
          intakeForm.requestSubmit();
        } else {
          const submitButton = intakeForm.querySelector('button[type="submit"]');
          if (submitButton) {
            submitButton.click();
          }
        }
      });

      recognition.addEventListener('error', function(event) {
        setListeningState(false);
        recognitionStopReason = 'error';
        speechSessionActive = false;
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          setIntakeStatus('Microphone access was denied. Please type your request and submit.');
        } else {
          setIntakeStatus('Voice input failed. Please type your request and submit, or tap to try again.');
        }
      });

      recognition.addEventListener('end', function() {
        setListeningState(false);
        if (recognitionStopReason === 'error') {
          recognitionStopReason = 'idle';
          return;
        }
        if (recognitionStopReason === 'listening' && !receivedTranscript) {
          setIntakeStatus('Please type your request and submit, or tap to try voice again.');
        } else if (recognitionStopReason === 'cancelled') {
          setIntakeStatus('');
        }
        recognitionStopReason = 'idle';
      });
    }

    // 2. Icon Click Handler - Show Form
    coordinatorIcon.addEventListener('click', function() {
      if (!recognition) {
        intakeForm.classList.add('active');
        setIntakeStatus('Voice input is unavailable in this browser. Please type your request and submit.');
        return;
      }
      intakeForm.classList.add('active');
      if (isListening) {
        recognitionStopReason = 'cancelled';
        speechSessionActive = false;
        setIntakeStatus('');
        recognition.stop();
        return;
      }
      try {
        receivedTranscript = false;
        recognitionStopReason = 'listening';
        speechSessionActive = true;
        recognition.start();
        setListeningState(true);
        setIntakeStatus('Listening...');
        intakeInput.focus();
      } catch (error) {
        recognitionStopReason = 'error';
        speechSessionActive = false;
        setIntakeStatus('Unable to start voice input. Please type your request and submit.');
        setListeningState(false);
        intakeInput.focus();
      }
    });

    // 3. Form Submission Handler - POST to Netlify serverless function
    intakeForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const userMessage = intakeInput.value.trim();
      if (userMessage) {
        try {
          fetch('/.netlify/functions/intake', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              body: userMessage
            })
          })
          .then(response => response.json())
          .then(data => {
            intakeInput.value = '';
            intakeForm.classList.remove('active');
            alert('On it! Your tap is my command!');
          })
          .catch(error => {
            console.log('Fetch error:', error);
            alert('Submission error. Please try again.');
          });
        } catch (error) {
          console.log('Try/catch error:', error);
          alert('Submission error. Please try again.');
        }
      }
    });

    // 4. Cancel Button Handler
    cancelButton.addEventListener('click', function() {
      speechSessionActive = false;
      if (isListening && recognition) {
        recognitionStopReason = 'cancelled';
        recognition.stop();
      }
      setIntakeStatus('');
      intakeInput.value = '';
      intakeForm.classList.remove('active');
    });

    // 5. fetchCardData Function (POST Request with Monday.com GraphQL)
    function fetchCardData(cardType) {
      const contentElement = document.getElementById(`content-${cardType}`);
      contentElement.innerText = "Loading latest updates...";

      // Map card types to Monday.com board IDs
      const boardMap = {
        'operations': 18424728273,
        'myworld': 18424728273,
        'personal': 18424728273,
        'referral': 18424728273
      };

      const boardId = boardMap[cardType] || 18424728273;

      // Special handling for different tile types
      if (cardType === 'operations') {
        fetchOperationsData(contentElement, boardId);
      } else if (cardType === 'myworld') {
        fetchMyWorldData(contentElement, boardId);
      } else if (cardType === 'personal' || cardType === 'referral') {
        contentElement.innerText = 'Coming soon';
      } else {
        fetchCardDataGeneric(contentElement, cardType, boardId);
      }
    }

    // Fetch Operations data with status grouping
    function fetchOperationsData(contentElement, boardId) {
      fetch('/.netlify/functions/monday', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `apikey MONDAY_API_KEY_PLACEHOLDER`
        },
        body: JSON.stringify({
          query: `query { boards(ids: ${boardId}) { items_page(limit: 50) { items { id name column_values { id text } } } } }`
        })
      })
        .then(response => response.json())
        .then(data => {
          const items = data?.data?.boards?.[0]?.items_page?.items || [];
          
          // Group items by status
          const statuses = {
            'Needs Action': [],
            'In Progress': [],
            'Waiting on Customer or Parts': [],
            'Ready to Bill': []
          };

          items.forEach(item => {
            // Get the project_status column
            const statusCol = item.column_values.find(col => col.id === 'project_status');
            const status = statusCol ? (statusCol.text || '').trim() : '';

            // Skip completed items
            if (status === '5. Completed / Paid') {
              return;
            }

            // Map status to bucket
            let bucket = 'Needs Action'; // Default

            if (status === '3. Ready Wall') {
              bucket = 'Ready to Bill';
            } else if (status === '🤖 AI Holding Pile' || status === '4. Store Stock / Logged') {
              bucket = 'Waiting on Customer or Parts';
            } else if (status === '2. Workbench' || status === 'Chris\'s Tasks') {
              bucket = 'In Progress';
            } else if (status === '1. Intake / William Review' || status === '') {
              bucket = 'Needs Action';
            }

            if (statuses.hasOwnProperty(bucket)) {
              statuses[bucket].push(item.name);
            }
          });

          // Build HTML for status sections
          let html = '';
          for (const [status, statusItems] of Object.entries(statuses)) {
            html += `<div class="status-section">
              <div class="status-label">${status}</div>
              <div class="status-items">`;
            
            if (statusItems.length > 0) {
              statusItems.forEach(itemName => {
                html += `<div class="status-item">• ${itemName}</div>`;
              });
            } else {
              html += `<div class="status-empty">(none)</div>`;
            }
            
            html += `</div></div>`;
          }

          contentElement.innerHTML = html;
        })
        .catch(error => {
          console.error(`Error fetching operations data:`, error);
          contentElement.innerText = `Unable to load operations data. Check console for details.`;
        });
    }

    // Fetch My World data with grouped buckets
    function fetchMyWorldData(contentElement, boardId) {
      fetch('/.netlify/functions/monday', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `apikey MONDAY_API_KEY_PLACEHOLDER`
        },
        body: JSON.stringify({
          query: `query { boards(ids: ${boardId}) { items_page(limit: 50) { items { id name column_values { id text } } } } }`
        })
      })
        .then(response => response.json())
        .then(data => {
          const items = data?.data?.boards?.[0]?.items_page?.items || [];
          
          // Group items by bucket
          const buckets = {
            '🔥 Hot Leads': [],
            '📞 Follow Up': [],
            '💰 Money Pending': [],
            '📋 On My Radar': []
          };

          items.forEach(item => {
            // Get the color_mm6mc5qp column (urgency)
            const colorCol = item.column_values.find(col => col.id === 'color_mm6mc5qp');
            const color = colorCol ? (colorCol.text || '').trim() : '';

            // Get the numeric_mm5vg0cg column (money value)
            const numericCol = item.column_values.find(col => col.id === 'numeric_mm5vg0cg');
            const numericValue = numericCol ? parseFloat(numericCol.text) : 0;

            // Determine bucket
            let bucket = '📋 On My Radar'; // Default

            if (color === 'Urgent') {
              bucket = '🔥 Hot Leads';
            } else if (color === 'Standard') {
              bucket = '📞 Follow Up';
            } else if (numericValue > 0) {
              bucket = '💰 Money Pending';
            }

            if (buckets.hasOwnProperty(bucket)) {
              buckets[bucket].push(item.name);
            }
          });

          // Build HTML for bucket sections
          let html = '';
          for (const [bucket, items] of Object.entries(buckets)) {
            html += `<div class="status-section">
              <div class="status-label">${bucket}</div>
              <div class="status-items">`;
            
            if (items.length > 0) {
              items.forEach(itemName => {
                html += `<div class="status-item">• ${itemName}</div>`;
              });
            } else {
              html += `<div class="status-empty">(none)</div>`;
            }
            
            html += `</div></div>`;
          }

          contentElement.innerHTML = html;
        })
        .catch(error => {
          console.error(`Error fetching My World data:`, error);
          contentElement.innerText = `Unable to load My World data. Check console for details.`;
        });
    }

    // Generic fetch for other card types
    function fetchCardDataGeneric(contentElement, cardType, boardId) {
      fetch('/.netlify/functions/monday', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `apikey MONDAY_API_KEY_PLACEHOLDER`
        },
        body: JSON.stringify({
          query: `query { boards(ids: ${boardId}) { items_page(limit: 10) { items { id name } } } }`
        })
      })
        .then(response => response.json())
        .then(data => {
          const items = data?.data?.boards?.[0]?.items_page?.items || [];
          if (items.length > 0) {
            const itemList = items.map(item => `• ${item.name}`).join('\n');
            contentElement.innerText = itemList;
          } else {
            contentElement.innerText = `No items found in ${cardType} queue.`;
          }
        })
        .catch(error => {
          console.error(`Error fetching ${cardType} data:`, error);
          contentElement.innerText = `Unable to load ${cardType} data. Check console for details.`;
        });
    }
  </script>

</body>
</html>
