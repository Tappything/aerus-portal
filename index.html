<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TappyThing — Digital Coordinator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --pay-btn: #16a34a;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 80px;
        }

        header {
            width: 100%;
            max-width: 600px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .avatar-container {
            position: relative;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            padding: 4px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        .status-led {
            width: 14px;
            height: 14px;
            background-color: var(--accent);
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
            border: 2px solid var(--bg-color);
            box-shadow: 0 0 8px var(--accent);
        }

        .status-led.listening {
            background-color: #ef4444;
            box-shadow: 0 0 12px #ef4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 1-Tap Mic Button */
        .main-mic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
        }

        .mic-btn {
            width: 100%;
            padding: 20px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .mic-btn:active {
            transform: scale(0.98);
        }

        .mic-btn.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        /* Smart Media Intake Preview Modal/Area */
        .intake-preview-card {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 16px;
            display: none;
            flex-direction: column;
            gap: 12px;
            animation: fadeIn 0.2s ease-in-out;
        }

        .intake-preview-card.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .media-preview-container {
            position: relative;
            width: 100%;
            max-height: 200px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-preview-container img,
        .media-preview-container video {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
        }

        .voice-status-banner {
            background: rgba(16, 185, 129, 0.15);
            border-left: 4px solid var(--accent);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .intake-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-submit {
            background: var(--accent);
            color: #fff;
        }

        .btn-cancel {
            background: var(--border);
            color: var(--text-main);
        }

        /* Asymmetric Tapulator Grid */
        .tapulator-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .tap-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .tap-card:hover, .tap-card:active {
            border-color: var(--accent);
            background: #26334d;
        }

        .tap-card-icon {
            font-size: 24px;
        }

        .tap-card-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .tap-card-count {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        /* Generic Operational Zones */
        .zone-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .zone-header {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--border);
        }

        .zone-header .badge {
            background: var(--border);
            color: var(--text-main);
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        .item-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .item-card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.4;
        }

        .item-media {
            width: 100%;
            max-height: 180px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin-top: 4px;
        }

        .item-media img, .item-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pay-btn {
            background: var(--pay-btn);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            cursor: pointer;
            margin-top: 4px;
            box-shadow: 0 2px 8px rgba(22, 163, 74, 0.3);
        }

        .card-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 4px;
        }

        .talk-card-btn {
            background: rgba(51, 65, 85, 0.6);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .talk-card-btn:active {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* Timecard Module */
        .timecard-widget {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .timecard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1rem;
        }

        .pin-input-group {
            display: flex;
            gap: 8px;
        }

        .pin-input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-main);
            font-size: 1rem;
            text-align: center;
            letter-spacing: 4px;
        }

        .timecard-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-punch-in {
            background: var(--accent);
            color: #fff;
        }

        .btn-punch-out {
            background: var(--danger);
            color: #fff;
        }

        /* Bottom Floating Dock */
        .bottom-dock {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            backdrop-filter: blur(8px);
            z-index: 100;
        }

        .dock-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .dock-btn.active, .dock-btn:active {
            color: var(--accent);
        }

        .dock-btn-icon {
            font-size: 20px;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="avatar-container">
            <div class="avatar">🤵</div>
            <div class="status-led" id="statusLed"></div>
        </div>
        <div class="header-title" id="headerTitle">TappyThing Command Hub</div>
    </header>

    <div class="app-container">

        <!-- 1-Tap Voice Button -->
        <div class="main-mic-container">
            <button class="mic-btn" id="mainMicBtn" onclick="toggleVoiceListening()">
                <span>🎙️</span> <span id="micBtnText">Tap & Speak</span>
            </button>
        </div>

        <!-- Smart Unified Photo/Video + Voice Intake Modal/Card -->
        <div class="intake-preview-card" id="intakePreviewCard">
            <div class="media-preview-container" id="mediaPreviewContainer"></div>
            <div class="voice-status-banner">
                <span>🎙️</span> <span id="intakeVoicePrompt">Listening for customer name & diagnosis...</span>
            </div>
            <div class="intake-actions">
                <button class="btn btn-cancel" onclick="cancelSmartIntake()">Cancel</button>
                <button class="btn btn-submit" onclick="submitSmartIntake()">⚡ Submit to Workbench</button>
            </div>
        </div>

        <!-- Dynamic Content Mount Point -->
        <div id="viewMount"></div>

    </div>

    <!-- Hidden File Inputs for Smart Intake -->
    <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="handleMediaCaptured(event, 'photo')">
    <input type="file" id="videoInput" accept="video/*" capture="environment" onchange="handleMediaCaptured(event, 'video')">

    <!-- Bottom Floating Dock -->
    <div class="bottom-dock">
        <button class="dock-btn" onclick="triggerCamera('photo')">
            <span class="dock-btn-icon">📷</span>
            <span>Snap Tag</span>
        </button>
        <button class="dock-btn" onclick="triggerCamera('video')">
            <span class="dock-btn-icon">🎥</span>
            <span>Record Video</span>
        </button>
        <button class="dock-btn" onclick="renderView()">
            <span class="dock-btn-icon">⚡</span>
            <span>Zones</span>
        </button>
    </div>

    <script>
        // --- State Management ---
        const CONFIG = {
            stripeBaseUrl: "https://buy.stripe.com/test_fT6",
            mondayEndpoint: "/.netlify/functions/monday?board=18424728273"
        };

        let isListening = false;
        let recognition = null;
        let currentCapturedMedia = null; // { type: 'photo'|'video', dataUrl: string, blob: Blob }
        let currentVoiceTranscript = "";

        // Sample State (Generic Operational Zones)
        let boardState = {
            workbench: [
                { id: '1', title: 'Mrs. Boatwright Oreck upright — broken belt check $40', media: null, mediaType: null },
                { id: '2', title: 'San Fuji cord diagnostic $10', media: null, mediaType: null }
            ],
            inProgress: [
                { id: '3', title: 'Paul Schwab Central Vac conversion cord install', media: null, mediaType: null }
            ],
            readyWall: [
                { id: '4', title: 'Donna Wenderhoff wand pickup ready', media: null, mediaType: null }
            ],
            partsHub: [
                { id: '5', title: 'Shared Order: Veridian Plus filters (Serena Robinson)', media: null, mediaType: null }
            ],
            commsPrivate: []
        };

        // --- Web Speech Initialization ---
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                let interim = '';
                let final = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        final += event.results[i][0].transcript;
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }

                const speechText = final || interim;
                if (speechText.trim()) {
                    currentVoiceTranscript = speechText;
                    if (currentCapturedMedia) {
                        document.getElementById('intakeVoicePrompt').innerText = `"${speechText}"`;
                    } else {
                        document.getElementById('micBtnText').innerText = `"${speechText.substring(0, 25)}..."`;
                    }
                }
            };

            recognition.onerror = () => stopListening();
            recognition.onend = () => {
                if (isListening && !currentCapturedMedia) stopListening();
            };
        }

        function toggleVoiceListening() {
            if (isListening) {
                stopListening();
                if (currentVoiceTranscript && !currentCapturedMedia) {
                    // Direct voice card creation
                    createCardFromVoice(currentVoiceTranscript);
                    currentVoiceTranscript = "";
                    document.getElementById('micBtnText').innerText = "Tap & Speak";
                }
            } else {
                startListening();
            }
        }

        function startListening() {
            if (!recognition) {
                alert("Speech recognition not supported on this browser.");
                return;
            }
            isListening = true;
            currentVoiceTranscript = "";
            recognition.start();
            document.getElementById('statusLed').classList.add('listening');
            document.getElementById('mainMicBtn').classList.add('active');
            document.getElementById('micBtnText').innerText = "Listening...";
        }

        function stopListening() {
            isListening = false;
            if (recognition) recognition.stop();
            document.getElementById('statusLed').classList.remove('listening');
            document.getElementById('mainMicBtn').classList.remove('active');
            if (!currentVoiceTranscript) {
                document.getElementById('micBtnText').innerText = "Tap & Speak";
            }
        }

        // --- Smart Photo/Video + Voice Unified Intake Flow ---
        function triggerCamera(type) {
            if (type === 'photo') {
                document.getElementById('photoInput').click();
            } else if (type === 'video') {
                document.getElementById('videoInput').click();
            }
        }

        function handleMediaCaptured(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentCapturedMedia = {
                    type: type,
                    dataUrl: e.target.result
                };

                // Show Smart Preview Card
                const previewCard = document.getElementById('intakePreviewCard');
                const container = document.getElementById('mediaPreviewContainer');
                
                if (type === 'photo') {
                    container.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                } else {
                    container.innerHTML = `<video src="${e.target.result}" controls></video>`;
                }

                previewCard.classList.add('active');
                
                // Activate mic immediately for customer & diagnosis voice-over
                startListening();
                document.getElementById('intakeVoicePrompt').innerText = "Speak customer name & diagnosis now...";
            };
            reader.readAsDataURL(file);
        }

        function cancelSmartIntake() {
            stopListening();
            currentCapturedMedia = null;
            currentVoiceTranscript = "";
            document.getElementById('intakePreviewCard').classList.remove('active');
            document.getElementById('photoInput').value = "";
            document.getElementById('videoInput').value = "";
        }

        function submitSmartIntake() {
            stopListening();
            const title = currentVoiceTranscript.trim() || "New Intake Item (Voice Pending)";
            
            const newCard = {
                id: Date.now().toString(),
                title: title,
                media: currentCapturedMedia ? currentCapturedMedia.dataUrl : null,
                mediaType: currentCapturedMedia ? currentCapturedMedia.type : null
            };

            // Route to Workbench by default
            boardState.workbench.unshift(newCard);
            
            // Reset and render
            cancelSmartIntake();
            renderView();
        }

        function createCardFromVoice(text) {
            const lower = text.toLowerCase();
            const newCard = {
                id: Date.now().toString(),
                title: text,
                media: null,
                mediaType: null
            };

            // Generic Zone Routing Logic
            if (lower.includes('ready') || lower.includes('pickup')) {
                boardState.readyWall.unshift(newCard);
            } else if (lower.includes('progress') || lower.includes('conversion') || lower.includes('bench')) {
                boardState.inProgress.unshift(newCard);
            } else if (lower.includes('part') || lower.includes('order')) {
                boardState.partsHub.unshift(newCard);
            } else {
                boardState.workbench.unshift(newCard);
            }

            renderView();
        }

        // --- Card Renderer with 1-Tap Stripe Pay Button ---
        function renderItemCard(item) {
            // Check for dollar amount literal (e.g. $10, $40, $240)
            const priceMatch = item.title.match(/\$\d+(?:,\d{3})*(?:\.\d{2})?/);
            let payButtonHtml = "";

            if (priceMatch) {
                const amount = priceMatch[0];
                payButtonHtml = `
                    <a href="${CONFIG.stripeBaseUrl}?amount=${amount.replace('$', '')}" target="_blank" class="pay-btn">
                        💳 Pay ${amount} Now
                    </a>
                `;
            }

            let mediaHtml = "";
            if (item.media) {
                if (item.mediaType === 'photo') {
                    mediaHtml = `<div class="item-media"><img src="${item.media}" alt="Attachment"></div>`;
                } else if (item.mediaType === 'video') {
                    mediaHtml = `<div class="item-media"><video src="${item.media}" controls></video></div>`;
                }
            }

            return `
                <div class="item-card">
                    <div class="item-card-header">
                        <div class="item-card-title">${escapeHtml(item.title)}</div>
                    </div>
                    ${mediaHtml}
                    ${payButtonHtml}
                    <div class="card-actions">
                        <button class="talk-card-btn" onclick="toggleVoiceListening()">
                            🎙️ Talk to Card
                        </button>
                    </div>
                </div>
            `;
        }

        // --- Timecard PIN Module Component ---
        function renderTimecardModule() {
            return `
                <div class="timecard-widget">
                    <div class="timecard-header">
                        <span>⏱️ Staff Timecard</span>
                        <span style="font-size: 0.8rem; color: var(--text-sub);">PIN Protected</span>
                    </div>
                    <div class="pin-input-group">
                        <input type="password" class="pin-input" maxlength="4" placeholder="Enter PIN" id="staffPin">
                    </div>
                    <div class="timecard-btns">
                        <button class="btn btn-punch-in" onclick="handlePunch('IN')">Punch IN</button>
                        <button class="btn btn-punch-out" onclick="handlePunch('OUT')">Punch OUT</button>
                    </div>
                </div>
            `;
        }

        function handlePunch(type) {
            const pin = document.getElementById('staffPin').value;
            if (!pin || pin.length < 4) {
                alert("Please enter your 4-digit PIN.");
                return;
            }
            alert(`Punched ${type} successfully at ${new Date().toLocaleTimeString()}!`);
            document.getElementById('staffPin').value = "";
        }

        // --- Dual-Mode URL Parameter View Router ---
        function renderView() {
            const params = new URLSearchParams(window.location.search);
            const staffParam = params.get('staff') || params.get('card');
            const mount = document.getElementById('viewMount');

            if (!staffParam) {
                // --- Master Command Hub (William's View) ---
                document.getElementById('headerTitle').innerText = "TappyThing Command Hub";
                
                mount.innerHTML = `
                    <div class="tapulator-grid">
                        <div class="tap-card" onclick="scrollToZone('workbenchZone')">
                            <span class="tap-card-icon">🛠️</span>
                            <span class="tap-card-title">Workbench</span>
                            <span class="tap-card-count">${boardState.workbench.length} Intakes</span>
                        </div>
                        <div class="tap-card" onclick="scrollToZone('inProgressZone')">
                            <span class="tap-card-icon">⚡</span>
                            <span class="tap-card-title">In Progress</span>
                            <span class="tap-card-count">${boardState.inProgress.length} Items</span>
                        </div>
                        <div class="tap-card" onclick="scrollToZone('readyWallZone')">
                            <span class="tap-card-icon">🧱</span>
                            <span class="tap-card-title">Ready Wall</span>
                            <span class="tap-card-count">${boardState.readyWall.length} Ready</span>
                        </div>
                        <div class="tap-card" onclick="scrollToZone('partsZone')">
                            <span class="tap-card-icon">📦</span>
                            <span class="tap-card-title">Parts / Hub</span>
                            <span class="tap-card-count">${boardState.partsHub.length} Orders</span>
                        </div>
                    </div>

                    ${renderTimecardModule()}

                    <div class="zone-container" id="workbenchZone">
                        <div class="zone-header">
                            <span>🛠️ Workbench</span>
                            <span class="badge">${boardState.workbench.length}</span>
                        </div>
                        <div class="card-list">
                            ${boardState.workbench.map(renderItemCard).join('')}
                        </div>
                    </div>

                    <div class="zone-container" id="inProgressZone">
                        <div class="zone-header">
                            <span>⚡ In Progress / Waiting on Parts</span>
                            <span class="badge">${boardState.inProgress.length}</span>
                        </div>
                        <div class="card-list">
                            ${boardState.inProgress.map(renderItemCard).join('')}
                        </div>
                    </div>

                    <div class="zone-container" id="readyWallZone">
                        <div class="zone-header">
                            <span>🧱 Ready Wall</span>
                            <span class="badge">${boardState.readyWall.length}</span>
                        </div>
                        <div class="card-list">
                            ${boardState.readyWall.map(renderItemCard).join('')}
                        </div>
                    </div>
                `;
            } else {
                // --- Standalone Staff Forever Card View ---
                const staffName = staffParam.charAt(0).toUpperCase() + staffParam.slice(1);
                document.getElementById('headerTitle').innerText = `${staffName}'s Forever Card`;

                mount.innerHTML = `
                    ${renderTimecardModule()}

                    <div class="zone-container">
                        <div class="zone-header">
                            <span>🛠️ Active Workbench</span>
                            <span class="badge">${boardState.workbench.length}</span>
                        </div>
                        <div class="card-list">
                            ${boardState.workbench.map(renderItemCard).join('')}
                        </div>
                    </div>

                    <div class="zone-container">
                        <div class="zone-header">
                            <span>⚡ Bench Queue / In Progress</span>
                            <span class="badge">${boardState.inProgress.length}</span>
                        </div>
                        <div class="card-list">
                            ${boardState.inProgress.map(renderItemCard).join('')}
                        </div>
                    </div>

                    <div class="zone-container">
                        <div class="zone-header">
                            <span>🧱 Ready Wall</span>
                            <span class="badge">${boardState.readyWall.length}</span>
                        </div>
                        <div class="card-list">
                            ${boardState.readyWall.map(renderItemCard).join('')}
                        </div>
                    </div>

                    <div class="zone-container">
                        <div class="zone-header">
                            <span>📦 Shared Parts Order List</span>
                            <span class="badge">${boardState.partsHub.length}</span>
                        </div>
                        <div class="card-list">
                            ${boardState.partsHub.map(renderItemCard).join('')}
                        </div>
                    </div>
                `;
            }
        }

        function scrollToZone(id) {
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // --- Initial Load ---
        window.addEventListener('DOMContentLoaded', () => {
            renderView();
        });
    </script>
</body>
</html>
