<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TappyThing ⚡ Chat with Fresh</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1e1035 0%, #0c0714 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      height: 92vh;
      gap: 12px;
    }
    .header-box {
      text-align: center;
      padding: 8px 0;
    }
    .brand-title {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fbbf24 0%, #f472b6 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-top: 4px;
    }
    .chat-box {
      flex: 1;
      background: rgba(30, 16, 53, 0.95);
      border: 1px solid rgba(251, 191, 36, 0.25);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .bubble {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .bubble.fresh {
      align-self: flex-start;
      background: #2d184c;
      color: #f8fafc;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(192, 132, 252, 0.3);
    }
    .bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0f172a;
      font-weight: 600;
      border-bottom-right-radius: 4px;
    }
    .bubble.thinking {
      align-self: flex-start;
      background: #2d184c;
      color: #cbd5e1;
      font-style: italic;
    }
    .input-area {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .text-input {
      flex: 1;
      background: #1e1035;
      border: 1px solid rgba(251, 191, 36, 0.4);
      border-radius: 25px;
      padding: 12px 18px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
    }
    .btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: transform 0.1s, background 0.2s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-mic {
      background: #784bd1;
      color: #fff;
    }
    .btn-mic.recording {
      background: #ef4444;
      animation: pulse 1s infinite alternate;
    }
    .btn-send {
      background: #fbbf24;
      color: #1e1035;
      font-weight: bold;
    }
    @keyframes pulse {
      from { box-shadow: 0 0 0px #ef4444; }
      to { box-shadow: 0 0 15px #ef4444; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-box">
      <div class="brand-title">TappyThing ⚡</div>
      <div class="tagline">Chat with Fresh to build your system</div>
    </div>

    <div class="chat-box" id="chat-box">
      <div class="bubble fresh">
        Hey there! 👋 I'm <strong>Fresh</strong>, your digital coordinator. Tell me what kind of business or personal chaos we're organizing today, and I'll get your system ready in 60 seconds!
      </div>
    </div>

    <div class="input-area">
      <button class="btn btn-mic" id="mic-btn" onclick="toggleVoice()" title="Tap to talk">🎤</button>
      <input type="text" class="text-input" id="text-input" placeholder="Type or tap the mic..." onkeydown="handleKey(event)" />
      <button class="btn btn-send" id="send-btn" onclick="handleSend()">➤</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const textInput = document.getElementById("text-input");
    const micBtn = document.getElementById("mic-btn");
    let conversationHistory = [];
    let isRecording = false;
    let recognition = null;
    const synth = window.speechSynthesis;

    // 1. Initialize Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add("recording");
      };
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        textInput.value = transcript;
        handleSend();
      };
      recognition.onerror = () => stopRecording();
      recognition.onend = () => stopRecording();
    }

    function toggleVoice() {
      if (!recognition) {
        alert("Voice recognition is not supported in this browser. Please use Chrome or Safari.");
        return;
      }
      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function stopRecording() {
      isRecording = false;
      micBtn.classList.remove("recording");
    }

    function handleKey(e) {
      if (e.key === "Enter") handleSend();
    }

    function addBubble(sender, text) {
      const b = document.createElement("div");
      b.className = `bubble ${sender}`;
      b.innerHTML = text;
      chatBox.appendChild(b);
      chatBox.scrollTop = chatBox.scrollHeight;
      return b;
    }

    function speak(text) {
      if (!synth) return;
      synth.cancel();
      // Remove HTML tags for clean speech
      const clean = text.replace(/<[^>]*>/g, "");
      const utter = new SpeechSynthesisUtterance(clean);
      utter.rate = 1.05;
      synth.speak(utter);
    }

    async function handleSend() {
      const msg = textInput.value.trim();
      if (!msg) return;

      addBubble("user", msg);
      conversationHistory.push({ role: "user", content: msg });
      textInput.value = "";

      const thinking = addBubble("thinking", "Fresh is thinking...");

      try {
        const res = await fetch("/.netlify/functions/gemini-chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: msg,
            history: conversationHistory
          })
        });

        const data = await res.json();
        chatBox.removeChild(thinking);

        if (data && data.reply) {
          let reply = data.reply;
          addBubble("fresh", reply);
          conversationHistory.push({ role: "model", content: reply });
          speak(reply);
        } else {
          addBubble("fresh", "I had a quick glitch connecting. Tap the mic and try again!");
        }
      } catch (err) {
        if (thinking.parentNode) chatBox.removeChild(thinking);
        addBubble("fresh", "I had trouble reaching the server. Please check your internet connection.");
      }
    }
  </script>
</body>
</html>
