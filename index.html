<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TappyThing ⚡ Digital Coordinator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: radial-gradient(circle at top, #1e1035 0%, #0c0714 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      position: relative;
    }

    /* Rob Art Tribute in the Corner */
    .rob-art-badge {
      position: absolute;
      top: 14px;
      right: 16px;
      background: rgba(30, 16, 53, 0.7);
      border: 1px solid rgba(244, 114, 182, 0.4);
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.72rem;
      color: #f472b6;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      backdrop-filter: blur(6px);
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
    }

    /* Header & Tyler / Fresh Bandana Logo */
    .header-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
    }

    .logo-container {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      border: 2px solid #fbbf24;
      box-shadow: 0 0 25px rgba(251, 191, 36, 0.45);
      overflow: hidden;
      background: #180d2b;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      font-size: 1.65rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fbbf24 0%, #f472b6 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .brand-tagline {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #fbbf24;
      font-weight: 700;
    }

    .subscriber-tag {
      background: rgba(30, 16, 53, 0.85);
      border: 1px solid rgba(251, 191, 36, 0.35);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      color: #e9d5ff;
      cursor: pointer;
      margin-top: 2px;
    }

    /* 3-Button Intake Suite (Talk, Type, Video/Photo) */
    .action-trio {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    .trio-btn {
      background: rgba(30, 16, 53, 0.9);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #f8fafc;
      padding: 14px 8px;
      border-radius: 18px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.15s;
    }

    .trio-btn:active {
      transform: scale(0.96);
      background: #3b1d6e;
    }

    .trio-icon {
      font-size: 1.5rem;
    }

    /* Big Central Tappy Button */
    .big-tappy-btn {
      width: 100%;
      background: linear-gradient(135deg, #d97706, #9333ea, #4f46e5);
      color: #fff;
      border: 2px solid #fbbf24;
      padding: 22px;
      border-radius: 24px;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(147, 51, 234, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      transition: transform 0.1s;
    }

    .big-tappy-btn:active {
      transform: scale(0.98);
    }

    .big-tappy-btn.recording {
      background: #ef4444;
      border-color: #fff;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    #statusText {
      text-align: center;
      font-size: 0.88rem;
      color: #fbbf24;
      min-height: 22px;
      font-weight: 500;
    }

    /* Prominent 'My World' Button */
    .my-world-trigger {
      width: 100%;
      background: rgba(26, 12, 48, 0.95);
      border: 1px solid #fbbf24;
      border-radius: 20px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      transition: transform 0.15s;
    }

    .my-world-trigger:active {
      transform: scale(0.98);
    }

    .my-world-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .my-world-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fbbf24;
    }

    .my-world-sub {
      font-size: 0.75rem;
      color: #c084fc;
      margin-top: 2px;
    }

    /* Modal / Drawer for Camera & Media Controls */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 4, 18, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .media-card-modal {
      width: 100%;
      max-width: 420px;
      background: #190e2d;
      border: 2px solid #fbbf24;
      border-radius: 24px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .camera-frame {
      width: 100%;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }

    video, img#previewImg {
      width: 100%; height: 100%; object-fit: cover;
    }
    img#previewImg { display: none; }

    .cam-floating-btns {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .circle-btn {
      background: rgba(20, 10, 35, 0.8);
      border: 1px solid #fbbf24;
      color: #fbbf24;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .media-modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-btn {
      background: rgba(30, 16, 53, 0.9);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #fff;
      padding: 12px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Drawer / View for My World Cards */
    .world-drawer {
      display: none;
      width: 100%;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .card {
      background: rgba(30, 16, 53, 0.95);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .card-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: #f8fafc;
    }

    .card-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .badge-bill { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .badge-ops { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .badge-task { background: rgba(192, 132, 252, 0.2); color: #c084fc; border: 1px solid #a855f7; }

    .card-body {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.4;
    }

    .bill-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(12, 7, 20, 0.85);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .bill-amount {
      font-size: 1.25rem;
      font-weight: 800;
      color: #4ade80;
    }

    .send-bill-btn {
      background: #22c55e;
      color: #022c22;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Rob Art Sacred Tribute Badge -->
  <div class="rob-art-badge">
    <span>🐷</span>
    <span>ROB ART</span>
  </div>

  <div class="container">
    
    <!-- Restored Original Header -->
    <div class="header-box">
      <div class="logo-container">
        <img src="logo.png" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=Fresh&backgroundColor=180d2b'" alt="Fresh TappyThing" />
      </div>
      <div class="brand-title">TappyThing</div>
      <div class="brand-tagline">Digital Coordinator Command Center</div>
      <div class="subscriber-tag" id="userTag" title="Click to switch subscriber">👑 Master: William</div>
    </div>

    <!-- 3 Action Intake Buttons -->
    <div class="action-trio">
      <button class="trio-btn" id="talkBtn">
        <span class="trio-icon">🎙️</span>
        <span>Talk</span>
      </button>

      <button class="trio-btn" id="typeBtn">
        <span class="trio-icon">⌨️</span>
        <span>Type</span>
      </button>

      <button class="trio-btn" id="cameraToolBtn">
        <span class="trio-icon">📷</span>
        <span>Photo / Video</span>
      </button>
    </div>

    <!-- Big Central Button -->
    <button class="big-tappy-btn" id="mainTapBtn">🔴 TAP TO SPEAK & BUILD</button>

    <div id="statusText">Tap Talk to speak, or snap a photo/video</div>

    <!-- Prominent "My World" Button -->
    <div class="my-world-trigger" id="myWorldToggle">
      <div class="my-world-left">
        <span style="font-size: 1.6rem;">🌍</span>
        <div>
          <div class="my-world-title">My World (<span id="cardCount">0</span>)</div>
          <div class="my-world-sub">Tap to view your self-building cards & bills</div>
        </div>
      </div>
      <span style="font-size: 1.3rem; color: #fbbf24;" id="worldChevron">▼</span>
    </div>

    <!-- Self-Building "My World" Cards Container -->
    <div class="world-drawer" id="worldDrawer">
      <div id="cardsList" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </div>

  </div>

  <!-- Camera / Photo / Video Modal Engine -->
  <div class="modal-overlay" id="cameraModal">
    <div class="media-card-modal">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-weight:700; color:#fbbf24; font-size:0.95rem;">📷 Capture Note</span>
        <button class="circle-btn" style="width:32px; height:32px; font-size:0.9rem;" id="closeModalBtn">✖️</button>
      </div>

      <div class="camera-frame">
        <video id="videoFeed" autoplay playsinline muted></video>
        <img id="previewImg" alt="Snapshot" />
        <canvas id="snapshotCanvas" style="display:none;"></canvas>

        <div class="cam-floating-btns">
          <button class="circle-btn" id="flipCamBtn" title="Flip Front/Rear Camera">🔄</button>
        </div>
      </div>

      <div class="media-modal-actions">
        <button class="modal-btn" id="snapStillPhotoBtn">📸 Snap Photo</button>
        <label class="modal-btn" style="margin:0; cursor:pointer;">
          🖼️ Photo Roll
          <input type="file" id="fileUploadInput" accept="image/*" style="display:none;" />
        </label>
      </div>

      <button class="modal-btn" id="savePhotoToWorldBtn" style="background:#22c55e; color:#022c22; border:none; display:none;">
        ✅ Add to My World
      </button>
    </div>
  </div>

  <script>
    // --- 1. SYSTEM DATA & IDENTITY ---
    const REAL_SYSTEM_CARDS = [
      {
        id: 401,
        user: "William",
        title: "⚡ Aerus Electrolux Guardian Diagnostic",
        type: "Shop Ops",
        details: "Guardian canister intake. $40 diagnostic fee applied. Placed in Workbench for motor carbon brush & bearing check.",
        billAmount: 40.00,
        status: "Workbench",
        createdAt: "Sep 14, 2026"
      },
      {
        id: 402,
        user: "William",
        title: "🧾 Mike Bagdon (Bagdons Vacuum) - Shop Overhaul",
        type: "Bill / Invoice",
        details: "Mike Bagdon (410-882-6956). First live TappyThing B2B subscriber. Complete repair overhaul & 1-tap Workiz invoice ready.",
        billAmount: 185.00,
        status: "Ready to Send",
        createdAt: "Sep 12, 2026"
      },
      {
        id: 403,
        user: "William",
        title: "📋 FOASPLUS & Vendor Inventory Reorder",
        type: "Task",
        details: "Replenish Aerus bags, HEPA filters, drive belts, and sanitizer supplies. Intake via mobile voice tap.",
        billAmount: null,
        status: "Workiz Handoff",
        createdAt: "Sep 14, 2026"
      },
      {
        id: 404,
        user: "Umar",
        title: "🚀 Workflow Automation: Client Follow-up",
        type: "Task",
        details: "Automate SMS & email sequences for inbound leads.",
        billAmount: null,
        status: "In Progress",
        createdAt: "Sep 14, 2026"
      }
    ];

    let storedCards = JSON.parse(localStorage.getItem('tappy_cards') || '[]');
    if (storedCards.length === 0 || !storedCards.some(c => c.id === 401)) {
      localStorage.setItem('tappy_cards', JSON.stringify(REAL_SYSTEM_CARDS));
    }

    const urlParams = new URLSearchParams(window.location.search);
    let currentUser = urlParams.get('user') || localStorage.getItem('tappy_current_user') || "William";
    localStorage.setItem('tappy_current_user', currentUser);

    const isMaster = currentUser.toLowerCase() === 'william';
    document.getElementById('userTag').innerText = isMaster ? `👑 Master: William` : `👤 Subscriber: ${currentUser}`;

    document.getElementById('userTag').addEventListener('click', () => {
      const newUser = prompt("Switch view ('William' for Master or subscriber name):", currentUser);
      if (newUser) {
        localStorage.setItem('tappy_current_user', newUser);
        window.location.search = `?user=${encodeURIComponent(newUser)}`;
      }
    });

    // --- 2. CAMERA ENGINE WITH FLIP & STILL PHOTO ---
    let cameraStream = null;
    let currentFacingMode = 'environment';
    const video = document.getElementById('videoFeed');
    const previewImg = document.getElementById('previewImg');
    const canvas = document.getElementById('snapshotCanvas');
    let capturedPhotoData = null;

    async function openCamera() {
      document.getElementById('cameraModal').style.display = 'flex';
      previewImg.style.display = 'none';
      video.style.display = 'block';
      document.getElementById('savePhotoToWorldBtn').style.display = 'none';
      try {
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode },
          audio: false
        });
        video.srcObject = cameraStream;
      } catch (e) {
        alert("Camera permission is needed to capture photos.");
      }
    }

    function closeCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
      }
      document.getElementById('cameraModal').style.display = 'none';
    }

    document.getElementById('cameraToolBtn').addEventListener('click', openCamera);
    document.getElementById('closeModalBtn').addEventListener('click', closeCamera);

    document.getElementById('flipCamBtn').addEventListener('click', () => {
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      openCamera();
    });

    // Snap Photo
    document.getElementById('snapStillPhotoBtn').addEventListener('click', () => {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      capturedPhotoData = canvas.toDataURL('image/jpeg');
      
      video.style.display = 'none';
      previewImg.src = capturedPhotoData;
      previewImg.style.display = 'block';
      document.getElementById('savePhotoToWorldBtn').style.display = 'block';
    });

    // Pick from Gallery
    document.getElementById('fileUploadInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          capturedPhotoData = event.target.result;
          video.style.display = 'none';
          previewImg.src = capturedPhotoData;
          previewImg.style.display = 'block';
          document.getElementById('savePhotoToWorldBtn').style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    // Save Photo into World
    document.getElementById('savePhotoToWorldBtn').addEventListener('click', () => {
      const noteTitle = prompt("Add a title for this photo note:", "Equipment Inspection Photo") || "Photo Card";
      const newCard = {
        id: Date.now(),
        user: currentUser,
        title: `📷 ${noteTitle}`,
        type: "Shop Ops",
        details: "Photo captured via mobile intake.",
        photo: capturedPhotoData,
        billAmount: null,
        status: "Active",
        createdAt: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      };

      let cards = JSON.parse(localStorage.getItem('tappy_cards') || '[]');
      cards.unshift(newCard);
      localStorage.setItem('tappy_cards', JSON.stringify(cards));

      closeCamera();
      document.getElementById('statusText').innerText = "✅ Photo Card saved to your World!";
      updateWorldCards();
      openWorldDrawer();
    });

    // --- 3. SPEECH & TAP BUILDER ---
    let isListening = false;
    let recognition = null;
    let spokenText = "";

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (e) => {
        spokenText = e.results[0][0].transcript;
        document.getElementById('statusText').innerText = `Heard: "${spokenText}"`;
      };
    }

    function toggleSpeech() {
      const btn = document.getElementById('mainTapBtn');
      if (!isListening) {
        isListening = true;
        spokenText = "";
        btn.innerText = "⏹️ LISTENING... (TAP TO FINISH)";
        btn.classList.add('recording');
        if (recognition) recognition.start();
      } else {
        isListening = false;
        btn.innerText = "⏳ BUILDING YOUR CARD...";
        btn.classList.remove('recording');
        if (recognition) recognition.stop();

        const isBill = /bill|invoice|charge|\$/i.test(spokenText);
        const amountMatch = spokenText.match(/\$?(\d+(\.\d{2})?)/);
        const billAmount = amountMatch ? parseFloat(amountMatch[1]) : null;

        const newCard = {
          id: Date.now(),
          user: currentUser,
          title: isBill ? `🧾 Bill: ${spokenText}` : (spokenText || "⚡ Quick Note"),
          type: isBill ? "Bill / Invoice" : "Task",
          details: spokenText || "Captured via instant tap.",
          billAmount: billAmount,
          status: isBill ? "Ready to Send" : "New",
          createdAt: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
        };

        let cards = JSON.parse(localStorage.getItem('tappy_cards') || '[]');
        cards.unshift(newCard);
        localStorage.setItem('tappy_cards', JSON.stringify(cards));

        document.getElementById('statusText').innerText = "🎉 Card built in your World!";
        updateWorldCards();
        openWorldDrawer();

        setTimeout(() => {
          btn.innerText = "🔴 TAP TO SPEAK & BUILD";
        }, 1500);
      }
    }

    document.getElementById('mainTapBtn').addEventListener('click', toggleSpeech);
    document.getElementById('talkBtn').addEventListener('click', toggleSpeech);

    document.getElementById('typeBtn').addEventListener('click', () => {
      const typedNote = prompt("Type your note, task, or bill:");
      if (typedNote) {
        const isBill = /bill|invoice|charge|\$/i.test(typedNote);
        const amountMatch = typedNote.match(/\$?(\d+(\.\d{2})?)/);
        const billAmount = amountMatch ? parseFloat(amountMatch[1]) : null;

        const newCard = {
          id: Date.now(),
          user: currentUser,
          title: isBill ? `🧾 Bill: ${typedNote}` : typedNote,
          type: isBill ? "Bill / Invoice" : "Task",
          details: typedNote,
          billAmount: billAmount,
          status: isBill ? "Ready to Send" : "New",
          createdAt: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
        };

        let cards = JSON.parse(localStorage.getItem('tappy_cards') || '[]');
        cards.unshift(newCard);
        localStorage.setItem('tappy_cards', JSON.stringify(cards));
        updateWorldCards();
        openWorldDrawer();
      }
    });

    // --- 4. MY WORLD DRAWER ---
    let drawerOpen = false;
    function openWorldDrawer() {
      drawerOpen = true;
      document.getElementById('worldDrawer').style.display = 'flex';
      document.getElementById('worldChevron').innerText = '▲';
      updateWorldCards();
    }

    document.getElementById('myWorldToggle').addEventListener('click', () => {
      drawerOpen = !drawerOpen;
      document.getElementById('worldDrawer').style.display = drawerOpen ? 'flex' : 'none';
      document.getElementById('worldChevron').innerText = drawerOpen ? '▲' : '▼';
      if (drawerOpen) updateWorldCards();
    });

    function updateWorldCards() {
      const allCards = JSON.parse(localStorage.getItem('tappy_cards') || '[]');
      const visibleCards = isMaster 
        ? allCards 
        : allCards.filter(c => (c.user || '').toLowerCase() === currentUser.toLowerCase());

      document.getElementById('cardCount').innerText = visibleCards.length;
      const listEl = document.getElementById('cardsList');

      if (visibleCards.length === 0) {
        listEl.innerHTML = `
          <div style="text-align:center; padding:30px 16px; color:#fbbf24; font-size:0.88rem;">
            🌱 <b>Your World is ready to build!</b><br>
            Tap Talk, Type, or Photo above to create your first card.
          </div>
        `;
        return;
      }

      listEl.innerHTML = visibleCards.map(c => {
        let badgeClass = 'badge-task';
        if (c.type.includes('Bill')) badgeClass = 'badge-bill';
        else if (c.type.includes('Shop')) badgeClass = 'badge-ops';

        return `
          <div class="card">
            <div class="card-top">
              <div>
                <div class="card-title">${c.title}</div>
                ${isMaster ? `<div style="font-size:0.75rem; color:#fbbf24; margin-top:2px;">👤 Client: <b>${c.user}</b></div>` : ''}
              </div>
              <span class="card-badge ${badgeClass}">${c.type}</span>
            </div>

            ${c.photo ? `<img src="${c.photo}" style="width:100%; border-radius:10px; margin-top:4px;" />` : ''}
            
            <div class="card-body">${c.details}</div>

            ${c.billAmount ? `
              <div class="bill-box">
                <div>
                  <div style="font-size:0.75rem; color:#94a3b8;">Invoice Total</div>
                  <div class="bill-amount">${c.billAmount.toFixed(2)}</div>
                </div>
                <button class="send-bill-btn" onclick="alert('✅ Invoice for ${c.billAmount.toFixed(2)} sent!')">1-Tap Send</button>
              </div>
            ` : ''}

            <div style="display:flex; justify-content:space-between; font-size:0.72rem; color:#a855f7; margin-top:4px;">
              <span>Status: <b style="color:#f8fafc;">${c.status}</b></span>
              <span>${c.createdAt}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    updateWorldCards();
  </script>
</body>
</html>
