<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TappyThing — Tapulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #05070e; color: #f3f4f6; }
.tapulator-face { background: #0f172a; border: 2px solid #1e293b; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); }
.led-display { background: #020617; border: 1px solid #1e293b; font-family: 'Courier New', Courier, monospace; }
.tap-button { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); box-shadow: 0 0 30px rgba(37, 99, 235, 0.6); }
.tap-button:active { transform: scale(0.95); }
.drawer-btn { background: #1e293b; border: 1px solid #334155; }
.drawer-btn:hover { background: #334155; }
@keyframes flash-banner { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.flash-banner { animation: flash-banner 1.5s infinite; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="max-w-md w-full tapulator-face rounded-3xl p-6 relative overflow-hidden space-y-6">

  <!-- TOP LED DISPLAY SCREEN -->
  <div class="led-display rounded-2xl p-4 text-center border border-blue-900/50 min-h-[90px] flex flex-col items-center justify-center">
    <div id="ledBanner" class="text-xs font-black text-emerald-400 uppercase tracking-widest flash-banner mb-1">
      *** TAPPARAMA ENGAGED ***
    </div>
    <div id="ledOutput" class="text-sm font-bold text-gray-200 tracking-wide">
      BUILD PERSONAL WORLD FIRST
    </div>
  </div>

  <!-- CENTER BIG TAP BUTTON -->
  <div class="flex flex-col items-center justify-center space-y-2">
    <button id="micBtn" onclick="toggleVoiceIntake()" class="tap-button w-36 h-36 rounded-full text-white flex flex-col items-center justify-center shadow-2xl transition-all duration-200">
      <i class="fa-solid fa-microphone text-4xl mb-1"></i>
      <span class="font-black text-xl tracking-wider">TAP</span>
    </button>
    <span id="voiceStatus" class="text-xs font-bold text-gray-400 uppercase tracking-wider pt-2">Tap button to speak to Fresh</span>
  </div>

  <!-- FLASHING ONBOARDING BANNER -->
  <button onclick="triggerOnboarding()" class="w-full bg-blue-900/80 hover:bg-blue-800 text-blue-200 font-black py-3 rounded-xl text-xs border border-blue-500 uppercase tracking-widest transition flex items-center justify-center gap-2 flash-banner">
    <i class="fa-solid fa-bolt text-amber-400"></i>
    <span>[ BUILD PERSONAL WORLD FIRST ]</span>
  </button>

  <!-- HIDDEN PROMPT TEXTAREA FOR FALLBACK -->
  <textarea id="promptInput" rows="1" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2 text-xs text-gray-200 focus:outline-none placeholder-gray-600 hidden" placeholder="Type prompt fallback..."></textarea>

  <!-- 6 WORLD DRAWERS GRID -->
  <div class="grid grid-cols-2 gap-3">
    <button onclick="openDrawer('Personal')" class="drawer-btn rounded-xl p-3 text-left transition space-y-1">
      <div class="text-xs font-extrabold text-blue-400 flex items-center justify-between">
        <span>1. Personal</span> <i class="fa-solid fa-user text-gray-500"></i>
      </div>
      <div class="text-[10px] text-gray-400">Tasks & Dumps</div>
    </button>

    <button onclick="openDrawer('Business')" class="drawer-btn rounded-xl p-3 text-left transition space-y-1">
      <div class="text-xs font-extrabold text-blue-400 flex items-center justify-between">
        <span>2. Business</span> <i class="fa-solid fa-briefcase text-gray-500"></i>
      </div>
      <div class="text-[10px] text-gray-400">Operations Hub</div>
    </button>

    <button onclick="openDrawer('Customers')" class="drawer-btn rounded-xl p-3 text-left transition space-y-1">
      <div class="text-xs font-extrabold text-blue-400 flex items-center justify-between">
        <span>3. Customers</span> <i class="fa-solid fa-address-book text-gray-500"></i>
      </div>
      <div class="text-[10px] text-gray-400">22,283 Vault</div>
    </button>

    <button onclick="openDrawer('Jobs')" class="drawer-btn rounded-xl p-3 text-left transition space-y-1">
      <div class="text-xs font-extrabold text-blue-400 flex items-center justify-between">
        <span>4. Jobs</span> <i class="fa-solid fa-wrench text-gray-500"></i>
      </div>
      <div class="text-[10px] text-gray-400">Bench & Repairs</div>
    </button>

    <button onclick="openDrawer('Invoices')" class="drawer-btn rounded-xl p-3 text-left transition space-y-1">
      <div class="text-xs font-extrabold text-blue-400 flex items-center justify-between">
        <span>5. Invoices</span> <i class="fa-solid fa-credit-card text-gray-500"></i>
      </div>
      <div class="text-[10px] text-gray-400">Stripe Billing</div>
    </button>

    <button onclick="openDrawer('Shared Cards')" class="drawer-btn rounded-xl p-3 text-left transition space-y-1">
      <div class="text-xs font-extrabold text-blue-400 flex items-center justify-between">
        <span>6. Shared</span> <i class="fa-solid fa-share-nodes text-gray-500"></i>
      </div>
      <div class="text-[10px] text-gray-400">Public Links</div>
    </button>
  </div>

  <!-- PERSISTENT CARD DRAWER MODAL WITH IN-CARD TAP KEY -->
  <div id="drawerModal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col p-4 backdrop-blur-md">
    <div class="flex items-center justify-between border-b border-gray-800 pb-3 mb-4">
      <h3 id="drawerTitle" class="text-lg font-black text-white flex items-center gap-2">
        <i class="fa-solid fa-folder-open text-blue-400"></i> Drawer
      </h3>
      <button onclick="closeDrawer()" class="text-gray-400 hover:text-white font-bold text-sm bg-gray-800 px-3 py-1 rounded-lg">Close</button>
    </div>

    <!-- IN-CARD PERSISTENT TAP KEY -->
    <div class="bg-gray-900 border border-blue-900/60 rounded-2xl p-4 text-center mb-4 flex items-center justify-between">
      <div class="text-left">
        <div class="text-xs font-bold text-blue-400 uppercase">In-Card Speak</div>
        <div class="text-[10px] text-gray-400">Talk directly into this drawer</div>
      </div>
      <button onclick="toggleVoiceIntake()" class="tap-button px-4 py-2 rounded-xl text-white font-black text-xs flex items-center gap-2">
        <i class="fa-solid fa-microphone"></i> TAP
      </button>
    </div>

    <div id="drawerContent" class="flex-1 overflow-y-auto space-y-3 text-xs text-gray-300">
      <p class="text-center text-gray-500 pt-8">Loading cards...</p>
    </div>
  </div>

</div>

<script>
function toggleVoiceIntake() {
  var btn = document.getElementById('micBtn');
  var status = document.getElementById('voiceStatus');
  var output = document.getElementById('ledOutput');
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { status.textContent = 'Voice not supported.'; return; }
  
  var recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';
  
  status.textContent = 'Listening... Speak now!';
  output.textContent = 'LISTENING...';
  recognition.start();

  recognition.onresult = function(e) {
    var transcript = e.results[0][0].transcript;
    document.getElementById('promptInput').value = transcript;
    status.textContent = 'Processing...';
    output.textContent = 'PROCESSING...';
    sendToFresh(transcript);
  };

  recognition.onerror = function() {
    status.textContent = 'Mic error. Try again.';
    output.textContent = 'MIC ERROR';
  };
}

function sendToFresh(promptText) {
  fetch('/.netlify/functions/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt: promptText, board_id: '18424728273' })
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById('ledOutput').textContent = data.reply || 'Schwing! Logged! ⚡';
    document.getElementById('voiceStatus').textContent = 'Tap button to speak to Fresh';
  })
  .catch(err => {
    document.getElementById('ledOutput').textContent = 'Schwing! Logged! ⚡';
    document.getElementById('voiceStatus').textContent = 'Tap button to speak to Fresh';
  });
}

function openDrawer(name) {
  document.getElementById('drawerTitle').innerHTML = '<i class="fa-solid fa-folder-open text-blue-400"></i> ' + name + ' Drawer';
  document.getElementById('drawerContent').innerHTML = '<div class="p-4 bg-gray-900 rounded-xl border border-gray-800"><p class="font-bold text-white mb-1">Drawer Active: ' + name + '</p><p class="text-gray-400">Tap the in-card button above to add notes or updates directly.</p></div>';
  document.getElementById('drawerModal').classList.remove('hidden');
}

function closeDrawer() {
  document.getElementById('drawerModal').classList.add('hidden');
}

function triggerOnboarding() {
  document.getElementById('ledOutput').textContent = 'BUILDING PERSONAL WORLD...';
  sendToFresh('Build my personal world onboarding setup');
}
</script>
</body>
</html>
