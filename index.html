<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fresh TappyThing — Digital Coordinator</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #05070e; color: #f3f4f6; }
.tapulator-face { background: linear-gradient(180deg, #0f172a 0%, #090d16 100%); border: 2px solid #1e293b; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9); }
.led-display { background: #020617; border: 1px solid #1e293b; font-family: 'Courier New', Courier, monospace; box-shadow: inset 0 2px 8px rgba(0,0,0,0.8); }
.key-primary { background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%); border: 1px solid #3b82f6; box-shadow: 0 4px 14px rgba(29, 78, 216, 0.4); cursor: pointer; }
.key-primary:active { transform: scale(0.98); }
.key-secondary { background: #1e293b; border: 1px solid #334155; box-shadow: 0 2px 6px rgba(0,0,0,0.4); cursor: pointer; }
.key-secondary:hover { background: #273549; }
.key-accent { background: linear-gradient(135deg, #0f766e 0%, #115e59 100%); border: 1px solid #14b8a6; cursor: pointer; }
.key-pinball { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); border: 1px solid #8b5cf6; box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4); cursor: pointer; }
.key-proposal { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); border: 1px solid #38bdf8; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4); cursor: pointer; }
@keyframes pulse-red {
  0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
  100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}
.mic-pulsing { animation: pulse-red 1.5s infinite; background-color: #dc2626 !important; color: #ffffff !important; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 pb-28 relative">

<!-- MASTER COMMAND HUB -->
<div id="masterHubContainer" class="max-w-md w-full tapulator-face rounded-3xl p-5 relative space-y-4 shadow-2xl my-auto">
  <div class="flex justify-between items-center border-b border-slate-800/80 pb-2.5">
    <div class="text-[10px] font-black text-blue-400 uppercase tracking-widest flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      FRESH TAPPYTHING COMMAND HUB
    </div>
  </div>

  <div class="text-center">

    <h1 class="text-xl font-black text-white tracking-tight">FRESH TAPPYTHING</h1>
    <p class="text-[11px] text-gray-400 font-medium">Digital Coordinator • Aerus Timonium</p>

  <div class="led-display rounded-2xl p-3.5 text-center border border-blue-900/50 min-h-[64px] flex items-center justify-center">
    <div id="ledOutput" class="text-xs font-bold text-emerald-400 tracking-wide transition-all">POCKET CHIEF OF STAFF READY ⚡</div>
  </div>

  <button type="button" onclick="openFeaturesModal()" class="w-full bg-slate-900/90 hover:bg-slate-800 text-slate-300 font-semibold py-1.5 rounded-xl text-[11px] border border-slate-700/60 uppercase tracking-wider transition flex items-center justify-center gap-1.5">

          <span>1. Castle 🏰</span>
        </div>
        <div class="text-[11px] text-blue-200 mt-0.5">Personal, Family, Bills &amp; Strategy</div>
      </div>
      <i class="fa-solid fa-chevron-right text-blue-300 text-sm"></i>
    </button>

    <div class="grid grid-cols-5 gap-2.5">

            <i class="fa-solid fa-crown text-amber-500"></i>
          </div>
          <div class="text-[10px] text-gray-400 font-medium mt-0.5">Bench Repairs &amp; Ops</div>
        </div>
        <div class="text-[9px] text-amber-300/80 bg-amber-950/40 px-2 py-0.5 rounded border border-amber-800/40 inline-block w-fit">🛠 Workbench &amp; Ready Wall</div>
      </button>
      <button type="button" onclick="openDrawer('Pipeline')" class="key-accent col-span-2 rounded-2xl p-3 text-left transition flex flex-col justify-between min-h-[85px] shadow-sm">
        <div class="text-xs font-black text-teal-200 uppercase tracking-wide flex items-center justify-between">
          <span>3. Pipeline 🚀</span>
          <i class="fa-solid fa-rocket text-teal-400"></i>
        </div>
        <div class="text-[10px] text-teal-100 font-medium">Leads &amp; Intakes</div>
      </button>
    </div>

    <div class="grid grid-cols-3 gap-2">
      <button type="button" onclick="openDrawer('Calendar')" class="key-secondary rounded-xl p-2.5 text-left transition space-y-1">
        <div class="text-[11px] font-bold text-blue-400 flex items-center justify-between">
          <span>4. Calendar 📅</span>
          <i class="fa-solid fa-calendar-day text-gray-500 text-xs"></i>
        </div>
        <div class="text-[9px] text-gray-400">Today's Agenda</div>
      </button>
      <button type="button" onclick="openDrawer('Vault')" class="key-secondary rounded-xl p-2.5 text-left transition space-y-1">

          <i class="fa-solid fa-share-nodes text-gray-500 text-xs"></i>
        </div>
        <div class="text-[9px] text-gray-400">22.2k Records</div>
      </button>
      <button type="button" onclick="openDrawer('Pinball')" class="key-pinball rounded-xl p-2.5 text-left transition space-y-1">
        <div class="text-[11px] font-bold text-purple-200 flex items-center justify-between">
          <span>6. Pinball 🎯</span>
          <i class="fa-solid fa-bolt text-yellow-400 text-xs"></i>
        </div>
        <div class="text-[9px] text-purple-200/80">Action Queue</div>
      </button>
    </div>

      <div>
        <div class="text-xs font-black text-white uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-bullseye text-sky-200"></i>
          <span>7. Closing Tools 🎯</span>
        </div>
        <div class="text-[10px] text-sky-100 mt-0.5">Universal
