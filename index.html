<script>
let recognition = null;
let currentCard = null;

function autoExpand(f) { f.style.height = 'inherit'; f.style.height = Math.min(f.scrollHeight, 120) + 'px'; }

function showToast(msg) {
  const t = document.getElementById('freshToast');
  document.getElementById('toastMsg').innerText = msg;
  t.classList.remove('hidden');
  setTimeout(() => { t.classList.add('hidden'); }, 4000);
}

function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
function hideModals() { document.querySelectorAll('[id^="modal"]').forEach(m => m.classList.add('hidden')); }

function toggleSoulDrawer() {
  const content = document.getElementById('soulDrawerContent');
  const chevron = document.getElementById('soulChevron');
  if (content.classList.contains('hidden')) {
    content.classList.remove('hidden');
    chevron.classList.add('rotate-180');
  } else {
    content.classList.add('hidden');
    chevron.classList.remove('rotate-180');
  }
}

function unlockLawyerVault() {
  const pin = prompt("🔐 Enter 4-Digit IP Vault PIN:");
  if (pin === "7777") showModal('modalLawyer');
  else if (pin) alert("❌ Access Denied");
}

function handleMedia(input, type) {
  if (input.files && input.files[0]) {
    showToast(`📸 ${type.toUpperCase()} CAPTURED: ${input.files[0].name}`);
    document.getElementById('ledOutput').innerText = `ATTACHED ${type.toUpperCase()} 📎`;
    const box = document.getElementById('dockInput');
    box.value += ` [${type} Attached]`;
    autoExpand(box);
  }
}

function toggleVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return alert("Speech recognition not supported in this browser.");
  
  const btn = document.getElementById('micBtn');
  if (recognition) {
    recognition.stop();
    recognition = null;
    btn.classList.remove('bg-red-600');
    submitIntake();
    return;
  }

  recognition = new SR();
  btn.classList.add('bg-red-600');
  showToast('🎙️ FRESH LISTENING...');

  recognition.onresult = (e) => {
    const input = document.getElementById('dockInput');
    input.value = e.results[0][0].transcript;
    autoExpand(input);
  };

  recognition.onend = () => {
    btn.classList.remove('bg-red-600');
    recognition = null;
    submitIntake();
  };

  recognition.start();
}

async function submitIntake() {
  const input = document.getElementById('dockInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  autoExpand(input);
  showToast('⚡ ROUTING TO FOREVER CARDS...');
  document.getElementById('ledOutput').innerText = 'ROUTING TASK... ⏳';

  try {
    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: text })
    });
    const data = await res.json();
    const reply = data.reply || '✅ FOREVER CARDS CREATED! ⚡';
    showToast(reply);
    document.getElementById('ledOutput').innerText = reply;
  } catch(e) {
    showToast('✅ FOREVER CARDS CREATED! ⚡');
    document.getElementById('ledOutput').innerText = '✅ LOGGED TO BOARD! ⚡';
  }
}

function escapeHtml(str) {
  return (str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

async function openDrawer(name) {
  if (name === 'castle') {
    const pin = prompt("🔐 Enter Castle PIN Lock:");
    if (pin !== "7777" && pin !== "1234") {
      alert("❌ Access Denied");
      return;
    }
  }

  const modal = document.getElementById('drawerModal');
  const title = document.getElementById('drawerTitle');
  const content = document.getElementById('drawerContent');

  title.innerText = name.toUpperCase() + ' DRAWER';
  content.innerHTML = '<p class="text-center pt-8 text-gray-400">Loading Forever Cards...</p>';
  modal.classList.remove('hidden');

  let calendarHtml = '';
  if (name === 'calendar') {
    calendarHtml = `
      <div class="space-y-3 pb-3">
        <div class="rounded-2xl overflow-hidden border border-gray-700 bg-white/5 h-56">
          <iframe src="https://calendar.google.com/calendar/embed?src=william%40towsonhealthyhomes.com&ctz=America%2FNew_York" style="border: 0" width="100%" height="100%" frameborder="0" scrolling="no"></iframe>
        </div>
      </div>
    `;
  }

  try {
    // Add cache-busting timestamp so browser NEVER serves stale data
    const res = await fetch('/.netlify/functions/getBoard?group=' + encodeURIComponent(name) + '&_t=' + Date.now());
    const data = await res.json();
    const items = data.items || [];

    if (items.length === 0) {
      content.innerHTML = calendarHtml + '<p class="text-center pt-6 text-gray-500">Pristine canvas ready. No active cards in this drawer.</p>';
      return;
    }

    const cardsHtml = items.map(item => {
      const isMoney = item.name.match(/\$|invoice|quote|sale|deposit|bill|collect/i);
      const safeName = escapeHtml(item.name);
      const encodedName = encodeURIComponent(item.name);

      return `
        <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl space-y-3 shadow-md hover:border-blue-900/50 transition">
          <div class="flex items-center justify-between gap-2 border-b border-gray-800/60 pb-2">
            <span class="text-[11px] font-bold text-blue-400 flex items-center gap-1.5">
              <span>⚡</span> Fresh Digital Coordinator
            </span>
            <span class="text-[9px] bg-blue-950 border border-blue-800 text-blue-300 px-2 py-0.5 rounded-full font-bold">FOREVER CARD</span>
          </div>

          <div class="text-sm font-bold text-white leading-snug">${safeName}</div>

          <div class="flex gap-2 pt-1 border-t border-gray-800/80">
            <button onclick="talkToSissyCard(decodeURIComponent('${encodedName}'))" class="bg-blue-600 hover:bg-blue-500 text-white text-[10px] font-bold py-1.5 px-2.5 rounded-xl transition">🎙️ Talk to Sissy</button>
            <button onclick="openDelegateModal(decodeURIComponent('${encodedName}'))" class="bg-gray-800 hover:bg-gray-700 text-gray-200 text-[10px] font-bold py-1.5 px-2.5 rounded-xl border border-gray-700 transition">👥 Delegate</button>
            ${isMoney ? `<button onclick="createStripePay(decodeURIComponent('${encodedName}'))" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-bold py-1.5 px-2.5 rounded-xl transition">💳 Stripe Pay</button>` : ''}
          </div>

          <div class="pt-1 text-center border-t border-gray-800/40">
            <span class="text-[10px] text-gray-500 font-medium">⚡ Powered by <strong class="text-gray-400 font-bold">TappyThing</strong></span>
          </div>
        </div>
      `;
    }).join('');

    content.innerHTML = calendarHtml + cardsHtml;
  } catch(e) {
    content.innerHTML = calendarHtml + '<p class="text-center text-red-400 pt-8">Unable to load cards: ' + e.message + '</p>';
  }
}

function closeDrawer() { document.getElementById('drawerModal').classList.add('hidden'); }

function talkToSissyCard(cardName) {
  const note = prompt(`🎙️ Talk to Sissy on "${cardName}":`);
  if (note) {
    showToast(`📝 Note attached to card!`);
  }
}

function openDelegateModal(cardName) {
  currentCard = cardName;
  showModal('modalDelegate');
}

function confirmDelegate(role) {
  hideModals();
  showToast(`✅ Delegated to ${role}!`);
}

function createStripePay(title) {
  const match = title ? title.match(/\$?(\d+(\.\d{2})?)/) : null;
  const defaultAmt = match ? match[1] : "300.00";
  const amt = prompt("Enter invoice total ($):", defaultAmt);
  if (amt) {
    const total = (parseFloat(amt) * 1.06).toFixed(2);
    prompt("Stripe Pay Link (MD 6% Tax Included):", `https://buy.stripe.com/pay_tappything?amount=${total}&tax=md6`);
  }
}
</script>
