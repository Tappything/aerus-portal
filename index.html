<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TappyThing — Aerus Home Wellness</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #E0E0E0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 28px 20px;
    }
    header {
      text-align: center;
      margin-bottom: 28px;
    }
    .gold-badge {
      font-size: 52px;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 4px;
    }
    p.subtitle {
      font-size: 13px;
      color: #888888;
      letter-spacing: 1px;
    }
    .main-card {
      background-color: #1E1E1E;
      border: 1px solid #2E2E2E;
      border-radius: 18px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      margin-bottom: 16px;
    }
    textarea {
      width: 100%;
      height: 100px;
      background-color: #2A2A2A;
      border: 1px solid #3A3A3A;
      border-radius: 12px;
      color: #FFFFFF;
      padding: 12px;
      font-size: 15px;
      resize: none;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus {
      border-color: #FFD700;
    }
    textarea::placeholder {
      color: #555555;
    }
    .btn-action {
      width: 100%;
      background-color: #FFD700;
      color: #121212;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-action:hover {
      background-color: #FFE033;
      transform: translateY(-1px);
    }
    .btn-action:active {
      transform: translateY(0);
    }
    .response-area {
      margin-top: 14px;
      background-color: #2A2A2A;
      border: 1px solid #2E2E2E;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      color: #AAAAAA;
      min-height: 52px;
      line-height: 1.6;
    }
    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4CAF50;
      margin-right: 7px;
      vertical-align: middle;
      animation: blink 2s infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 480px;
    }
    .info-card {
      background-color: #1E1E1E;
      border: 1px solid #2E2E2E;
      border-radius: 14px;
      padding: 18px 16px;
      text-align: center;
    }
    .info-card .icon {
      font-size: 22px;
      margin-bottom: 8px;
    }
    .info-card h3 {
      font-size: 13px;
      font-weight: 600;
      color: #FFD700;
      margin-bottom: 4px;
    }
    .info-card p {
      font-size: 11px;
      color: #666666;
    }
    .footer {
      margin-top: 28px;
      font-size: 10px;
      color: #2E2E2E;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <header>
    <div class="gold-badge">🏆</div>
    <h1>TappyThing</h1>
    <p class="subtitle">Digital Coordinator — Aerus Home Wellness</p>
  </header>

  <div class="main-card">
    <textarea id="promptInput" placeholder="Type your intake here..."></textarea>
    <button class="btn-action" onclick="sendToFresh()">⚡ Send to Coordinator</button>
    <div class="response-area" id="freshReply">
      <span class="status-dot"></span>Fresh is ready for intake...
    </div>
  </div>

  <div class="card-grid">
    <div class="info-card">
      <div class="icon">📋</div>
      <h3>Intakes</h3>
      <p>Voice / Text Queue</p>
    </div>
    <div class="info-card">
      <div class="icon">🔧</div>
      <h3>Bench Repairs</h3>
      <p>Workiz Sync</p>
    </div>
    <div class="info-card">
      <div class="icon">🚗</div>
      <h3>Field Tasks</h3>
      <p>Diagnostics & Deliveries</p>
    </div>
    <div class="info-card">
      <div class="icon">📊</div>
      <h3>Command Hub</h3>
      <p>Monday Board Live</p>
    </div>
  </div>

  <div class="footer">Powered by TappyThing</div>

  <script>
    var lastReply = '';

    function sendToFresh() {
      var prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) return;

      var replyEl = document.getElementById('freshReply');
      replyEl.textContent = '⏳ Fresh is thinking...';

      // 1. Gemini Chat AI Engine
      fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: prompt })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        lastReply = data.reply || 'Fresh had nothing to say!';
        replyEl.textContent = lastReply;
      })
      .catch(function(err) {
        replyEl.textContent = 'Error communicating with Fresh.';
      });

      // 2. Make.com Webhook Pipeline Trigger
      fetch('https://hook.us2.make.com/nubq7q917ondi9xh88wggb250jwk7af1', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ body: prompt })
      }).catch(function(e) { console.log('Webhook error:', e); });

      document.getElementById('promptInput').value = '';
    }
  </script>

</body>
</html>
