<!-- TAPPYTHING SAFE SINGLE-BATCH UPDATE -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
  // 1. SECURE BACKEND ROUTING (NO KEYS IN CLIENT CODE)
  async function pushToMonday(cardData) {
    // Routes safely through existing backend handler
    if (typeof sendToFresh === "function") {
      await sendToFresh(cardData);
    } else {
      console.log("Card sent securely to backend handler:", cardData);
    }
  }

  // 2. 1-TAP QR SHARE SCRIPT
  function shareCard(cardId) {
    const shareUrl = window.location.origin + window.location.pathname + "?card=" + cardId;
    const qrContainer = document.getElementById("qr-modal");
    if (qrContainer) {
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, shareUrl);
      document.getElementById("share-modal").style.display = "block";
    }
  }
</script>
