<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TappyThing Forever Card™ v3.4</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen pb-12 flex flex-col items-center p-3 sm:p-4">

  <!-- TOP CARD HEADER -->
  <header class="w-full max-w-md glass rounded-2xl p-3.5 mb-3 flex items-center justify-between border-b border-cyan-500/30">
    <div class="flex items-center gap-3">
      <!-- COMPACT PHOTO THUMBNAIL -->
      <div onclick="document.getElementById('camera-input').click()" class="w-12 h-12 bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl flex items-center justify-center cursor-pointer overflow-hidden shrink-0 relative">
        <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handlePhoto(event)">
        <span id="photo-icon" class="text-lg">📷</span>
        <img id="passport-img" class="hidden absolute inset-0 w-full h-full object-cover">
      </div>
      <div>
        <div class="text-[10px] uppercase tracking-widest text-cyan-400 font-bold">TAPPYTHING FOREVER CARD™</div>
        <h1 id="header-customer-name" class="text-sm font-extrabold text-white truncate max-w-[180px]">Select Customer...</h1>
        <p id="header-customer-phone" class="text-[11px] text-slate-400">No active appointment selected</p>
      </div>
    </div>
    <div class="text-right">
      <span id="ticket-id-tag" class="text-[10px] font-mono bg-cyan-950 text-cyan-300 border border-cyan-700/50 px-2 py-0.5 rounded-md">#TT-88492</span>
      <div id="status-badge" class="mt-1 text-[10px] uppercase font-black tracking-widest text-emerald-400">1. INTAKE</div>
    </div>
  </header>

  <!-- MASTER VOICE BUTTON & CALENDAR SYNC -->
  <div class="w-full max-w-md mb-3 space-y-2">
    <button onclick="startVoiceDictation()" id="master-voice-btn" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-slate-950 font-black text-sm rounded-xl shadow-xl flex items-center justify-center gap-2 transition transform active:scale-95">
      <span id="mic-pulse" class="w-2.5 h-2.5 rounded-full bg-slate-950"></span>
      <span id="mic-btn-text">🎙️ TALK TO FRESH (VOICE INTAKE)</span>
    </button>
    <button onclick="syncGoogleCalendar()" class="w-full py-2 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-cyan-400 text-xs font-bold rounded-lg flex items-center justify-center gap-2">
      📅 Sync Appointment to Google Calendar
    </button>
  </div>

  <!-- PIPELINE NAVIGATION TABS -->
  <div class="w-full max-w-md flex bg-slate-900/90 p-1 rounded-xl mb-3 border border-slate-800 text-xs text-center font-bold">
    <button onclick="switchStage(1)" id="tab-1" class="flex-1 py-2 rounded-lg bg-cyan-600 text-white">1. Intake</button>
    <button onclick="switchStage(2)" id="tab-2" class="flex-1 py-2 rounded-lg text-slate-400">2. Bench</button>
    <button onclick="switchStage(3)" id="tab-3" class="flex-1 py-2 rounded-lg text-slate-400">3. Pay</button>
    <button onclick="switchStage(4)" id="tab-4" class="flex-1 py-2 rounded-lg text-slate-400">4. Ready 🧱</button>
  </div>

  <!-- MAIN STAGE CONTAINER -->
  <main class="w-full max-w-md">

    <!-- STAGE 1: INTAKE -->
    <section id="stage-1" class="glass rounded-2xl p-4 space-y-3.5">
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">Customer Search (22,283 Vault)</label>
        <input type="text" id="vault-search" placeholder="Type customer name (e.g. Ruth Tucker or Johnson)..." oninput="searchVault()" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-cyan-500">
        <div id="vault-results" class="hidden bg-slate-950 border border-slate-800 rounded-lg mt-1 max-h-48 overflow-y-auto divide-y divide-slate-800"></div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">Voice Intake Note / Diagnostic Canvas</label>
        <textarea id="symptom-note" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white" placeholder="Speak or type service details here..."></textarea>
      </div>

      <button onclick="switchStage(2)" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl shadow-lg transition">Send to Workbench ➔</button>
    </section>

    <!-- STAGE 2: WORKBENCH ESTIMATE BUILDER -->
    <section id="stage-2" class="glass rounded-2xl p-4 space-y-3.5 hidden">
      <div class="flex justify-between items-center">
        <h3 class="text-xs uppercase font-extrabold text-cyan-400">Estimate Builder</h3>
        <span id="workbench-total" class="text-base font-black text-emerald-400">$0.00</span>
      </div>

      <!-- LIVE CATALOG SEARCH (SEARCH "BAGS", FILTERS, MOTORS) -->
      <div>
        <label class="block text-[11px] font-bold text-slate-400 mb-1">Search 1,090 Catalog Parts (Type "bags")</label>
        <input type="text" id="catalog-search" placeholder="Type bags, filters, labor..." oninput="searchCatalog()" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-cyan-500">
        <div id="catalog-results" class="hidden bg-slate-950 border border-slate-800 rounded-lg mt-1 max-h-36 overflow-y-auto divide-y divide-slate-800"></div>
      </div>

      <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 space-y-2">
        <label class="block text-[11px] font-bold text-slate-400">Add Custom Item / Service</label>
        <div class="flex gap-2">
          <input type="text" id="custom-item-name" placeholder="Item Name (e.g. Overhaul)" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-white">
          <input type="number" id="custom-item-price" placeholder="$ Amount" class="w-20 bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-white">
          <button onclick="addCustomItem()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-3 py-1.5 rounded-lg text-xs">+ Add</button>
        </div>
      </div>

      <div id="items-list" class="space-y-1.5 max-h-36 overflow-y-auto bg-slate-950/60 p-2 rounded-lg border border-slate-800">
        <p class="text-xs text-slate-500 text-center py-2">No line items added yet.</p>
      </div>

      <button onclick="switchStage(3)" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl shadow-lg transition">Push Estimate to Stripe ➔</button>
    </section>

    <!-- STAGE 3: STRIPE PAY -->
    <section id="stage-3" class="glass rounded-2xl p-4 space-y-4 hidden">
      <div class="border-b border-slate-800 pb-3">
        <h3 class="text-xs uppercase text-slate-400 font-bold">Approved Service Quote Summary</h3>
        <div id="pay-summary" class="mt-2 space-y-1 text-sm"></div>
        <div class="mt-3 flex justify-between items-center text-base font-extrabold text-white">
          <span>Total Amount:</span>
          <span id="pay-total-display" class="text-emerald-400">$0.00</span>
        </div>
      </div>

      <button onclick="simulateStripe()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold rounded-xl shadow-lg flex items-center justify-center gap-2">
        🚀 Authorize & Send Stripe Checkout Link
      </button>

      <button onclick="switchStage(4)" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-slate-300 font-bold rounded-xl border border-slate-700">Payment Confirmed ➔ Ready Wall 🧱</button>
    </section>

    <!-- STAGE 4: READY WALL 🧱 -->
    <section id="stage-4" class="glass rounded-2xl p-4 space-y-4 hidden text-center">
      <div class="inline-block px-3 py-1 bg-emerald-950 border border-emerald-600 text-emerald-400 rounded-full text-xs font-bold">
        🟢 PAID & STAGED
      </div>

      <div class="text-left bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
        <label class="block text-xs font-bold text-slate-300">Staging Location</label>
        <select id="staging-bay" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white">
          <option>Front Counter Staging</option>
          <option>Main Bench Storage</option>
          <option>Ready For Delivery</option>
        </select>
      </div>

      <button onclick="completeJob()" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-black text-base rounded-xl shadow-xl transition transform active:scale-95">
        🏁 Mark Complete & Fulfilled
      </button>
    </section>

  </main>

  <script>
    const customerVault = [
      { name: "Ruth Tucker", phone: "4102566949", address: "6 Lagan Ct Nottingham, MD" },
      { name: "Margueriete Villasanta", phone: "4105550192", address: "Timonium, MD" },
      { name: "Sue Johnson", phone: "4437172476", address: "3700 Greenmount Ave Baltimore, MD" },
      { name: "Josephine Johnson", phone: "4438414644", address: "10145 Falls Rd Timonium, MD" }
    ];

    const catalogItems = [
      { name: "9 Pk. Clean Obsessed CO6 HEPA Bags", price: 20.00 },
      { name: "Off Brand Kirby Bags", price: 6.00 },
      { name: "After Bag Carbon Filter- Type R 2PK", price: 24.99 },
      { name: "Plastic Bag-Logo", price: 1.99 },
      { name: "Full Bag Control-REN", price: 49.99 },
      { name: "Standard Service Labor", price: 85.00 },
      { name: "Motor Replacement Part", price: 45.00 }
    ];

    let currentItems = [];

    function syncGoogleCalendar() {
      const name = document.getElementById('header-customer-name').innerText;
      const details = document.getElementById('symptom-note').value || 'Service Appointment';
      const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(name + ' - Service Stop')}&details=${encodeURIComponent(details)}`;
      window.open(gcalUrl, '_blank');
    }

    function searchCatalog() {
      const q = document.getElementById('catalog-search').value.toLowerCase().trim();
      const resBox = document.getElementById('catalog-results');
      if (!q) { resBox.classList.add('hidden'); return; }

      let matches = catalogItems.filter(i => i.name.toLowerCase().includes(q));
      if (matches.length === 0) {
        resBox.innerHTML = `<div class="p-2 text-xs text-slate-500">No parts found matching "${q}"</div>`;
      } else {
        resBox.innerHTML = matches.map(i => `
          <div onclick="addLabor('${i.name.replace(/'/g, "\\'")}', ${i.price})" class="p-2 hover:bg-slate-900 cursor-pointer text-xs flex justify-between items-center">
            <span class="text-white">${i.name}</span>
            <span class="font-bold text-emerald-400">$${i.price.toFixed(2)}</span>
          </div>
        `).join('');
      }
      resBox.classList.remove('hidden');
    }

    function startVoiceDictation() {
      const btnText = document.getElementById('mic-btn-text');
      const pulse = document.getElementById('mic-pulse');
      
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("Voice recognition is not supported on this browser.");
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = function() {
        btnText.innerText = "LISTENING... SPEAK NOW";
        pulse.classList.add('animate-ping');
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('symptom-note').value = transcript;
        btnText.innerText = "🎙️ TALK TO FRESH (VOICE INTAKE)";
        pulse.classList.remove('animate-ping');
      };

      recognition.onerror = function() {
        btnText.innerText = "🎙️ TALK TO FRESH (VOICE INTAKE)";
        pulse.classList.remove('animate-ping');
      };

      recognition.start();
    }

    function searchVault() {
      const q = document.getElementById('vault-search').value.toLowerCase().trim();
      const resBox = document.getElementById('vault-results');
      if (!q) { resBox.classList.add('hidden'); return; }

      let matches = customerVault.filter(c => c.name.toLowerCase().includes(q) || c.phone.includes(q));

      let html = matches.map(c => `
        <div onclick="selectCustomer('${c.name}', '${c.phone}')" class="p-2 hover:bg-slate-900 cursor-pointer text-xs">
          <div class="font-bold text-white">${c.name}</div>
          <div class="text-slate-400 text-[10px]">${c.phone} • ${c.address}</div>
        </div>
      `).join('');

      resBox.innerHTML = html;
      resBox.classList.remove('hidden');
    }

    function selectCustomer(name, phone) {
      document.getElementById('header-customer-name').innerText = name;
      document.getElementById('header-customer-phone').innerText = phone;
      document.getElementById('vault-results').classList.add('hidden');
      document.getElementById('vault-search').value = name;
    }

    function handlePhoto(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const img = document.getElementById('passport-img');
          img.src = evt.target.result;
          img.classList.remove('hidden');
          document.getElementById('photo-icon').classList.add('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function switchStage(stageNum) {
      [1, 2, 3, 4].forEach(s => {
        document.getElementById(`stage-${s}`).classList.add('hidden');
        const tab = document.getElementById(`tab-${s}`);
        tab.className = "flex-1 py-2 rounded-lg text-slate-400 font-bold";
      });
      document.getElementById(`stage-${stageNum}`).classList.remove('hidden');
      const activeTab = document.getElementById(`tab-${stageNum}`);
      activeTab.className = "flex-1 py-2 rounded-lg bg-cyan-600 text-white font-bold";
      
      const badge = document.getElementById('status-badge');
      const stages = ["1. INTAKE", "2. BENCH", "3. PAY", "4. READY 🧱"];
      badge.innerText = stages[stageNum - 1];
    }

    function addLabor(item, price) {
      currentItems.push({ item, price });
      renderItems();
      document.getElementById('catalog-results').classList.add('hidden');
    }

    function addCustomItem() {
      const nameInput = document.getElementById('custom-item-name');
      const priceInput = document.getElementById('custom-item-price');
      const name = nameInput.value.trim();
      const price = parseFloat(priceInput.value);

      if (!name || isNaN(price)) {
        alert("Please enter item name and dollar amount.");
        return;
      }

      currentItems.push({ item: name, price: price });
      renderItems();
      nameInput.value = '';
      priceInput.value = '';
    }

    function renderItems() {
      const box = document.getElementById('items-list');
      const payBox = document.getElementById('pay-summary');
      let total = 0;
      if (currentItems.length === 0) {
        box.innerHTML = `<p class="text-xs text-slate-500 text-center py-2">No line items added yet.</p>`;
        payBox.innerHTML = `<p class="text-xs text-slate-500">No line items.</p>`;
      } else {
        box.innerHTML = currentItems.map(i => `
          <div class="flex justify-between items-center text-xs bg-slate-900 p-2 rounded border border-slate-800">
            <span class="text-slate-200">${i.item}</span>
            <span class="font-bold text-emerald-400">$${i.price.toFixed(2)}</span>
          </div>
        `).join('');
        payBox.innerHTML = currentItems.map(i => `
          <div class="flex justify-between text-xs text-slate-300 py-0.5">
            <span>${i.item}</span>
            <span class="font-mono text-emerald-400">$${i.price.toFixed(2)}</span>
          </div>
        `).join('');
        total = currentItems.reduce((acc, curr) => acc + curr.price, 0);
      }
      document.getElementById('workbench-total').innerText = `$${total.toFixed(2)}`;
      document.getElementById('pay-total-display').innerText = `$${total.toFixed(2)}`;
    }

    function simulateStripe() {
      alert("🚀 Stripe Payment Link Generated & Sent to Customer!");
      switchStage(4);
    }

    function completeJob() {
      confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
      alert("🏁 Job Staged on Ready Wall!");
    }
  </script>
</body>
</html>
