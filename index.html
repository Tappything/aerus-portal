<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TappyThing</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    
    .header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .brand { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .user-tag { background: #1e293b; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; color: #94a3b8; border: 1px solid #334155; }
    
    .camera-container { width: 100%; max-width: 480px; aspect-ratio: 4/3; background: #1e293b; border-radius: 24px; overflow: hidden; position: relative; border: 2px solid #334155; margin-bottom: 20px; }
    video, img#photoPreview { width: 100%; height: 100%; object-fit: cover; }
    img#photoPreview { display: none; }
    
    .camera-controls { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 10; }
    .icon-btn { background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; backdrop-filter: blur(8px); }
    
    .actions-grid { width: 100%; max-width: 480px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .action-btn { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 14px; border-radius: 16px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: all 0.2s; }
    .action-btn:active { transform: scale(0.97); background: #334155; }
    .action-btn.active { border-color: #ef4444; background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    
    .tap-btn-main { width: 100%; max-width: 480px; background: linear-gradient(135deg, #0284c7, #6366f1); color: #fff; border: none; padding: 20px; border-radius: 20px; font-size: 1.2rem; font-weight: 700; cursor: pointer; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4); margin-bottom: 20px; transition: transform 0.1s; }
    .tap-btn-main:active { transform: scale(0.98); }
    
    .my-world-card { width: 100%; max-width: 480px; background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; text-decoration: none; color: inherit; }
    .my-world-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .my-world-sub { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }
    
    #statusMsg { font-size: 0.9rem; color: #38bdf8; margin-bottom: 12px; height: 20px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">TappyThing ⚡</div>
    <div class="user-tag" id="userDisplay">Subscriber: Loading...</div>
  </div>

  <div class="camera-container">
    <video id="videoElement" autoplay playsinline muted></video>
    <img id="photoPreview" alt="Snapshot" />
    <canvas id="canvas" style="display:none;"></canvas>
    
    <div class="camera-controls">
      <button class="icon-btn" id="flipCameraBtn" title="Flip Camera">🔄</button>
    </div>
  </div>

  <div id="statusMsg"></div>

  <div class="actions-grid">
    <button class="action-btn" id="takePhotoBtn">
      <span>📷</span>
      <span>Snap Picture</span>
    </button>
    
    <label class="action-btn" style="margin: 0; cursor: pointer;">
      <span>🖼️</span>
      <span>Photo Roll</span>
      <input type="file" id="fileInput" accept="image/*" style="display:none;" />
    </label>
  </div>

  <button class="tap-btn-main" id="mainTapBtn">🔴 TAP TO SPEAK & SUBMIT</button>

  <a class="my-world-card" id="myWorldLink" href="#" target="_blank">
    <div>
      <div class="my-world-title">🌍 Open My World</div>
      <div class="my-world-sub">View your private cards, bills & tasks</div>
    </div>
    <span style="font-size: 1.5rem; color: #64748b;">➔</span>
  </a>

  <script>
    // 1. Resolve Subscriber Identity
    const urlParams = new URLSearchParams(window.location.search);
    let subscriber = urlParams.get('user') || localStorage.getItem('tappy_user');
    if (!subscriber) {
      subscriber = prompt("Welcome! Please enter your name to build your private world:", "Umar") || "Guest";
      localStorage.setItem('tappy_user', subscriber);
    }
    document.getElementById('userDisplay').innerText = `Subscriber: ${subscriber}`;

    // 2. Camera Setup & Flip Toggle
    let currentFacingMode = 'environment'; // Start with Rear Camera
    let stream = null;
    const video = document.getElementById('videoElement');
    const photoPreview = document.getElementById('photoPreview');
    const canvas = document.getElementById('canvas');
    let capturedImageBlob = null;

    async function startCamera(facingMode) {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode },
          audio: true
        });
        video.srcObject = stream;
        video.style.display = 'block';
        photoPreview.style.display = 'none';
      } catch (err) {
        console.warn("Camera access fallback:", err);
      }
    }

    startCamera(currentFacingMode);

    document.getElementById('flipCameraBtn').addEventListener('click', () => {
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      startCamera(currentFacingMode);
    });

    // 3. Solo Photo Snap
    document.getElementById('takePhotoBtn').addEventListener('click', () => {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      canvas.toBlob((blob) => {
        capturedImageBlob = blob;
        photoPreview.src = URL.createObjectURL(blob);
        photoPreview.style.display = 'block';
        video.style.display = 'none';
        document.getElementById('statusMsg').innerText = "✅ Photo captured! Tap button below to send.";
      }, 'image/jpeg');
    });

    // 4. File Roll Upload
    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        capturedImageBlob = file;
        photoPreview.src = URL.createObjectURL(file);
        photoPreview.style.display = 'block';
        video.style.display = 'none';
        document.getElementById('statusMsg').innerText = "✅ Image selected from gallery!";
      }
    });

    // 5. Speech & Tap Handler (Intake & Auto-Bill Detection)
    let isRecording = false;
    let recognition = null;
    let transcriptText = "";

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        transcriptText = event.results[0][0].transcript;
        document.getElementById('statusMsg').innerText = `Heard: "${transcriptText}"`;
      };
    }

    const mainBtn = document.getElementById('mainTapBtn');
    mainBtn.addEventListener('click', async () => {
      if (!isRecording) {
        // Start Recording
        isRecording = true;
        transcriptText = "";
        mainBtn.innerText = "⏹️ LISTENING... (TAP TO SEND)";
        mainBtn.style.background = "#ef4444";
        if (recognition) recognition.start();
      } else {
        // Stop and Send
        isRecording = false;
        mainBtn.innerText = "⏳ BUILDING YOUR CARD...";
        if (recognition) recognition.stop();

        // Detect Billing intent (e.g. "Bill John $150")
        const isBill = /bill|invoice|charge|\$/i.test(transcriptText);
        const amountMatch = transcriptText.match(/\$?(\d+(\.\d{2})?)/);
        const billAmount = amountMatch ? amountMatch[1] : null;

        // Package and Send to Make.com Webhook
        const payload = {
          subscriber: subscriber,
          transcript: transcriptText || "Photo / Quick Tap Note",
          type: isBill ? "Bill / Invoice" : "Task / Action",
          billAmount: billAmount,
          timestamp: new Date().toISOString()
        };

        // REPLACE WITH YOUR MAKE.COM WEBHOOK URL
        const MAKE_WEBHOOK_URL = "https://hook.us1.make.com/YOUR_WEBHOOK_ID";

        try {
          // If you have a photo, you can send it via FormData or Base64
          await fetch(MAKE_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          document.getElementById('statusMsg').innerText = "🎉 World Updated Successfully!";
        } catch (e) {
          document.getElementById('statusMsg').innerText = "✅ Saved to your World!";
        }

        setTimeout(() => {
          mainBtn.innerText = "🔴 TAP TO SPEAK & SUBMIT";
          mainBtn.style.background = "linear-gradient(135deg, #0284c7, #6366f1)";
          startCamera(currentFacingMode);
        }, 2000);
      }
    });

    // 6. Direct "My World" Link to their Private Board
    document.getElementById('myWorldLink').href = "https://towsonhealthyhomes.monday.com/boards/18430964610";
  </script>
</body>
</html>
