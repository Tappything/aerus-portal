<!DOCTYPE html>
<html>
<body>
  <h3>Staff Intake Form</h3>
  <form id="intakeForm" onsubmit="event.preventDefault(); sendToWebhook();">
    <input name="name" placeholder="Name" required><br><br>
    <input name="phone" placeholder="Phone" required><br><br>
    <input name="machine" placeholder="Machine" required><br><br>
    <textarea name="desc" placeholder="Issue Description" required></textarea><br><br>
    <button type="submit">Submit Intake</button>
  </form>
  <p id="msg" style="color:green; font-weight:bold;"></p>

  <script>
    async function sendToWebhook() {
      const form = document.getElementById('intakeForm');
      const msg = document.getElementById('msg');
      
      const payload = {
        name: form.name.value,
        phone: form.phone.value,
        machine: form.machine.value,
        desc: form.desc.value
      };

      try {
        const response = await fetch('https://hook.us2.make.com/q6s4cfv1g27xnxx8mn9m1dn889w23vt7', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          msg.innerText = '✅ Submitted!';
          form.reset();
        }
      } catch (err) {
        msg.innerText = '✕ Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
