<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forever Card™ — Powered by TappyThing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body { background-color: #ECE8DF; color: #1E293B; font-family: 'Inter', sans-serif; }
    .physical-card {
      background: #FAF9F5;
      border: 2px solid #D6CEC0;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.12), 0 0 15px rgba(16, 185, 129, 0.08);
    }
    .pulse-record { animation: pulse-mic 1.2s infinite; background-color: #DC2626 !important; }
    @keyframes pulse-mic {
      0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.8); }
      70% { box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6 antialiased">

  <div class="physical-card max-w-4xl w-full rounded-3xl p-5 sm:p-8 space-y-6 relative overflow-hidden">

    <!-- 1. HEADER -->
    <header class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center border-b border-[#E2DACC] pb-5">
      <div class="flex items-center space-x-3 justify-center md:justify-start">
        <div class="text-5xl font-['Great_Vibes'] text-emerald-700 font-bold select-none drop-shadow-sm pr-1">F</div>
        <div>
          <h1 class="text-base font-black tracking-wider text-slate-900 uppercase font-mono">FOREVER CARD<span class="text-emerald-700">™</span></h1>
          <p class="text-[11px] text-slate-500 font-medium">Powered by TappyThing</p>
        </div>
      </div>

      <div class="flex flex-col items-center justify-center space-y-2">
        <div class="w-20 h-20 rounded-full border-2 border-emerald-600 bg-white p-0.5 shadow-md flex items-center justify-center overflow-hidden">
          <img id="freshLogoImg" src="4126.jpg" alt="Fresh Digital Coordinator" class="w-full h-full object-cover rounded-full" onerror="this.onerror=null; this.src='https://via.placeholder.com/150/10B981/FFFFFF?text=FRESH';">
        </div>

        <button id="masterMicBtn" onclick="toggleVoiceDictation()" class="w-12 h-12 bg-slate-900 hover:bg-slate-800 text-white rounded-full flex items-center justify-center shadow-lg border-2 border-slate-700 transition transform active:scale-95" title="Talk to Fresh">
          <i id="micIcon" class="fa-solid fa-microphone text-base"></i>
        </button>
      </div>

      <div class="flex items-center space-x-3 justify-center md:justify-end">
        <div class="text-center md:text-right">
          <div id="displayOrgName" class="text-sm font-black text-slate-900 tracking-wide">Aerus Timonium</div>
          <div class="text-[11px] text-emerald-700 flex items-center justify-center md:justify-end space-x-1 font-mono font-bold">
            <span class="w-2 h-2 rounded-full bg-emerald-600 inline-block animate-ping"></span>
            <span>Live Card Active</span>
          </div>
        </div>
      </div>
    </header>

    <!-- 2. CONTROL BAR: VISUAL CALENDAR & PINBALL MASTER HOPPER -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      
      <!-- SCHEDULE GRID -->
      <div class="bg-[#F3EFE6] border border-[#E2DACC] rounded-2xl p-4 space-y-3 min-h-[200px]">
        <div class="flex items-center justify-between border-b border-[#E2DACC] pb-2">
          <div class="flex items-center space-x-2">
            <i class="fa-solid fa-calendar-days text-blue-700 text-sm"></i>
            <h2 class="text-xs font-bold text-blue-950 uppercase font-mono tracking-wider">Schedule Grid • Today & Tomorrow</h2>
          </div>
          <span class="text-[10px] text-slate-500 font-mono font-bold">Live Grid</span>
        </div>
        
        <div id="calendarGrid" class="space-y-2 text-xs font-mono max-h-52 overflow-y-auto">
          <div id="scheduledItemsSlot" class="space-y-2"></div>
        </div>
      </div>

      <!-- PINBALL ACTION ZONE -->
      <div class="bg-[#F3EFE6] border border-[#E2DACC] rounded-2xl p-4 space-y-3 min-h-[200px]">
        <div class="flex items-center justify-between border-b border-[#E2DACC] pb-2">
          <div class="flex items-center space-x-2">
            <span class="text-sm">🎰</span>
            <h2 class="text-xs font-bold text-amber-950 uppercase font-mono tracking-wider">Pinball • Action Zone</h2>
          </div>
          <span class="text-[10px] text-slate-500 font-mono font-bold">Master Hopper</span>
        </div>
        <div id="pinballActionsList" class="space-y-2 text-xs font-mono max-h-52 overflow-y-auto">
          <div id="pinEmptyState" class="text-slate-400 text-center py-8 italic">Queue clean. Speak to drop active items here!</div>
        </div>
      </div>

    </div>

    <!-- 3. VOICE STREAM DISPLAY -->
    <div class="bg-slate-900 text-white rounded-2xl p-3.5 space-y-1 shadow-inner">
      <div class="flex justify-between items-center text-xs">
        <span class="font-bold text-slate-200 font-mono flex items-center space-x-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span>
          <span>Fresh Voice Stream:</span>
        </span>
        <span id="listeningBadge" class="hidden text-[10px] text-red-400 font-bold animate-pulse font-mono">● LISTENING</span>
      </div>
      <p id="liveTranscriptText" class="text-xs text-slate-300 italic font-mono">"Tap the microphone above to speak..."</p>
    </div>

    <!-- 4. CLEAN 4-STAGE OPERATIONAL DOORS -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <button onclick="openStageDoor(1)" class="bg-white hover:bg-slate-50 border-2 border-blue-200 p-4 rounded-2xl text-center transition shadow-sm space-y-1">
        <div class="text-2xl">📥</div>
        <div class="text-xs font-black text-blue-800">1. Intake & Vault</div>
        <div class="text-[10px] text-slate-500 font-medium">Customer Profile</div>
      </button>

      <button onclick="openStageDoor(2)" class="bg-white hover:bg-slate-50 border-2 border-amber-200 p-4 rounded-2xl text-center transition shadow-sm space-y-1">
        <div class="text-2xl">🛠️</div>
        <div class="text-xs font-black text-amber-800">2. Shop Ops / Bench</div>
        <div class="text-[10px] text-slate-500 font-medium">Repair Canvas</div>
      </button>

      <button onclick="openStageDoor(3)" class="bg-white hover:bg-slate-50 border-2 border-emerald-200 p-4 rounded-2xl text-center transition shadow-sm space-y-1">
        <div class="text-2xl">📄</div>
        <div class="text-xs font-black text-emerald-800">3. Proposal & Pay</div>
        <div class="text-[10px] text-slate-500 font-medium">Live Invoice Builder</div>
      </button>

      <button onclick="openStageDoor(4)" class="bg-white hover:bg-slate-50 border-2 border-purple-200 p-4 rounded-2xl text-center transition shadow-sm space-y-1">
        <div class="text-2xl">🧱</div>
        <div class="text-xs font-black text-purple-800">4. Ready Wall</div>
        <div class="text-[10px] text-slate-500 font-medium">Fulfillment Staging</div>
      </button>
    </div>

    <!-- EXPANDABLE DRAWER -->
    <div id="activeWorkspaceDrawer" class="hidden bg-slate-900 text-white rounded-2xl p-5 space-y-3">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 id="drawerTitle" class="text-sm font-bold text-white">Stage Canvas</h3>
        <button onclick="closeDrawer()" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="drawerBody" class="text-xs text-slate-300"></div>
    </div>

  </div>

  <script>
    let isRecording = false;
    let recognition = null;
    let activeCustomer = null;

    const WEBHOOK_URL = "https://hook.us2.make.com/g6aw7r8759ar5jr5c7ln";

    const vault = [
      { name: "Ruth Tucker", id: "22086", phone: "(410) 256-6949", address: "6 Lagan Ct, Nottingham, MD 21236" },
      { name: "Peg Merrill", id: "11030", phone: "(410) 409-5676", address: "14828 Jarrettsville Pike, Monkton, MD 21111" },
      { name: "Stella Frank", id: "19992", phone: "(410) 555-0188", address: "1999 Royal Rd, Timonium, MD 21093" },
      { name: "Miriam Davis", id: "1017", phone: "(443) 693-2380", address: "1319 Elk Forest Rd, Elkton, MD 21921" },
      { name: "Vivian Fulton", id: "8955", phone: "(410) 532-2985", address: "1613 Burnwood Rd, Baltimore, MD 21239" },
      { name: "William Sullivan", id: "10001", phone: "(410) 499-1313", address: "1965 Greenspring Dr, Timonium, MD 21093" }
    ];

    window.onload = function() {
      setupSpeech();
    };

    function setupSpeech() {
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRec();
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onresult = function(event) {
          const text = event.results[0][0].transcript;
          document.getElementById('liveTranscriptText').innerText = `"${text}"`;
          handleVoiceInput(text);
        };

        recognition.onend = function() { stopDictation(); };
      }
    }

    function toggleVoiceDictation() {
      if (!recognition) return alert('Speech recognition supported in Chrome/Edge.');
      if (!isRecording) startDictation();
      else stopDictation();
    }

    function startDictation() {
      isRecording = true;
      try {
        recognition.start();
        document.getElementById('masterMicBtn').classList.add('pulse-record');
        document.getElementById('listeningBadge').classList.remove('hidden');
        document.getElementById('liveTranscriptText').innerText = "Listening...";
      } catch(e) { console.log(e); }
    }

    function stopDictation() {
      isRecording = false;
      document.getElementById('masterMicBtn').classList.remove('pulse-record');
      document.getElementById('listeningBadge').classList.add('hidden');
    }

    function handleVoiceInput(text) {
      const lower = text.toLowerCase();
      let match = vault.find(c => lower.includes(c.name.toLowerCase().split(' ')[0]));
      
      if (!match) {
        match = { name: text.split(' ')[0] || "Customer Intake", id: "NEW", phone: "(410) 555-0100", address: "Timonium, MD" };
      }
      
      activeCustomer = match;

      // Update Pinball Action Zone
      const pinList = document.getElementById('pinballActionsList');
      const emptyPin = document.getElementById('pinEmptyState');
      if (emptyPin) emptyPin.remove();

      pinList.insertAdjacentHTML('afterbegin', `
        <div class="bg-amber-50 p-3 rounded-xl border border-amber-300 text-amber-950 flex justify-between items-center shadow-sm">
          <div>
            <div class="text-xs font-bold text-amber-900">⚡ Pinball: ${match.name}</div>
            <div class="text-[11px] font-normal text-slate-700 mt-0.5">${text}</div>
          </div>
          <button onclick="openCustomerCard('${match.id}')" class="text-[10px] bg-amber-700 text-white font-bold px-2.5 py-1 rounded-lg hover:bg-amber-800">View Profile</button>
        </div>
      `);

      // Update Schedule Grid
      let timeMatch = text.match(/(\d{1,2}:\d{2}\s*(?:AM|PM|am|pm)?|\d{1,2}\s*(?:AM|PM|am|pm))/i);
      let timeLabel = timeMatch ? timeMatch[0].toUpperCase() : "08:00 AM";

      const calSlot = document.getElementById('scheduledItemsSlot');
      calSlot.insertAdjacentHTML('afterbegin', `
        <div class="p-3 rounded-xl bg-white border border-blue-300 shadow-sm flex items-center justify-between text-slate-800">
          <div>
            <div class="flex items-center space-x-2">
              <span class="text-[10px] bg-blue-700 text-white px-2 py-0.5 rounded font-mono font-bold">${timeLabel}</span>
              <span class="text-xs font-bold text-blue-950">${match.name}</span>
            </div>
            <p class="text-[11px] text-slate-600 mt-1 font-sans">${match.address} • ${match.phone}</p>
          </div>
          <button onclick="openCustomerCard('${match.id}')" class="text-[10px] text-emerald-700 font-mono font-bold bg-emerald-50 px-2 py-1 rounded border border-emerald-200 hover:bg-emerald-100">Synced Cal</button>
        </div>
      `);

      // Send to Webhook
      if (WEBHOOK_URL) {
        fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ transcript: text, customer: match, time: timeLabel })
        }).catch(e => console.error("Webhook error:", e));
      }
    }

    function openCustomerCard(clientId) {
      const match = vault.find(c => c.id === clientId) || activeCustomer;
      if (match) {
        activeCustomer = match;
        openStageDoor(1);
      }
    }

    function openStageDoor(stageNum) {
      const drawer = document.getElementById('activeWorkspaceDrawer');
      const title = document.getElementById('drawerTitle');
      const body = document.getElementById('drawerBody');
      drawer.classList.remove('hidden');

      const cust = activeCustomer || { name: "Select or Speak Customer", id: "N/A", address: "No active card selected", phone: "" };

      if (stageNum === 1) {
        title.innerText = "Stage 1: Intake & Customer Vault";
        body.innerHTML = `
          <div class="p-3 bg-slate-800 rounded-xl space-y-1 border border-slate-700">
            <div class="font-bold text-blue-400 text-sm">${cust.name} (Client #${cust.id})</div>
            <div class="text-slate-300">${cust.address}</div>
            <div class="text-emerald-400 font-mono">${cust.phone}</div>
          </div>
        `;
      } else if (stageNum === 2) {
        title.innerText = "Stage 2: Shop Ops / Bench Canvas";
        body.innerHTML = `
          <div class="p-3 bg-slate-800 rounded-xl space-y-1">
            <div class="font-bold text-amber-400">Customer: ${cust.name}</div>
            <p class="text-slate-300">Intake Diagnostic: Bench Service Requested.</p>
          </div>
        `;
      } else if (stageNum === 3) {
        title.innerText = `Stage 3: Live Proposal for ${cust.name}`;
        body.innerHTML = `
          <div class="p-4 bg-slate-950 rounded-xl space-y-3">
            <div class="flex justify-between text-xs text-slate-300">
              <span>Aerus Water/Air Service Inspection</span>
              <span class="font-mono">$45.00</span>
            </div>
            <button onclick="alert('Stripe Pay Link Dispatched to ' + cust.phone)" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-black py-3 rounded-xl uppercase tracking-wider transition">🚀 Dispatch Stripe Pay Link to ${cust.name}</button>
          </div>
        `;
      } else if (stageNum === 4) {
        title.innerText = "Stage 4: Ready Wall Fulfillment";
        body.innerHTML = `
          <div class="p-3 bg-emerald-950/60 border border-emerald-800 rounded-xl text-emerald-400 font-bold">
            ✅ Staged at Front Counter Shelf A for ${cust.name}
          </div>
        `;
      }
    }

    function closeDrawer() {
      document.getElementById('activeWorkspaceDrawer').classList.add('hidden');
    }
  </script>
</body>
</html>
