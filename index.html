<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aerus Service Portal & Task Hub</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f8; color: #333; }
        .container { max-width: 600px; background: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h2, h3 { margin-top: 0; }
        input, textarea, button { width: 100%; margin-bottom: 12px; padding: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #0073ea; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #005bb5; }
        .task-card { background: #eef3f8; padding: 10px; border-left: 4px solid #0073ea; margin-bottom: 8px; border-radius: 2px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Aerus Service Intake</h2>
    <form id="intakeForm" onsubmit="handleFormSubmit(event)">
        <input type="text" id="name" placeholder="Customer Name" required>
        <input type="tel" id="phone" placeholder="Phone Number" required>
        <input type="text" id="machine" placeholder="Machine Model" required>
        <textarea id="desc" placeholder="Issue / Service Description" rows="3" required></textarea>
        <button type="submit">Submit Intake to Monday.com</button>
    </form>
</div>

<div class="container">
    <h3>Active Portal Board Data</h3>
    <button onclick="loadMondayBoardData()">Refresh Board Data</button>
    <div id="boardDataContainer" style="margin-top: 15px;">
        <p style="color: #666;">Click refresh to pull board cards...</p>
    </div>
</div>

<script>
    // Webhook - No API Key Required
    const MAKE_WEBHOOK_URL = 'https://hook.us2.make.com/q6s4cfv1g27xnxx8mn9m1dn889w23vt7';

    // Monday API Read Key
    const MONDAY_API_KEY = 'PASTE_KEY_HERE';
    const MONDAY_BOARD_ID = '18424728273';

    async function handleFormSubmit(event) {
        event.preventDefault();

        const submitBtn = event.target.querySelector('button');
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";

        const payload = {
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            machine: document.getElementById('machine').value,
            desc: document.getElementById('desc').value
        };

        try {
            const response = await fetch(MAKE_WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert("Intake Submitted Successfully!");
                document.getElementById('intakeForm').reset();
            } else {
                alert("Submission failed. Check Make.com webhook configuration.");
            }
        } catch (error) {
            console.error("Submission error:", error);
            alert("Network error. Could not send payload.");
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Intake to Monday.com";
        }
    }

    async function loadMondayBoardData() {
        const container = document.getElementById('boardDataContainer');
        container.innerHTML = "<p>Loading board items...</p>";

        if eyJhbGciOiJIUzI1NiJ9.eyJ0aWQiOjY5NzE5MzAyNCwiYWFpIjoxMSwidWlkIjoxMTIxOTkyOTgsImlhZCI6IjIwMjYtMDgtMjZUMTM6Mjc6MjAuMDAwWiIsInBlciI6Im1lOndyaXRlIiwiYWN0aWQiOjM2Mjk5NzMyLCJyZ24iOiJ1c2UxIn0.3_nQYGCIHBoJ73l81zUfp_TXNRqSMKMuDyDo3EvqFKo() {
            container.innerHTML = "<p style='color:red;'>Replace PASTE_KEY_HERE with your Monday API key to pull board data.</p>";
            return;
        }

        const query = `query { boards(ids: ${MONDAY_BOARD_ID}) { items_page { items { id name } } } }`;

        try {
            const response = await fetch("https://api.monday.com/v2", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": MONDAY_API_KEY
                },
                body: JSON.stringify({ query })
            });

            const result = await response.json();
            const items = result.data?.boards[0]?.items_page?.items || [];

            if (items.length === 0) {
                container.innerHTML = "<p>No active items found on board.</p>";
                return;
            }

            container.innerHTML = items.map(item => `<div class="task-card"><strong>${item.name}</strong> (ID: ${item.id})</div>`).join('');
        } catch (error) {
            console.error("Monday API Fetch Error:", error);
            container.innerHTML = "<p style='color:red;'>Error connecting to Monday API.</p>";
        }
    }
</script>

</body>
</html>
