<script>
var activeDrawerContext = '';
var isListening = false;
var activeRecognition = null;
var silenceTimer = null;
var currentPaymentUrl = '';
var currentInvoiceTotal = 0;
var currentCustomerName = '';
var currentCleanItem = '';

window.onload = function() {
  var params = new URLSearchParams(window.location.search);
  var staffParam = params.get('staff') || params.get('card');
  if (staffParam) {
    document.getElementById('masterHubContainer').style.display = 'none';
    document.getElementById('staffCardContainer').style.display = 'block';
    document.getElementById('staffCardHeader').innerHTML = '<span class="text-emerald-400">⚡</span> ' + staffParam.toUpperCase().replace('-', ' ') + ' SATELLITE CARD';
    loadStaffSections();
  } else {
    document.getElementById('masterHubContainer').style.display = 'block';
    document.getElementById('staffCardContainer').style.display = 'none';
  }
};

function openDrawer(drawerName) {
  activeDrawerContext = drawerName;
  document.getElementById('drawerTitle').innerHTML = '<i class="fa-solid fa-folder-open text-blue-400"></i> ' + drawerName + ' Drawer';
  document.getElementById('drawerContent').innerHTML = '<p class="text-center text-gray-500 pt-8">Loading cards...</p>';
  document.getElementById('drawerModal').style.display = 'flex';
  loadDrawerItems(drawerName);
}

function closeDrawer() {
  document.getElementById('drawerModal').style.display = 'none';
  activeDrawerContext = '';
}

function openFeaturesModal() {
  document.getElementById('featuresModal').style.display = 'flex';
}

function closeFeaturesModal() {
  document.getElementById('featuresModal').style.display = 'none';
}

async function loadDrawerItems(drawerName) {
  var contentEl = document.getElementById('drawerContent');
  try {
    const res = await fetch('/.netlify/functions/get-drawer-items?drawer=' + encodeURIComponent(drawerName));
    const items = await res.json();
    if (!items || items.length === 0) {
      contentEl.innerHTML = '<p class="text-center text-gray-500 pt-8">No cards in ' + drawerName + ' yet.</p>';
      return;
    }
    contentEl.innerHTML = items.map(renderItemCard).join('');
  } catch (err) {
    contentEl.innerHTML = '<div class="p-3 bg-slate-900 border border-slate-800 rounded-xl text-center"><p class="text-xs text-amber-400 font-bold mb-1">⚡ ' + drawerName + ' Forever Cards</p><p class="text-[11px] text-gray-400">Tap below to add a new card or note via voice/text.</p></div>';
  }
}

function handlePhotoIntake(fileInput) {
  if (fileInput.files && fileInput.files[0]) {
    var photoName = fileInput.files[0].name;
    var inputEl = document.getElementById('unifiedInput');
    if (inputEl) {
      inputEl.value = 'Photo: ' + photoName + ' | ';
      inputEl.focus();
    }
    flashLed('📸 Photo Attached: ' + photoName + ' — Type or tap mic to describe!');
  }
}

function toggleVoiceIntake(drawerContext, targetInputId, targetBtnId) {
  var targetDrawer = drawerContext || activeDrawerContext;
  var input = document.getElementById(targetInputId || 'unifiedInput');
  var btn = document.getElementById(targetBtnId || 'micBtn');
  var output = document.getElementById('ledOutput');
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Voice recognition not supported.'); return; }
  if (isListening && activeRecognition) {
    activeRecognition.stop(); isListening = false;
    if (btn) btn.classList.remove('mic-pulsing');
    if (output) output.textContent = 'POCKET CHIEF OF STAFF READY ⚡';
    if (silenceTimer) clearTimeout(silenceTimer);
    return;
  }
  activeRecognition = new SR();
  activeRecognition.continuous = true;
  activeRecognition.interimResults = true;
  activeRecognition.lang = 'en-US';
  if (btn) btn.classList.add('mic-pulsing');
  if (output) output.textContent = 'LISTENING... (SPEAK FREELY)';
  isListening = true;
  var accumulated = '';
  activeRecognition.onresult = function(e) {
    var interim = '', currentFinal = '';
    for (var i = e.resultIndex; i < e.results.length; ++i) {
      if (e.results[i].isFinal) { currentFinal += e.results[i][0].transcript + ' '; }
      else { interim += e.results[i][0].transcript; }
    }
    accumulated += currentFinal;
    var fullText = (accumulated + interim).trim();
    if (input) input.value = fullText;
    if (silenceTimer) clearTimeout(silenceTimer);
    silenceTimer = setTimeout(function() {
      if (fullText.length > 0 && isListening) {
        if (output) output.textContent = 'PROCESSING...';
        sendToFresh(fullText, targetDrawer);
        if (activeRecognition) activeRecognition.stop();
        isListening = false;
        if (btn) btn.classList.remove('mic-pulsing');
      }
    }, 3000);
  };
  activeRecognition.onerror = function() {
    isListening = false;
    if (btn) btn.classList.remove('mic-pulsing');
    if (output) output.textContent = 'MIC ERROR';
    if (silenceTimer) clearTimeout(silenceTimer);
  };
  activeRecognition.onend = function() {
    if (isListening) { try { activeRecognition.start(); } catch(err) { isListening = false; if (btn) btn.classList.remove('mic-pulsing'); } }
    else { if (btn) btn.classList.remove('mic-pulsing'); }
  };
  activeRecognition.start();
}

function handleMediaInput(fileInput, mediaType) {
  if (fileInput.files && fileInput.files[0]) {
    flashLed(mediaType.toUpperCase() + ' LOGGED: ' + fileInput.files[0].name);
    sendToFresh(mediaType + ' attached: ' + fileInput.files[0].name, activeDrawerContext);
  }
}

function submitUnifiedInput(inputId) {
  var inputEl = document.getElementById(inputId || 'unifiedInput');
  var text = inputEl ? inputEl.value.trim() : '';
  if (text) { sendToFresh(text, activeDrawerContext); if (inputEl) inputEl.value = ''; }
}

function flashLed(msg) {
  var output = document.getElementById('ledOutput');
  if (output) {
    output.textContent = msg || 'Logged! ⚡';
    setTimeout(function() { output.textContent = 'POCKET CHIEF OF STAFF READY ⚡'; }, 3000);
  }
}

async function moveCard(itemId, targetGroupId) {
  flashLed('Routing card...');
  try {
    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: "MOVE_CARD",
        item_id: itemId,
        group_id: targetGroupId,
        board_id: '18424728273'
      })
    });
    const data = await res.json();
    flashLed('Routed! ⚡');
    if (activeDrawerContext) {
      setTimeout(function() { loadDrawerItems(activeDrawerContext); }, 1000);
    }
  } catch (err) {
    flashLed('Error moving card');
  }
}

function sendToFresh(promptText, drawerName) {
  var led = document.getElementById('ledOutput');
  if (led) led.textContent = 'PROCESSING...';
  var fullPrompt = drawerName ? '[' + drawerName + ' Drawer] ' + promptText : promptText;
  fetch('/.netlify/functions/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt: fullPrompt, board_id: '18424728273' })
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    flashLed(data.reply || 'Logged! ⚡');
    if (activeDrawerContext) { setTimeout(function() { loadDrawerItems(activeDrawerContext); }, 1500); }
  })
  .catch(function() {
    flashLed('Logged! ⚡');
    if (activeDrawerContext) { setTimeout(function() { loadDrawerItems(activeDrawerContext); }, 1500); }
  });
}

function renderItemCard(item) {
  var title = item.name || item.title || 'Untitled Card';
  var itemId = item.id || 'card_' + Math.random().toString(36).substr(2, 9);
  var cardUrl = '/card.html?id=' + encodeURIComponent(itemId) + '&title=' + encodeURIComponent(title);
  var groupTitle = item.group ? (item.group.title || item.group) : 'Active Card';

  return '<div class="p-3 bg-gray-800 rounded-xl border border-gray-700 space-y-2" id="' + itemId + '">' +
    '<div class="flex justify-between items-center gap-2">' +
      '<div class="flex-1 min-w-0">' +
        '<a href="' + cardUrl + '" class="font-bold text-white text-xs truncate hover:text-blue-400 transition flex items-center gap-1.5">' +
          '<span class="truncate">' + title + '</span>' +
          '<i class="fa-solid fa-arrow-up-right-from-square text-[9px] text-blue-400 shrink-0"></i>' +
        '</a>' +
        '<p class="text-[10px] text-gray-400 mt-0.5">' + groupTitle + '</p>' +
      '</div>' +
    '</div>' +
    '<div class="text-[9px] text-slate-500 font-mono tracking-wider pt-0.5">Forever Card™ by Fresh TappyThing LLC</div>' +
    '</div>';
}
</script>
