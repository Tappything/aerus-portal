<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Forever Card™ — Powered by Fresh TappyThing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #05070e; color: #f3f4f6; }
.tapulator-face { background: linear-gradient(180deg, #0f172a 0%, #090d16 100%); border: 2px solid #1e293b; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9); }
.key-primary { background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%); border: 1px solid #3b82f6; box-shadow: 0 4px 14px rgba(29, 78, 216, 0.4); cursor: pointer; }
.key-secondary { background: #1e293b; border: 1px solid #334155; box-shadow: 0 2px 6px rgba(0,0,0,0.4); cursor: pointer; }
.key-secondary:hover { background: #273549; }
.key-accent { background: linear-gradient(135deg, #0f766e 0%, #115e59 100%); border: 1px solid #14b8a6; cursor: pointer; }
.key-pinball { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); border: 1px solid #8b5cf6; box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4); cursor: pointer; }
.key-proposal { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); border: 1px solid #38bdf8; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4); cursor: pointer; }
@keyframes pulse-red {
  0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
  100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}
.mic-pulsing { animation: pulse-red 1.5s infinite; background-color: #dc2626 !important; color: #ffffff !important; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 pb-28 relative">

<!-- MASTER COMMAND HUB -->
<div id="masterHubContainer" class="max-w-md w-full tapulator-face rounded-3xl p-4 relative space-y-3 shadow-2xl my-auto">
  
  <!-- CLEAN HEADER -->
  <div class="flex items-center justify-between border-b border-slate-800 pb-2">
    <div class="flex items-center gap-2.5">
      <img src="/Gemini_Generated_Image_u1q8jwu1q8jwu1q8.jpg" class="w-10 h-10 rounded-full border-2 border-blue-400 block shadow-lg object-cover ring-1 ring-blue-500/30" alt="Fresh Avatar" onError="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Fresh&background=3b82f6&color=fff'">
      <div>
        <h1 class="text-base font-black text-white tracking-tight leading-none">FOREVER CARD™</h1>
        <p class="text-[10px] text-blue-400 font-bold uppercase tracking-wider mt-0.5">Powered by Fresh TappyThing</p>
      </div>
    </div>
    <span id="statusLed" class="text-[9px] font-black text-emerald-400 bg-emerald-950/40 border border-emerald-800/40 px-2.5 py-1 rounded-full flex items-center gap-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> READY ⚡
    </span>
  </div>

  <!-- NAVIGATION MATRIX -->
  <div class="space-y-2">
    <button type="button" onclick="openDrawer('Castle')" class="key-primary w-full rounded-xl p-3 text-left transition flex items-center justify-between shadow">
      <div>
        <div class="text-xs font-black text-white uppercase tracking-wider flex items-center gap-1.5">
          <i class="fa-solid fa-chess-rook text-blue-300"></i>
          <span>1. Castle 🏰</span>
        </div>
        <div class="text-[10px] text-blue-200 mt-0.5">Utilities, Gas, Grocery & Banking Cards</div>
      </div>
      <i class="fa-solid fa-chevron-right text-blue-300 text-xs"></i>
    </button>

    <div class="grid grid-cols-5 gap-2">
      <button type="button" onclick="openDrawer('Empire')" class="key-secondary col-span-3 rounded-xl p-2.5 text-left transition flex flex-col justify-between min-h-[75px] shadow-sm">
        <div>
          <div class="text-[11px] font-black text-amber-400 uppercase tracking-wide flex items-center justify-between">
            <span>2. Empire 👑</span>
            <i class="fa-solid fa-crown text-amber-500 text-xs"></i>
          </div>
          <div class="text-[9px] text-gray-400 font-medium mt-0.5">Bench Repairs & Ops</div>
        </div>
        <div class="text-[8px] text-amber-300/80 bg-amber-950/40 px-1.5 py-0.5 rounded border border-amber-800/40 inline-block w-fit">🛠 Workbench Queue</div>
      </button>
      <button type="button" onclick="openDrawer('Pipeline')" class="key-accent col-span-2 rounded-xl p-2.5 text-left transition flex flex-col justify-between min-h-[75px] shadow-sm">
        <div class="text-[11px] font-black text-teal-200 uppercase tracking-wide flex items-center justify-between">
          <span>3. Pipeline 🚀</span>
          <i class="fa-solid fa-rocket text-teal-400 text-xs"></i>
        </div>
        <div class="text-[9px] text-teal-100 font-medium">Leads & Intakes</div>
      </button>
    </div>

    <div class="grid grid-cols-3 gap-2">
      <button type="button" onclick="openDrawer('Calendar')" class="key-secondary rounded-xl p-2 text-left transition space-y-0.5">
        <div class="text-[10px] font-bold text-blue-400 flex items-center justify-between">
          <span>4. Calendar 📅</span>
          <i class="fa-solid fa-calendar-day text-gray-500 text-[10px]"></i>
        </div>
        <div class="text-[8px] text-gray-400">Live Agenda Sync</div>
      </button>
      <button type="button" onclick="openDrawer('BrainDump')" class="key-secondary rounded-xl p-2 text-left transition space-y-0.5">
        <div class="text-[10px] font-bold text-emerald-400 flex items-center justify-between">
          <span>5. Brain Dump 🧠</span>
          <i class="fa-solid fa-brain text-emerald-500 text-[10px]"></i>
        </div>
        <div class="text-[8px] text-gray-400">Raw Voice Pile</div>
      </button>
      <button type="button" onclick="openDrawer('Pinball')" class="key-pinball rounded-xl p-2 text-left transition space-y-0.5">
        <div class="text-[10px] font-bold text-purple-200 flex items-center justify-between">
          <span>6. Pinball 🎯</span>
          <i class="fa-solid fa-bolt text-yellow-400 text-[10px]"></i>
        </div>
        <div class="text-[8px] text-purple-200/80">Action Queue</div>
      </button>
    </div>

    <button type="button" onclick="window.location.href='/proposal.html'" class="key-proposal w-full rounded-xl p-2.5 text-left transition flex items-center justify-between shadow">
      <div>
        <div class="text-xs font-black text-white uppercase tracking-wider flex items-center gap-1.5">
          <i class="fa-solid fa-bullseye text-sky-200"></i>
          <span>7. Estimates & Proposals 🎯</span>
        </div>
        <div class="text-[9px] text-sky-100 mt-0.5">Universal Deal Builder • Problem vs Solution</div>
      </div>
      <i class="fa-solid fa-arrow-right text-sky-200 text-xs"></i>
    </button>
  </div>
</div>

<!-- SINGLE DRAWER MODAL -->
<div id="drawerModal" style="display:none;" class="fixed inset-0 bg-black/95 z-50 flex flex-col p-3 backdrop-blur-md justify-between">
  <div class="max-w-md w-full mx-auto flex flex-col h-full">
    <div class="flex items-center justify-between border-b border-gray-800 pb-2 mb-2 shrink-0">
      <h3 id="drawerTitle" class="text-sm font-black text-white flex items-center gap-2">
        <i class="fa-solid fa-folder-open text-blue-400"></i> Drawer
      </h3>
      <button type="button" onclick="closeDrawer()" class="text-gray-400 hover:text-white font-bold text-xs bg-gray-800 px-2.5 py-1 rounded-lg active:scale-95">✕ Close</button>
    </div>
    
    <div id="pinballVoiceHero" style="display:none;" class="mb-2 p-2.5 bg-purple-950/60 border border-purple-600/50 rounded-xl shrink-0 flex items-center justify-between gap-2 shadow">
      <div class="flex-1">
        <div class="text-xs font-black text-purple-200 uppercase tracking-wider flex items-center gap-1">
          <i class="fa-solid fa-bolt text-yellow-400"></i> Pinball Voice Hero
        </div>
        <p class="text-[9px] text-purple-300/80">Tap mic to speak tasks directly into Pinball.</p>
      </div>
      <button type="button" id="pinballMicBtn" onclick="toggleVoiceIntake('Pinball', null, 'pinballMicBtn')" class="bg-purple-600 hover:bg-purple-500 text-white w-10 h-10 rounded-xl flex items-center justify-center border border-purple-400 shadow transition shrink-0 active:scale-95">
        <i class="fa-solid fa-microphone text-base"></i>
      </button>
    </div>

    <div id="drawerContent" class="flex-1 overflow-y-auto space-y-2 text-xs text-gray-300">
      <p class="text-center text-gray-500 pt-8">Loading cards... ⚡</p>
    </div>
  </div>
</div>

<!-- BOTTOM AUTO-EXPANDING INTAKE BAR -->
<div class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 p-2.5 z-40">
  <div class="max-w-md mx-auto flex items-end gap-2">
    <textarea id="unifiedInput" rows="1" placeholder="Talk or type note..." class="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 resize-none max-h-28 overflow-y-auto" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'" onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); submitUnifiedInput(); }"></textarea>
    <button type="button" id="micBtn" onclick="toggleVoiceIntake()" class="bg-gray-800 hover:bg-gray-700 text-blue-400 w-9 h-9 rounded-xl flex items-center justify-center border border-gray-700 transition shrink-0 h-9">
      <i class="fa-solid fa-microphone text-sm"></i>
    </button>
    <button type="button" onclick="submitUnifiedInput()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-2 rounded-xl text-xs transition shrink-0 flex items-center justify-center h-9">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>
</div>

<script>
var activeDrawerContext = '';
var isListening = false;
var activeRecognition = null;

var localPreloadedCards = {
  'castle': [
    { title: '⛽ Gas Finder Card', group: 'Castle Utility', phone: '410-555-0199' },
    { title: '🛒 Grocery Savings Card', group: 'Castle Utility', phone: '410-555-0188' },
    { title: '💳 Banking & Bills Card', group: 'Castle Utility', phone: '410-555-0177' }
  ],
  'calendar': [
    { title: '📅 Today\'s Active Schedule', group: 'Calendar Sync', calendarLink: true }
  ]
};

function openDrawer(drawerName) {
  activeDrawerContext = drawerName;
  document.getElementById('drawerTitle').innerHTML = '<i class="fa-solid fa-folder-open text-blue-400"></i> ' + drawerName;
  
  var pinballHero = document.getElementById('pinballVoiceHero');
  if (pinballHero) {
    pinballHero.style.display = (drawerName && drawerName.toLowerCase() === 'pinball') ? 'flex' : 'none';
  }

  document.getElementById('drawerModal').style.display = 'flex';
  loadDrawerItems(drawerName);
}

function closeDrawer() {
  document.getElementById('drawerModal').style.display = 'none';
  activeDrawerContext = '';
  if (isListening && activeRecognition) { activeRecognition.stop(); isListening = false; }
}

async function loadDrawerItems(drawerName) {
  var contentEl = document.getElementById('drawerContent');
  if (!contentEl) return;
  var key = drawerName ? drawerName.toLowerCase() : '';

  try {
    const res = await fetch('/.netlify/functions/monday?drawer=' + encodeURIComponent(drawerName) + '&board=18424728273&t=' + new Date().getTime());
    const data = await res.json();
    
    var items = [];
    if (data.items && Array.isArray(data.items)) {
      items = data.items;
    } else if (data.groups && Array.isArray(data.groups)) {
      data.groups.forEach(function(g) {
        if (g.items_page && g.items_page.items) {
          g.items_page.items.forEach(function(it) {
            var nameLower = (it.name || '').toLowerCase();
            // FILTER OUT CLOSED/ARCHIVED ITEMS TO KILL LANDFILLS
            if (!nameLower.includes('archive') && !nameLower.includes('completed') && !nameLower.includes('closed') && !nameLower.includes('done')) {
              items.push({
                id: it.id,
                title: it.name,
                group: (it.group && it.group.title) ? it.group.title : g.title
              });
            }
          });
        }
      });
    }

    if (!items || items.length === 0) {
      if (localPreloadedCards[key]) {
        contentEl.innerHTML = localPreloadedCards[key].map(renderItemCard).join('');
        return;
      }
      contentEl.innerHTML = '<div class="p-4 text-center text-gray-500"><p class="text-xs">No active cards in ' + drawerName + '.</p><p class="text-[10px] text-gray-600">Speak below to create one!</p></div>';
      return;
    }
    contentEl.innerHTML = items.map(renderItemCard).join('');
  } catch (err) {
    if (localPreloadedCards[key]) {
      contentEl.innerHTML = localPreloadedCards[key].map(renderItemCard).join('');
    } else {
      contentEl.innerHTML = '<div class="p-4 bg-slate-900 border border-slate-800 rounded-xl text-center"><p class="text-xs text-amber-400 font-bold">' + drawerName + ' Ready</p></div>';
    }
  }
}

function submitUnifiedInput(inputId) {
  var inputEl = document.getElementById(inputId || 'unifiedInput');
  if (!inputEl) return;
  var text = inputEl.value.trim();
  if (text) {
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendToFresh(text, activeDrawerContext);
  }
}

function toggleVoiceIntake(drawerContext, targetInputId, targetBtnId) {
  var input = document.getElementById(targetInputId || 'unifiedInput');
  var btn = document.getElementById(targetBtnId || 'micBtn');
  var led = document.getElementById('statusLed');
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SR) { alert('Voice recognition not supported in this browser.'); return; }

  if (isListening && activeRecognition) {
    activeRecognition.stop(); isListening = false;
    if (btn) btn.classList.remove('mic-pulsing');
    if (led) led.textContent = 'READY ⚡';
    return;
  }

  activeRecognition = new SR();
  activeRecognition.continuous = true;
  activeRecognition.interimResults = true;
  activeRecognition.lang = 'en-US';

  if (btn) btn.classList.add('mic-pulsing');
  if (led) led.textContent = 'LISTENING...';
  isListening = true;

  activeRecognition.onresult = function(e) {
    var interim = '', currentFinal = '';
    for (var i = e.resultIndex; i < e.results.length; ++i) {
      if (e.results[i].isFinal) { currentFinal += e.results[i][0].transcript + ' '; }
      else { interim += e.results[i][0].transcript; }
    }
    var fullText = (currentFinal + interim).trim();
    if (input) {
      input.value = fullText;
      input.style.height = 'auto';
      input.style.height = input.scrollHeight + 'px';
    }
  };

  activeRecognition.onerror = function() {
    isListening = false;
    if (btn) btn.classList.remove('mic-pulsing');
    if (led) led.textContent = 'MIC ERROR';
  };

  activeRecognition.onend = function() {
    isListening = false;
    if (btn) btn.classList.remove('mic-pulsing');
  };

  activeRecognition.start();
}

function sendToFresh(promptText, drawerName) {
  var led = document.getElementById('statusLed');
  if (led) led.textContent = 'PROCESSING... ⚡';

  fetch('/.netlify/functions/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt: (drawerName ? '[' + drawerName + '] ' : '') + promptText, board_id: '18424728273' })
  }).then(function() {
    if (led) led.textContent = 'LOGGED! ⚡';
    setTimeout(function() { if (led) led.textContent = 'READY ⚡'; }, 2000);
    if (activeDrawerContext) loadDrawerItems(activeDrawerContext);
  });
}

function renderItemCard(item) {
  var title = item.title || item.name || 'Forever Card';
  var group = item.group || 'Active';
  var itemId = item.id || 'card_' + Math.random().toString(36).substr(2, 9);
  var cardUrl = '/card.html?id=' + encodeURIComponent(itemId) + '&title=' + encodeURIComponent(title);
  var phone = item.phone || '';

  var commsHtml = '';
  if (phone) {
    commsHtml = '<div class="flex items-center gap-2 pt-1.5 border-t border-gray-700/60 mt-1.5 text-[10px]">' +
      '<a href="tel:' + phone + '" class="text-emerald-400 hover:underline flex items-center gap-1 font-bold"><i class="fa-solid fa-phone"></i> Call</a>' +
      '<a href="sms:' + phone + '" class="text-sky-400 hover:underline flex items-center gap-1 font-bold"><i class="fa-solid fa-comment-sms"></i> Text</a>' +
      '</div>';
  } else if (item.calendarLink) {
    commsHtml = '<div class="pt-1.5 border-t border-gray-700/60 mt-1.5 text-[10px]">' +
      '<a href="https://calendar.google.com" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-2.5 py-1 rounded-lg inline-flex items-center gap-1"><i class="fa-solid fa-calendar-plus"></i> Launch Google Calendar App</a>' +
      '</div>';
  }

  return '<div class="p-2.5 bg-gray-800 rounded-xl border border-gray-700 space-y-1">' +
    '<div class="flex justify-between items-center">' +
      '<a href="' + cardUrl + '" class="font-bold text-white text-xs hover:text-blue-400 transition">' + title + '</a>' +
      '<span class="text-[9px] bg-blue-900/60 text-blue-300 px-1.5 py-0.5 rounded">' + group + '</span>' +
    '</div>' +
    commsHtml +
    '</div>';
}
</script>
</body>
</html>
