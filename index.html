<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TappyThing Digital Coordinator v3.1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-12 flex flex-col items-center p-3 sm:p-4">

  <!-- DISPATCH CALENDAR / SCHEDULE BAR -->
  <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl p-3 mb-3 shadow-xl">
    <div class="flex justify-between items-center mb-2 px-1">
      <span class="text-[11px] font-extrabold uppercase tracking-wider text-cyan-400 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Dispatch Calendar
      </span>
      <button onclick="toggleAddStopModal()" class="text-[11px] bg-cyan-950 text-cyan-300 border border-cyan-800 hover:bg-cyan-900 px-2.5 py-1 rounded-lg font-bold transition">
        + Add Stop
      </button>
    </div>
    <div id="dispatch-timeline" class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
      <!-- Dynamic Stops Loaded via JS -->
    </div>
  </div>

  <!-- TOP PASSPORT HEADER -->
  <header class="w-full max-w-md glass rounded-2xl p-3.5 mb-3 flex items-center justify-between border-b border-cyan-500/30">
    <div class="flex items-center gap-3">
      <!-- COMPACT PHOTO THUMBNAIL -->
      <div onclick="document.getElementById('camera-input').click()" class="w-12 h-12 bg-slate-900 border border-slate-700 hover:border-cyan-400 rounded-xl flex items-center justify-center cursor-pointer overflow-hidden shrink-0 relative">
        <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handlePhoto(event)">
        <span id="photo-icon" class="text-lg">📷</span>
        <img id="passport-img" class="hidden absolute inset-0 w-full h-full object-cover">
      </div>
      <div>
        <div class="text-[10px] uppercase tracking-widest text-cyan-400 font-bold">TAPPYTHING CARD™</div>
        <h1 id="header-customer-name" class="text-sm font-extrabold text-white truncate max-w-[180px]">Margueriete Villasanta</h1>
        <p id="header-customer-phone" class="text-[11px] text-slate-400">Aerus Lux Guardian • 10:15 AM</p>
      </div>
    </div>
    <div class="text-right">
      <span id="ticket-id-tag" class="text-[10px] font-mono bg-cyan-950 text-cyan-300 border border-cyan-700/50 px-2 py-0.5 rounded-md">#TT-88492</span>
      <div id="status-badge" class="mt-1 text-[10px] uppercase font-black tracking-widest text-emerald-400">1. INTAKE</div>
    </div>
  </header>

  <!-- MASTER VOICE BUTTON & PINBALL TRIGGER -->
  <div class="w-full max-w-md mb-3 grid grid-cols-4 gap-2">
    <button onclick="startVoiceDictation()" id="master-voice-btn" class="col-span-3 py-3.5 bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-slate-950 font-black text-xs sm:text-sm rounded-xl shadow-xl flex items-center justify-center gap-2 transition transform active:scale-95">
      <span id="mic-pulse" class="w-2 h-2 rounded-full bg-slate-950"></span>
      <span id="mic-btn-text">🎙️ TALK TO FRESH</span>
    </button>
    <button onclick="triggerPinball()" class="col-span-1 py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs rounded-xl shadow-xl flex flex-col items-center justify-center transition active:scale-95">
      <span>🎰</span>
      <span>PINBALL</span>
    </button>
  </div>

  <!-- PIPELINE NAVIGATION TABS -->
  <div class="w-full max-w-md flex bg-slate-900/90 p-1 rounded-xl mb-3 border border-slate-800 text-xs text-center font-bold">
    <button onclick="switchStage(1)" id="tab-1" class="flex-1 py-2 rounded-lg bg-cyan-600 text-white">1. Intake</button>
    <button onclick="switchStage(2)" id="tab-2" class="flex-1 py-2 rounded-lg text-slate-400">2. Bench</button>
    <button onclick="switchStage(3)" id="tab-3" class="flex-1 py-2 rounded-lg text-slate-400">3. Pay</button>
    <button onclick="switchStage(4)" id="tab-4" class="flex-1 py-2 rounded-lg text-slate-400">4. Ready 🧱</button>
  </div>

  <!-- MAIN STAGE CONTAINER -->
  <main class="w-full max-w-md">

    <!-- STAGE 1: INTAKE -->
    <section id="stage-1" class="glass rounded-2xl p-4 space-y-3.5">
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">Customer Search (22,283 Vault)</label>
        <input type="text" id="vault-search" placeholder="Type customer name or phone..." oninput="searchVault()" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-cyan-500">
        <div id="vault-results" class="hidden bg-slate-950 border border-slate-800 rounded-lg mt-1 max-h-48 overflow-y-auto divide-y divide-slate-800"></div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">Live Voice Symptom Note / Pinball Output</label>
        <textarea id="symptom-note" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white" placeholder="Speak after tapping microphone button above..."></textarea>
      </div>

      <button onclick="switchStage(2)" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl shadow-lg transition">Send to Workbench ➔</button>
    </section>

    <!-- STAGE 2: WORKBENCH -->
    <section id="stage-2" class="glass rounded-2xl p-4 space-y-3.5 hidden">
      <div class="flex justify-between items-center">
        <h3 class="text-xs uppercase font-extrabold text-cyan-400">Parts & Labor Calculator</h3>
        <span id="workbench-total" class="text-base font-black text-emerald-400">$0.00</span>
      </div>

      <div class="grid grid-cols-3 gap-2">
        <button onclick="addLabor('Standard Service Labor', 85)" class="p-2 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-bold text-slate-200">$85 Labor</button>
        <button onclick="addLabor('Motor Replacement Part', 45)" class="p-2 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-bold text-slate-200">$45 Part</button>
        <button onclick="addLabor('HEPA Filter Set', 29.95)" class="p-2 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-lg text-xs font-bold text-slate-200">$29.95 Filter</button>
      </div>

      <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 space-y-2">
        <label class="block text-[11px] font-bold text-slate-400">Add Custom Item (e.g. Overhaul)</label>
        <div class="flex gap-2">
          <input type="text" id="custom-item-name" placeholder="Overhaul" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-white">
          <input type="number" id="custom-item-price" placeholder="$150" class="w-20 bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-white">
          <button onclick="addCustomItem()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-3 py-1.5 rounded-lg text-xs">+ Add</button>
        </div>
      </div>

      <div id="items-list" class="space-y-1.5 max-h-36 overflow-y-auto bg-slate-950/60 p-2 rounded-lg border border-slate-800">
        <p class="text-xs text-slate-500 text-center py-2">No parts added yet.</p>
      </div>

      <button onclick="switchStage(3)" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl shadow-lg transition">Send Estimate to Client ➔</button>
    </section>

    <!-- STAGE 3: PAY -->
    <section id="stage-3" class="glass rounded-2xl p-4 space-y-4 hidden">
      <div class="border-b border-slate-800 pb-3">
        <h3 class="text-xs uppercase text-slate-400 font-bold">Approved Service Quote Summary</h3>
        <div id="pay-summary" class="mt-2 space-y-1 text-sm"></div>
        <div class="mt-3 flex justify-between items-center text-base font-extrabold text-white">
          <span>Total Amount:</span>
          <span id="pay-total-display" class="text-emerald-400">$0.00</span>
        </div>
      </div>

      <button onclick="simulateStripe()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold rounded-xl shadow-lg flex items-center justify-center gap-2">
        🚀 Authorize & Pay via Stripe
      </button>

      <button onclick="switchStage(4)" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-slate-300 font-bold rounded-xl border border-slate-700">Payment Confirmed ➔ Move to Ready Wall 🧱</button>
    </section>

    <!-- STAGE 4: READY WALL 🧱 -->
    <section id="stage-4" class="glass rounded-2xl p-4 space-y-4 hidden text-center">
      <div class="inline-block px-3 py-1 bg-emerald-950 border border-emerald-600 text-emerald-400 rounded-full text-xs font-bold">
        🟢 PAID & STAGED ON READY WALL
      </div>

      <div class="text-left bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
        <label class="block text-xs font-bold text-slate-300">Staging Location Bay Assignment</label>
        <select id="staging-bay" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white">
          <option>Shelf A - Front Desk Staging</option>
          <option>Shelf B - Main Bench Storage</option>
          <option>Bay 1 - Heavy Service Floor</option>
          <option>Van Delivery Queue</option>
        </select>
      </div>

      <button onclick="completeJob()" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-black text-base rounded-xl shadow-xl transition transform active:scale-95">
        🏁 Complete Pickup / Delivery
      </button>
    </section>

  </main>

  <!-- ADD STOP MODAL -->
  <div id="add-stop-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4 w-full max-w-xs space-y-3">
      <h3 class="text-sm font-bold text-cyan-400">+ Add Appointment Stop</h3>
      <input type="text" id="modal-time" placeholder="Time (e.g. 12:30 PM)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white">
      <input type="text" id="modal-name" placeholder="Customer Name" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white">
      <input type="text" id="modal-desc" placeholder="Equipment / Service Type" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white">
      <div class="flex gap-2 pt-1">
        <button onclick="toggleAddStopModal()" class="flex-1 py-2 bg-slate-800 text-slate-400 rounded-lg text-xs font-bold">Cancel</button>
        <button onclick="saveNewStop()" class="flex-1 py-2 bg-cyan-600 text-white rounded-lg text-xs font-bold">Save Stop</button>
      </div>
    </div>
  </div>

  <script>
    let stops = [
      { id: 1, time: '10:15 AM', name: 'Margueriete Villasanta', desc: 'Aerus Lux Guardian' },
      { id: 2, time: '11:30 AM', name: 'Ruth Tucker', desc: 'Filter Swap & Diagnostic' },
      { id: 3, time: '02:00 PM', name: 'Sarah Jenkins', desc: 'Prochem Steamer Unit' }
    ];

    const customerVault = [
      { name: "Ruth Tucker", phone: "4102566949", address: "6 Lagan Ct Nottingham, MD" },
      { name: "Margueriete Villasanta", phone: "4105550192", address: "Timonium, MD" },
      { name: "Sarah Jenkins", phone: "4109602843", address: "Sparks, MD" },
      { name: "Claire Hartman", phone: "4433366380", address: "Monkton, MD" }
    ];

    let currentItems = [];

    window.addEventListener('DOMContentLoaded', () => {
      renderTimeline();
      loadStop(1);
    });

    function renderTimeline() {
      const container = document.getElementById('dispatch-timeline');
      container.innerHTML = stops.map(s => `
        <div onclick="loadStop(${s.id})" class="min-w-[130px] bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-xl p-2 cursor-pointer transition shrink-0">
          <div class="text-[10px] font-bold text-cyan-400">${s.time}</div>
          <div class="text-xs font-bold text-white truncate">${s.name}</div>
          <div class="text-[10px] text-slate-400 truncate">${s.desc}</div>
        </div>
      `).join('');
    }

    function loadStop(stopId) {
      const stop = stops.find(s => s.id === stopId);
      if (stop) {
        document.getElementById('header-customer-name').innerText = stop.name;
        document.getElementById('header-customer-phone').innerText = `${stop.desc} • ${stop.time}`;
      }
    }

    function toggleAddStopModal() {
      document.getElementById('add-stop-modal').classList.toggle('hidden');
    }

    function saveNewStop() {
      const time = document.getElementById('modal-time').value || '12:30 PM';
      const name = document.getElementById('modal-name').value || 'New Customer';
      const desc = document.getElementById('modal-desc').value || 'Service Stop';
      const newId = stops.length + 1;
      stops.push({ id: newId, time, name, desc });
      renderTimeline();
      loadStop(newId);
      toggleAddStopModal();
    }

    // PINBALL PROTOCOL ENGINE
    function triggerPinball() {
      const note = document.getElementById('symptom-note');
      note.value = "🎰 PINBALL EXECUTED: Pending vault tasks pulled. Ruth Tucker (#22086) verified at 6 Lagan Ct, Nottingham MD. Pre-written proposal ready for SMS/Email checkout.";
      alert("🎰 Pinball Protocol Triggered! Cross-referenced 22,283 customer records.");
    }

    function startVoiceDictation() {
      const btnText = document.getElementById('mic-btn-text');
      const pulse = document.getElementById('mic-pulse');
      
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("Voice recognition is not supported on this browser.");
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = function() {
        btnText.innerText = "LISTENING...";
        pulse.classList.add('animate-ping');
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('symptom-note').value = transcript;
        document.getElementById('vault-search').value = transcript;
        searchVault();
        btnText.innerText = "🎙️ TALK TO FRESH";
        pulse.classList.remove('animate-ping');
      };

      recognition.onerror = function() {
        btnText.innerText = "🎙️ TALK TO FRESH";
        pulse.classList.remove('animate-ping');
      };

      recognition.start();
    }

    function searchVault() {
      const q = document.getElementById('vault-search').value.toLowerCase().trim();
      const resBox = document.getElementById('vault-results');
      if (!q) { resBox.classList.add('hidden'); return; }

      let matches = customerVault.filter(c => c.name.toLowerCase().includes(q) || c.phone.includes(q));

      let html = matches.map(c => `
        <div onclick="selectCustomer('${c.name}', '${c.phone}')" class="p-2 hover:bg-slate-900 cursor-pointer text-xs">
          <div class="font-bold text-white">${c.name}</div>
          <div class="text-slate-400 text-[10px]">${c.phone} • ${c.address}</div>
        </div>
      `).join('');

      const typedClean = document.getElementById('vault-search').value.trim();
      html += `
        <div onclick="selectCustomer('${typedClean}', '(555) NEW-USER')" class="p-2 bg-cyan-950 hover:bg-cyan-900 cursor-pointer text-xs text-cyan-300 font-bold border-t border-slate-800 flex items-center justify-between">
          <span>+ Add "${typedClean}" as New Client</span>
          <span class="text-[10px] bg-cyan-800 text-white px-2 py-0.5 rounded">Bind</span>
        </div>
      `;

      resBox.innerHTML = html;
      resBox.classList.remove('hidden');
    }

    function selectCustomer(name, phone) {
      document.getElementById('header-customer-name').innerText = name;
      document.getElementById('header-customer-phone').innerText = phone;
      document.getElementById('vault-results').classList.add('hidden');
      document.getElementById('vault-search').value = name;
    }

    function handlePhoto(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const img = document.getElementById('passport-img');
          img.src = evt.target.result;
          img.classList.remove('hidden');
          document.getElementById('photo-icon').classList.add('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function switchStage(stageNum) {
      [1, 2, 3, 4].forEach(s => {
        document.getElementById(`stage-${s}`).classList.add('hidden');
        const tab = document.getElementById(`tab-${s}`);
        tab.className = "flex-1 py-2 rounded-lg text-slate-400 font-bold";
      });
      document.getElementById(`stage-${stageNum}`).classList.remove('hidden');
      const activeTab = document.getElementById(`tab-${stageNum}`);
      activeTab.className = "flex-1 py-2 rounded-lg bg-cyan-600 text-white font-bold";
      
      const badge = document.getElementById('status-badge');
      const stages = ["1. INTAKE", "2. BENCH", "3. PAY", "4. READY 🧱"];
      badge.innerText = stages[stageNum - 1];
    }

    function addLabor(item, price) {
      currentItems.push({ item, price });
      renderItems();
    }

    function addCustomItem() {
      const nameInput = document.getElementById('custom-item-name');
      const priceInput = document.getElementById('custom-item-price');
      const name = nameInput.value.trim();
      const price = parseFloat(priceInput.value);

      if (!name || isNaN(price)) {
        alert("Please enter a valid item name and dollar amount.");
        return;
      }

      currentItems.push({ item: name, price: price });
      renderItems();
      nameInput.value = '';
      priceInput.value = '';
    }

    function renderItems() {
      const box = document.getElementById('items-list');
      const payBox = document.getElementById('pay-summary');
      let total = 0;
      if (currentItems.length === 0) {
        box.innerHTML = `<p class="text-xs text-slate-500 text-center py-2">No parts added yet.</p>`;
        payBox.innerHTML = `<p class="text-xs text-slate-500">No line items.</p>`;
      } else {
        box.innerHTML = currentItems.map(i => `
          <div class="flex justify-between items-center text-xs bg-slate-900 p-2 rounded border border-slate-800">
            <span class="text-slate-200">${i.item}</span>
            <span class="font-bold text-emerald-400">$${i.price.toFixed(2)}</span>
          </div>
        `).join('');
        payBox.innerHTML = currentItems.map(i => `
          <div class="flex justify-between text-xs text-slate-300 py-0.5">
            <span>${i.item}</span>
            <span class="font-mono text-emerald-400">$${i.price.toFixed(2)}</span>
          </div>
        `).join('');
        total = currentItems.reduce((acc, curr) => acc + curr.price, 0);
      }
      document.getElementById('workbench-total').innerText = `$${total.toFixed(2)}`;
      document.getElementById('pay-total-display').innerText = `$${total.toFixed(2)}`;
    }

    function simulateStripe() {
      alert("🚀 Stripe Payment Authorized!");
      switchStage(4);
    }

    function completeJob() {
      confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
      alert("🏁 Job Staged on Ready Wall!");
    }
  </script>
</body>
</html>
