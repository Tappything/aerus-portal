<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TappyThing — Digital Coordinator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-3xl mx-auto space-y-6">
    
    <!-- HEADER -->
    <header class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white">TappyThing</h1>
        <p class="text-xs text-slate-400">Appointment &bull; Dispatch &bull; Live Stripe Invoice Engine</p>
      </div>
      <span class="text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full">System Ready</span>
    </header>

    <!-- MODULE 1: APPOINTMENT / DISPATCH INTAKE -->
    <section class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-5 shadow-lg space-y-4">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">1. Appointment / Dispatch Intake</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Time</label>
          <input type="time" id="appTime" value="08:30" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Client Name</label>
          <input type="text" id="clientName" value="Sample Client" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Address</label>
          <input type="text" id="clientAddress" placeholder="123 Main St, Anytown" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
      </div>
      <button onclick="addStop()" class="w-full md:w-auto bg-slate-700 hover:bg-slate-600 text-white font-medium px-4 py-2 rounded-lg text-sm transition">+ Add Stop</button>
      
      <div id="scheduleQueue" class="space-y-2 pt-2"></div>
    </section>

    <!-- MODULE 2: QUICK LINE-ITEM PICKER -->
    <section class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-5 shadow-lg space-y-4">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">2. Quick Line-Item Picker</h2>
      <div class="flex flex-wrap gap-2">
        <button onclick="addItem('Bench Labor', 85.00)" class="bg-indigo-600/20 border border-indigo-500/30 hover:bg-indigo-600/30 text-indigo-300 px-3 py-2 rounded-lg text-sm transition">+ Bench Labor ($85.00)</button>
        <button onclick="addItem('Filter Pack', 29.95)" class="bg-indigo-600/20 border border-indigo-500/30 hover:bg-indigo-600/30 text-indigo-300 px-3 py-2 rounded-lg text-sm transition">+ Filter Pack ($29.95)</button>
        <button onclick="addItem('Motor Replacement', 45.00)" class="bg-indigo-600/20 border border-indigo-500/30 hover:bg-indigo-600/30 text-indigo-300 px-3 py-2 rounded-lg text-sm transition">+ Motor Replacement ($45.00)</button>
      </div>

      <div class="border border-slate-700/50 rounded-lg overflow-hidden">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/50 text-xs text-slate-400 uppercase">
            <tr>
              <th class="p-3">Item</th>
              <th class="p-3 text-right">Price</th>
            </tr>
          </thead>
          <tbody id="invoiceTable" class="divide-y divide-slate-700/50">
            <tr><td colspan="2" class="p-3 text-center text-slate-500 text-xs">No items selected yet</td></tr>
          </tbody>
        </table>
        <div class="bg-slate-900/80 p-3 flex justify-between items-center font-bold text-white border-t border-slate-700/50">
          <span>Subtotal:</span>
          <span id="subtotalAmount">$0.00</span>
        </div>
      </div>
    </section>

    <!-- MODULE 3: LIVE STRIPE HAND-OFF ENGINE -->
    <section class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-5 shadow-lg space-y-4">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">3. Live Stripe Hand-Off Engine</h2>
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Stripe Payment Link URL</label>
        <input type="text" id="stripeUrl" placeholder="https://buy.stripe.com/..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div class="flex items-center justify-between pt-2">
        <span id="statusBadge" class="text-xs bg-slate-700 text-slate-300 px-3 py-1 rounded-full">STATUS: READY</span>
        <button onclick="generateStripeInvoice()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-lg text-sm shadow-lg transition flex items-center gap-2">
          🚀 GENERATE STRIPE INVOICE &amp; PAY
        </button>
      </div>
    </section>

  </div>

  <script>
    let items = [];
    let stops = [];

    function addStop() {
      const time = document.getElementById('appTime').value;
      const client = document.getElementById('clientName').value;
      const address = document.getElementById('clientAddress').value;
      if (!client) return;

      stops.unshift({ time, client, address });
      renderStops();
    }

    function renderStops() {
      const q = document.getElementById('scheduleQueue');
      q.innerHTML = stops.map(s => `
        <div class="bg-slate-900/60 border border-slate-700/40 p-3 rounded-lg flex justify-between items-center text-xs text-slate-300">
          <span class="font-bold text-indigo-400">${s.time}</span>
          <span class="font-medium text-white">${s.client}</span>
          <span class="text-slate-400">${s.address || 'No address provided'}</span>
        </div>
      `).join('');
    }

    function addItem(name, price) {
      items.push({ name, price });
      renderInvoice();
    }

    function renderInvoice() {
      const tb = document.getElementById('invoiceTable');
      if (items.length === 0) {
        tb.innerHTML = '<tr><td colspan="2" class="p-3 text-center text-slate-500 text-xs">No items selected yet</td></tr>';
        document.getElementById('subtotalAmount').innerText = '$0.00';
        return;
      }
      tb.innerHTML = items.map(i => `
        <tr>
          <td class="p-3 text-white">${i.name}</td>
          <td class="p-3 text-right text-emerald-400 font-mono">$${i.price.toFixed(2)}</td>
        </tr>
      `).join('');
      const subtotal = items.reduce((acc, i) => acc + i.price, 0);
      document.getElementById('subtotalAmount').innerText = `$${subtotal.toFixed(2)}`;
    }

    function generateStripeInvoice() {
      const url = document.getElementById('stripeUrl').value;
      const badge = document.getElementById('statusBadge');

      badge.innerText = "STATUS: INVOICE CREATED";
      badge.className = "text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-3 py-1 rounded-full font-bold";

      if (url) {
        window.open(url, '_blank');
      } else {
        alert("Invoice generated! Please paste a valid Stripe Payment Link URL to launch checkout directly.");
      }
    }
  </script>
</body>
</html>
